`;

      function rmMetricClass(v) {
        if (v === "L") return "metric metric-low";
        if (v === "M") return "metric metric-medium";
        if (v === "H") return "metric metric-high";
        return "metric metric-unknown";
      }
      function rmPrioClass(v) {
        return "prio prio-" + String(v || "unknown").toLowerCase();
      }
      function rmBarClass(v) {
        return "on-" + String(v || "backlog").toLowerCase();
      }
      function rmSrcClass(v) {
        const k = { "CURRENT TASK": "cur", FEATURE: "feat", "UI/UX": "ui", BACKLOG: "bl" }[v] || "bl";
        return "src-badge src-" + k;
      }
      /* the theme tokens live in the prototype <style>; Roadmap may render before
         Big Picture was ever opened, so inject the same sheet under the same id */
      async function ensureBpTokenCss() {
        if (document.getElementById("_bp_css_injected")) return;
        try {
          const r = await fetch(
            `/api/files/content?path=${encodeURIComponent(RM_PROTO_PATH)}`
          );
          if (!r.ok) return;
          const doc = new DOMParser().parseFromString(
            await r.text(),
            "text/html"
          );
          const styleEl = doc.querySelector("style");
          if (!styleEl || document.getElementById("_bp_css_injected")) return;
          const s = document.createElement("style");
          s.id = "_bp_css_injected";
          s.textContent = styleEl.textContent;
          document.head.appendChild(s);
        } catch {}
      }
      function ensureRoadmapCss() {
        if (document.getElementById("_roadmap_css")) return;
        const s = document.createElement("style");
        s.id = "_roadmap_css";
        s.textContent = RM_CSS;
        document.head.appendChild(s);
      }

      /* inline text editor: click to edit, commit on blur/Enter, cancel on Esc.
         multiline=true → textarea for description. ponytail: uncontrolled defaultValue
         + commit-on-blur, no per-keystroke state; add controlled value if live
         validation is ever needed. */
      function RmEdit({ value, onCommit, placeholder }) {
        const [editing, setEditing] = React.useState(false);
        const ref = React.useRef(null);
        React.useEffect(() => {
          if (editing && ref.current) {
            ref.current.focus();
            ref.current.select && ref.current.select();
            // auto-grow textarea to fit content
            const resize = () => {
              if (!ref.current) return;
              ref.current.style.height = "auto";
              ref.current.style.height = ref.current.scrollHeight + "px";
            };
            resize();
            ref.current.addEventListener("input", resize);
            return () => ref.current?.removeEventListener("input", resize);
          }
        }, [editing]);
        const commit = () => {
          const v = ref.current ? ref.current.value.trim() : value;
          setEditing(false);
          if (v !== (value || "")) onCommit(v);
        };
        if (!editing)
          return (
            <span
              className="rm-editable"
              tabIndex={0}
              title="Double-click to edit"
              onDoubleClick={() => setEditing(true)}
              onKeyDown={(e) => {
                if (e.key === "Enter" || e.key === "F2") setEditing(true);
              }}
            >
              {value || <span className="rm-ph">{placeholder || "—"}</span>}
            </span>
          );
        return (
          <textarea
            ref={ref}
            className="rm-input"
            defaultValue={value || ""}
            onBlur={commit}
            onKeyDown={(e) => {
              if (e.key === "Escape") {
                e.stopPropagation();
                setEditing(false);
              } else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
                e.preventDefault();
                commit();
              }
            }}
            style={{ overflow: "hidden", minHeight: "28px" }}
          />
        );
      }

      /* §78/§79/§133 combobox: badge at rest, menu on interaction, no layout shift */
      function RmCombo({
        value,
        options,
        onChange,
        width,
        searchable,
        renderValue,
        label,
      }) {
        const [open, setOpen] = React.useState(false);
        const [q, setQ] = React.useState("");
        const [hl, setHl] = React.useState(0);
        const [menuPos, setMenuPos] = React.useState(null); // {left,top,width} fixed coords when open (portal escapes scroll clip)
        const rootRef = React.useRef(null);
        const inputRef = React.useRef(null);
        const menuRef = React.useRef(null);

        const all = React.useMemo(
          () =>
            options.map((o) => (typeof o === "string" ? { v: o, label: o } : o)),
          [options]
        );
        const opts = React.useMemo(() => {
          if (!searchable || !q.trim()) return all;
          const needle = q.trim().toLowerCase();
          return all.filter((o) => o.label.toLowerCase().includes(needle));
        }, [all, q, searchable]);

        React.useEffect(() => {
          if (!open) return;
          const onDown = (e) => {
            if (
              rootRef.current && !rootRef.current.contains(e.target) &&
              (!menuRef.current || !menuRef.current.contains(e.target))
            )
              setOpen(false);
          };
          document.addEventListener("mousedown", onDown);
          return () => document.removeEventListener("mousedown", onDown);
        }, [open]);

        React.useEffect(() => {
          if (open && searchable && inputRef.current) inputRef.current.focus();
        }, [open, searchable]);

        const placeMenu = React.useCallback(() => {
          const el = rootRef.current;
          if (!el) return;
          const r = el.getBoundingClientRect();
          const menuW = Math.max(r.width, 160);
          const spaceBelow = window.innerHeight - r.bottom;
          const below = spaceBelow > 200 || spaceBelow > r.top;
          setMenuPos({
            left: Math.min(r.left, window.innerWidth - menuW - 8),
            top: below ? r.bottom + 2 : undefined,
            bottom: below ? undefined : window.innerHeight - r.top + 2,
            width: menuW,
          });
        }, []);

        React.useEffect(() => {
          if (!open) return;
          placeMenu();
          const onScroll = () => placeMenu();
          window.addEventListener("scroll", onScroll, true); // capture: any ancestor scroll
          window.addEventListener("resize", onScroll);
          return () => {
            window.removeEventListener("scroll", onScroll, true);
            window.removeEventListener("resize", onScroll);
          };
        }, [open, placeMenu]);

        function openMenu() {
          const i = all.findIndex((o) => o.v === value);
          setQ("");
          setHl(i < 0 ? 0 : i);
          setOpen(true);
        }
        function pick(o) {
          if (o && o.v !== value) onChange(o.v);
          setOpen(false);
        }
        function onKeyDown(e) {
          if (e.key === "Escape") {
            if (!open) return;
            e.stopPropagation();
            e.preventDefault();
            setOpen(false);
            return;
          }
          if (!open) {
            if (e.key === "Enter" || e.key === " " || e.key === "ArrowDown") {
              e.preventDefault();
              openMenu();
            }
            return;
          }
          if (e.key === "ArrowDown") {
            e.preventDefault();
            setHl((h) => (opts.length ? (h + 1) % opts.length : 0));
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            setHl((h) => (opts.length ? (h - 1 + opts.length) % opts.length : 0));
          } else if (e.key === "Enter") {
            e.preventDefault();
            pick(opts[hl]);
          } else if (e.key === "Tab") {
            setOpen(false);
          }
        }

        return (
          <div
            className={"rm-combo" + (open ? " open" : "")}
            style={{ width }}
            ref={rootRef}
            onKeyDown={onKeyDown}
          >
            <div
              className="rm-trigger"
              role="combobox"
              tabIndex={0}
              aria-expanded={open}
              aria-haspopup="listbox"
              aria-label={label}
              onClick={() => (open ? setOpen(false) : openMenu())}
            >
              {renderValue ? (
                renderValue(value)
              ) : (
                <span className="rm-txt" title={value || undefined}>{value || "—"}</span>
              )}
              <span className="rm-caret">▾</span>
            </div>
            {open && menuPos && ReactDOM.createPortal(
              <div
                ref={menuRef}
                className="rm-menu rm-menu-fixed"
                role="listbox"
                aria-label={label}
                style={{
                  position: "fixed",
                  left: menuPos.left,
                  top: menuPos.top,
                  bottom: menuPos.bottom,
                  minWidth: menuPos.width,
                }}
              >
                {searchable && (
                  <input
                    ref={inputRef}
                    className="rm-search"
                    placeholder="Search…"
                    value={q}
                    onChange={(e) => {
                      setQ(e.target.value);
                      setHl(0);
                    }}
                  />
                )}
                {opts.length === 0 && <div className="rm-empty">No match</div>}
                {opts.map((o, i) => (
                  <div
                    key={o.v}
                    role="option"
                    aria-selected={o.v === value}
                    className={
                      "rm-opt" +
                      (i === hl ? " hl" : "") +
                      (o.v === value ? " sel" : "")
                    }
                    onMouseEnter={() => setHl(i)}
                    onClick={() => pick(o)}
                  >
                    {o.label}
                  </div>
                ))}
              </div>,
              document.body
            )}
          </div>
        );
      }

      function RoadmapView({ themeId }) {
        const [tasks, setTasks] = React.useState(null);
        const RM_DEFAULT_MONTHS = ["Sep", "Oct", "Nov", "Dec"];
        const [months, setMonths] = React.useState(RM_DEFAULT_MONTHS);
        const [err, setErr] = React.useState("");
        const [saved, setSaved] = React.useState(false);
        const [q, setQ] = React.useState("");
        const savedTimer = React.useRef(null);
        const wrapRef = React.useRef(null);
        const stickyRef = React.useRef(null);
        const panelRef = React.useRef(null);
        const svgRef = React.useRef(null);
        const [hotId, setHotId] = React.useState(null);
        const [expandedId, setExpandedId] = React.useState(null); // roadmap row detail panel
        const [wpCache, setWpCache] = React.useState({}); // {opId: {loading|error|data}}
        // scheduler config (§ timeline-scheduling-formula.md): team capacity knobs
        const RM_DEFAULT_CFG = { dev: 2, qa: 1, cap: 0.8 };
        const [cfg, setCfg] = React.useState(RM_DEFAULT_CFG);
        const [deferred, setDeferred] = React.useState([]); // ids blocked-downstream, unscheduled
        const [preview, setPreview] = React.useState(null); // {id:{lo,hi}} scheduler result, not committed until Apply

        React.useEffect(() => {
          let alive = true;
          ensureRoadmapCss();
          ensureBpTokenCss();
          (async () => {
            try {
              const storedCfg = await loadRoadmapIDB("roadmap_cfg_v1");
              if (alive && storedCfg && typeof storedCfg === "object")
                setCfg({ ...RM_DEFAULT_CFG, ...storedCfg });
              const storedMonths = await loadRoadmapIDB("roadmap_months_v1");
              if (alive && Array.isArray(storedMonths) && storedMonths.length)
                setMonths(storedMonths);
              const stored = await loadRoadmapIDB();
              if (!alive) return;
              // always fetch seed — used as source for new scheduler fields (status/dependency/risk)
              let seed = null;
              try {
                const rs = await fetch(`/api/files/content?path=${encodeURIComponent(RM_SEED_PATH)}`);
                if (rs.ok) seed = JSON.parse(await rs.text());
              } catch {}
              if (!alive) return;
              // normalize: fill scheduler fields. seed value by id → else default.
              // manual-added rows (not in seed) keep their own or get active/[]/1.
              const seedById = Object.fromEntries((seed || []).map((s) => [s.id, s]));
              const normalize = (t) => {
                const s = seedById[t.id];
                return {
                  ...t,
                  status: t.status || (s && s.status) || "active",
                  dependency: t.dependency != null ? t.dependency : (s && s.dependency) || [],
                  risk: t.risk != null ? t.risk : (s && s.risk) || 1,
                  pm_front_weeks: t.pm_front_weeks != null ? t.pm_front_weeks : (s && s.pm_front_weeks) || 0,
                };
              };
              if (Array.isArray(stored) && stored.length) {
                const norm = stored.map(normalize);
                setTasks(norm);
                saveRoadmapIDB(norm); // persist normalized so it only runs once
                return;
              }
              if (!seed) throw new Error("seed fetch failed");
              setTasks(seed);
              saveRoadmapIDB(seed);
            } catch (e) {
              if (alive) setErr(e.message || String(e));
            }
          })();
          return () => {
            alive = false;
            clearTimeout(savedTimer.current);
          };
        }, []);

        /* §123-§124 seam for M2 (timeline) and M3 (drag/resize/undo):
           patch any field of a task — including `schedule` — and autosave. */
        const updateTask = React.useCallback((id, patch) => {
          setTasks((prev) => {
            if (!prev) return prev;
            const next = prev.map((t) => (t.id === id ? { ...t, ...patch } : t));
            saveRoadmapIDB(next);
            return next;
          });
          setSaved(true);
          clearTimeout(savedTimer.current);
          savedTimer.current = setTimeout(() => setSaved(false), 1200);
        }, []);

        const [focusId, setFocusId] = React.useState(null);
        const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        const addMonth = React.useCallback(() => {
          setMonths((prev) => {
            const last = prev[prev.length - 1];
            const li = MONTH_NAMES.indexOf(last);
            const nextName = MONTH_NAMES[(li + 1) % 12]; // wrap Dec→Jan
            const next = [...prev, nextName];
            saveRoadmapIDB(next, "roadmap_months_v1");
            return next;
          });
        }, []);
        const addTask = React.useCallback((cur, noSchedule) => {
          const id = "t" + Date.now().toString(36);
          setTasks((prev) => {
            const list = prev || [];
            const maxRank = list.reduce((m, t) => Math.max(m, t.rank || 0), 0);
            const next = [
              ...list,
              {
                id,
                rank: maxRank + 1,
                task: "New task",
                strategicArea: "",
                sourceColumn: "FEATURE",
                desc: "",
                effort: "",
                impact: "",
                testing: "",
                priority: "P3",
                current: !!cur,
                // ponytail: Next gets a 1-week schedule starting this month; Backlog gets none
                schedule: cur || noSchedule ? null : { start: { month: months[0], week: 1 }, end: { month: months[0], week: 2 } },
              },
            ];
            saveRoadmapIDB(next);
            return next;
          });
          setQ("");
          setFocusId(id);
        }, []);
        const removeTask = React.useCallback((id) => {
          setTasks((prev) => {
            const next = (prev || []).filter((t) => t.id !== id);
            saveRoadmapIDB(next);
            return next;
          });
        }, []);

        /* §80-116 timeline: per-month split into 4 weeks; drag-select any week
           span. Backlog stays a single cell (clear schedule). Schedule stores
           {month,week} at both ends; internally we use a linear week-slot index
           0..15 (Sep w1 = 0 … Dec w4 = 15). */
        const RM_SLOTS = months.length * 4; // 4 weeks per month
        const slotOf = (month, week) => {
          const mi = months.indexOf(month);
          return mi < 0 ? -1 : mi * 4 + (week - 1);
        };
        const slotMonth = (i) => months[Math.floor(i / 4)];
        // total table columns: 11 frozen + weeks + 1 backlog
        const RM_COLSPAN = 11 + RM_SLOTS + 1;
        const slotWeek = (i) => (i % 4) + 1;
        const [drag, setDrag] = React.useState(null); // {id, a, b} week-slot indices
        React.useEffect(() => {
          if (!drag) return;
          const commit = () => {
            const lo = Math.min(drag.a, drag.b),
              hi = Math.max(drag.a, drag.b);
            updateTask(drag.id, {
              schedule: {
                start: { month: slotMonth(lo), week: slotWeek(lo) },
                end: { month: slotMonth(hi), week: slotWeek(hi) },
              },
            });
            setDrag(null);
          };
          window.addEventListener("mouseup", commit);
          return () => window.removeEventListener("mouseup", commit);
        }, [drag, updateTask]);
        // week-slot span [lo,hi] a task's bar covers, or null for backlog/unscheduled
        const schedSpan = (t) => {
          if (drag && drag.id === t.id)
            return [Math.min(drag.a, drag.b), Math.max(drag.a, drag.b)];
          if (!t.schedule) return null;
          const lo = slotOf(t.schedule.start.month, t.schedule.start.week);
          const hi = slotOf(t.schedule.end.month, t.schedule.end.week);
          return lo < 0 || hi < 0 ? null : [lo, hi];
        };

        /* ── Auto-scheduler (§ timeline-scheduling-formula.md v2) ──────────────
           Greedy list-scheduling: DEV_WEEKS/QA_WEEKS from effort/testing, priority
           score picks order, dev+qa lanes cap parallelism, deps honored (qa_end),
           HOLD inert / BLOCKED defers downstream. Writes each task's schedule
           {start,end} in week granularity. Validated against Python self-check. */
        const DEV_WEEKS = { L: 2, M: 4, H: 8 };
        const QA_WEEKS = { L: 1, M: 2, H: 3 };
        const IMPW = { H: 3, M: 2, L: 1 };
        const EFFINV = { L: 3, M: 2, H: 1 };
        const prioScore = (t) => {
          const P = { P1: 3, P2: 2, P3: 1, Backlog: 0 }[t.priority] || 0;
          return (
            P * 1000 +
            (IMPW[t.impact] || 0) * 100 +
            (EFFINV[t.effort] || 0) * 10 +
            ({ L: 3, M: 2, H: 1 }[t.testing] || 0)
          );
        };
        const computeSchedule = React.useCallback(() => {
          const prev = tasks;
          if (!prev) return;
          const cap = cfg.cap > 0 ? cfg.cap : 0.8;
          const nDev = Math.max(1, cfg.dev | 0);
          const nQa = Math.max(1, cfg.qa | 0);
          const byId = Object.fromEntries(prev.map((t) => [t.id, t]));
          const isHold = (t) => t.status === "hold";
          const isBlocked = (t) => t.status === "blocked";
          // section = current | next | backlog (derived same as groups memo).
          // backlog is NOT scheduled — leave unscheduled so it stays backlog.
          const sectionOf = (t) => (t.current ? "current" : t.schedule ? "next" : "backlog");
          const SECT = { current: 2, next: 1, backlog: 0 };
          const active = prev.filter(
            (t) => !isHold(t) && !isBlocked(t) && sectionOf(t) !== "backlog"
          );
          const blockedIds = new Set(prev.filter(isBlocked).map((t) => t.id));
          const devFree = new Array(nDev).fill(0);
          const qaFree = new Array(nQa).fill(0);
          const done = {}; // id -> [devEnd, qaEnd]
          const result = {}; // id -> {devStart, devEnd, qaEnd}
          const remaining = new Set(active.map((t) => t.id));
          const depsOf = (t) =>
            Array.isArray(t.dependency) ? t.dependency : t.dependency ? [t.dependency] : [];
          const depOk = (t) => {
            for (const d of depsOf(t)) {
              if (blockedIds.has(d)) return false; // BLOCKED dep → block downstream
              const dt = byId[d];
              if (!dt) continue; // stale/cross id → inert
              if (isHold(dt)) continue; // HOLD dep → inert
              if (remaining.has(d)) return false; // not scheduled yet
            }
            return true;
          };
          let guard = 0;
          while (remaining.size && guard++ < 2000) {
            let ready = active.filter((t) => remaining.has(t.id) && depOk(t));
            if (!ready.length) break; // rest blocked-downstream → deferred
            // section tier first (current before next), then priority score
            ready.sort(
              (a, b) =>
                SECT[sectionOf(b)] - SECT[sectionOf(a)] ||
                prioScore(b) - prioScore(a) ||
                (a.rank || 0) - (b.rank || 0)
            );
            const t = ready[0];
            const est = Math.max(0, ...depsOf(t).map((d) => (done[d] ? done[d][1] : 0)));
            const pm = t.pm_front_weeks || 0;
            const dl = devFree.indexOf(Math.min(...devFree));
            const dStart = Math.max(devFree[dl], est, pm);
            const risk = t.risk || 1;
            const dEnd = dStart + ((DEV_WEEKS[t.effort] || 4) * risk) / cap;
            devFree[dl] = dEnd;
            const ql = qaFree.indexOf(Math.min(...qaFree));
            const qStart = Math.max(qaFree[ql], dEnd);
            const qEnd = qStart + (QA_WEEKS[t.testing] || 2) / cap;
            qaFree[ql] = qEnd;
            done[t.id] = [dEnd, qEnd];
            result[t.id] = { dStart, dEnd, qEnd };
            remaining.delete(t.id);
          }
          setDeferred([...remaining]);
          // auto-extend months so every task gets its real slot (no pile-up clamp).
          // makespan can exceed the visible 4-month window; grow `months` to fit.
          let maxWeek = 0;
          for (const id in result) maxWeek = Math.max(maxWeek, Math.ceil(result[id].dEnd));
          const neededMonths = Math.max(months.length, Math.ceil(maxWeek / 4));
          let cols = months;
          if (neededMonths > months.length) {
            const ext = [...months];
            while (ext.length < neededMonths) {
              const li = MONTH_NAMES.indexOf(ext[ext.length - 1]);
              ext.push(MONTH_NAMES[(li + 1) % 12]);
            }
            cols = ext;
            setMonths(ext);
            saveRoadmapIDB(ext, "roadmap_months_v1");
          }
          const maxSlot = cols.length * 4 - 1;
          const prov = {};
          for (const id in result) {
            const r = result[id];
            const lo = Math.min(maxSlot, Math.round(r.dStart));
            const hi = Math.min(maxSlot, Math.max(lo, Math.round(r.dEnd) - 1));
            prov[id] = { lo, hi };
          }
          setPreview(prov); // preview only — commit via Apply
        }, [tasks, cfg, months]);

        // commit preview → write schedule to tasks + persist
        const applyPreview = React.useCallback(() => {
          if (!preview) return;
          setTasks((prev) => {
            if (!prev) return prev;
            const next = prev.map((t) => {
              const r = preview[t.id];
              if (!r) return t; // untouched (hold/blocked/backlog/deferred)
              return {
                ...t,
                schedule: {
                  start: { month: slotMonth(r.lo), week: slotWeek(r.lo) },
                  end: { month: slotMonth(r.hi), week: slotWeek(r.hi) },
                },
              };
            });
            saveRoadmapIDB(next);
            return next;
          });
          setPreview(null);
          setSaved(true);
          clearTimeout(savedTimer.current);
          savedTimer.current = setTimeout(() => setSaved(false), 1200);
        }, [preview]);

        const discardPreview = React.useCallback(() => setPreview(null), []);

        // per-week-slot task count → overload highlight when count > dev lanes
        const slotLoad = React.useMemo(() => {
          const load = {};
          (tasks || []).forEach((t) => {
            if (t.status === "hold" || t.status === "blocked") return;
            // preview active → count ghost span; else committed schedule
            const pv = preview && preview[t.id];
            const sp = pv
              ? [pv.lo, pv.hi]
              : t.schedule
              ? [
                  slotOf(t.schedule.start.month, t.schedule.start.week),
                  slotOf(t.schedule.end.month, t.schedule.end.week),
                ]
              : null;
            if (!sp || sp[0] < 0) return;
            for (let s = sp[0]; s <= sp[1]; s++) load[s] = (load[s] || 0) + 1;
          });
          return load;
        }, [tasks, months, preview]);


        /* KPI derived live from tasks — never hardcoded (§ prototype used static 30) */
        const kpi = React.useMemo(() => {
          const list = tasks || [];
          const by = (p) => list.filter((t) => t.priority === p).length;
          return {
            total: list.length,
            current: list.filter((t) => t.current).length,
            p1: by("P1"),
            p2: by("P2"),
            p3: by("P3"),
            backlog: by("Backlog"),
          };
        }, [tasks]);

        /* §121 revised (user 2026-09-11): sort by Priority Rule, not manual rank.
           Priority (P1>P2>P3>Backlog) → Impact (H>M>L) → Effort (L>M>H) →
           Testing (L>M>H). Unknown metric sorts last. rank kept only as final
           tiebreak so order is deterministic. */
        const groups = React.useMemo(() => {
          const PRIO = { P1: 0, P2: 1, P3: 2, Backlog: 3 };
          const HIGH = { H: 0, M: 1, L: 2 }; // impact: high first
          const LOW = { L: 0, M: 1, H: 2 }; // effort/testing: low first
          const g = (map, v) => (v in map ? map[v] : 9);
          const cmp = (a, b) =>
            g(PRIO, a.priority) - g(PRIO, b.priority) ||
            g(HIGH, a.impact) - g(HIGH, b.impact) ||
            g(LOW, a.effort) - g(LOW, b.effort) ||
            g(LOW, a.testing) - g(LOW, b.testing) ||
            (a.rank || 0) - (b.rank || 0);
          const needle = q.trim().toLowerCase();
          const hit = (t) =>
            !needle ||
            [t.task, t.desc, t.strategicArea, t.sourceColumn, t.priority]
              .filter(Boolean)
              .some((s) => s.toLowerCase().includes(needle));
          const list = (tasks || []).filter(hit).sort(cmp);
          // enforce dependency order within a section: a task appears below all
          // its deps. Stable topo (Kahn) using cmp for the ready-set tiebreak so
          // priority order is preserved except where a dep forces a later slot.
          const depsOf = (t) =>
            (Array.isArray(t.dependency)
              ? t.dependency
              : t.dependency
              ? [t.dependency]
              : []);
          const ordered = (rows) => {
            const byId = new Map(rows.map((t) => [t.id, t]));
            const done = new Set();
            const out = [];
            let guard = rows.length + 1;
            while (out.length < rows.length && guard-- > 0) {
              for (const t of rows) {
                if (done.has(t.id)) continue;
                // ready when every in-section dep is already placed
                const ready = depsOf(t).every(
                  (d) => !byId.has(d) || done.has(d)
                );
                if (ready) {
                  out.push(t);
                  done.add(t.id);
                }
              }
            }
            // cycle fallback: append any leftover in cmp order
            if (out.length < rows.length)
              for (const t of rows) if (!done.has(t.id)) out.push(t);
            return out;
          };
          const cur = ordered(list.filter((t) => t.current));
          const next = ordered(list.filter((t) => !t.current && t.schedule));
          const backlog = ordered(list.filter((t) => !t.current && !t.schedule));
          return [
            { key: "current", label: "CURRENT TASKS — START NOW", rows: cur, section: "current" },
            { key: "next", label: "NEXT UP", rows: next, section: "next" },
            { key: "backlog", label: "BACKLOG", rows: backlog, section: "backlog" },
          ].filter((g) => g.rows.length);
        }, [tasks, q]);

        // after adding a task, scroll it into view and focus its name cell
        React.useEffect(() => {
          if (!focusId) return;
          const row = document.querySelector('[data-tid="' + focusId + '"]');
          if (!row) return;
          row.scrollIntoView({ behavior: "smooth", block: "center" });
          const edit = row.querySelector(".rm-editable");
          if (edit) edit.dispatchEvent(new MouseEvent("dblclick", { bubbles: true }));
          setFocusId(null);
        }, [focusId, groups]);

        /* dependency picker: a task can depend on many others, and any task can
           be a dependency of many rows. Store t.dependency as an id array
           (back-compat: coerce legacy string / null). Render names via lookup. */
        const nameById = React.useMemo(() => {
          const m = {};
          (tasks || []).forEach((t) => (m[t.id] = t.task));
          return m;
        }, [tasks]);
        // legacy string / null → array of dep ids
        const depList = (t) =>
          Array.isArray(t.dependency)
            ? t.dependency
            : t.dependency
            ? [t.dependency]
            : [];

        // fetch a single OpenProject work package by id (server proxy), cache result
        const fetchWp = React.useCallback((opId) => {
          if (!opId) return;
          setWpCache((c) => ({ ...c, [opId]: { loading: true } }));
          fetch(`/api/dashboard/openproject/work-package/${encodeURIComponent(opId)}`)
            .then((r) => r.json())
            .then((j) => {
              if (!j.ok) throw new Error(j.error || "fetch failed");
              setWpCache((c) => ({ ...c, [opId]: { data: j.workPackage } }));
            })
            .catch((e) => setWpCache((c) => ({ ...c, [opId]: { error: e.message } })));
        }, []);
        const RM_PRD_STATES = ["", "Draft", "Review", "Approved", "Done"];

        // freeze the identity/metadata columns horizontally: only the timeline
        // scrolls sideways. Compute cumulative left from the header's sticky-cell
        // widths (running sum), then apply by column index to every row — avoids
        // offsetLeft positioned-ancestor quirks that leave a phantom left gutter.
        React.useEffect(() => {
          const panel = wrapRef.current
            ? wrapRef.current.querySelector(".table-panel")
            : null;
          if (!panel) return;
          const sync = () => {
            const head = panel.querySelector("thead tr");
            if (!head) return;
            const headSl = head.querySelectorAll(".sl");
            const lefts = [];
            let acc = 0;
            headSl.forEach((c) => {
              lefts.push(acc);
              acc += c.offsetWidth;
            });
            panel.querySelectorAll("tr").forEach((tr) => {
              tr.querySelectorAll(".sl").forEach((cell, i) => {
                if (lefts[i] != null) cell.style.left = lefts[i] + "px";
              });
            });
          };
          sync();
          const ro = new ResizeObserver(sync);
          ro.observe(panel);
          return () => ro.disconnect();
        }, [tasks, groups]);

        /* dependency connectors: elbow lines in the left gutter between the rank
           cells of a dep and its dependent — visible even when F is in P1 and A
           is far below in P3. Redrawn on data/hover/scroll (anchors sit on sticky
           cells, so horizontal scroll shifts their content-x). */
        React.useEffect(() => {
          const panel = panelRef.current, svg = svgRef.current;
          if (!panel || !svg) return;
          let raf = 0;
          const NS = "http://www.w3.org/2000/svg";
          const draw = () => {
            raf = 0;
            const pr = panel.getBoundingClientRect();
            svg.setAttribute("width", panel.scrollWidth);
            svg.setAttribute("height", panel.scrollHeight);
            while (svg.firstChild) svg.removeChild(svg.firstChild);
            panel.querySelectorAll("tr.dep-hot").forEach((r) => r.classList.remove("dep-hot"));
            const rowOf = {};
            panel.querySelectorAll("tr[data-tid]").forEach((r) => (rowOf[r.dataset.tid] = r));
            const pt = (r) => {
              const c = r.querySelector("td.num") || r;
              const cr = c.getBoundingClientRect();
              return { x: cr.right - pr.left + panel.scrollLeft - 6,
                       y: cr.top - pr.top + panel.scrollTop + cr.height / 2 };
            };
            let lane = 0;
            (tasks || []).forEach((t) => {
              const to = rowOf[t.id];
              if (!to) return;
              depList(t).forEach((d) => {
                const from = rowOf[d];
                if (!from || from === to) return;
                const a = pt(from), b = pt(to);
                const x = panel.scrollLeft + 6 + (lane++ % 4) * 4;
                const hot = hotId === t.id || hotId === d;
                const p = document.createElementNS(NS, "path");
                p.setAttribute("d", `M ${a.x} ${a.y} C ${x} ${a.y} ${x} ${b.y} ${b.x} ${b.y}`);
                if (hot) p.setAttribute("class", "hot");
                svg.appendChild(p);
                [[a, 2.2], [b, 3.2]].forEach(([n, r]) => {
                  const c = document.createElementNS(NS, "circle");
                  c.setAttribute("cx", n.x); c.setAttribute("cy", n.y); c.setAttribute("r", r);
                  if (hot) c.setAttribute("class", "hot");
                  svg.appendChild(c);
                });
                if (hot) { from.classList.add("dep-hot"); to.classList.add("dep-hot"); }
              });
            });
          };
          const onScroll = () => { if (!raf) raf = requestAnimationFrame(draw); };
          draw();
          panel.addEventListener("scroll", onScroll);
          const ro = new ResizeObserver(onScroll);
          ro.observe(panel);
          return () => { panel.removeEventListener("scroll", onScroll); ro.disconnect(); if (raf) cancelAnimationFrame(raf); };
        }, [tasks, groups, hotId]);

        if (err)
          return (
            <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", color:"var(--text-5)", fontSize:12 }}>
              Error loading roadmap: {err}
            </div>
          );
        if (!tasks)
          return (
            <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", color:"var(--text-5)", fontSize:12 }}>
              Loading…
            </div>
          );

        const level = (t, field) => (
          <RmCombo
            width={78}
            value={t[field]}
            options={RM_LEVELS}
            onChange={(v) => updateTask(t.id, { [field]: v })}
            label={`${field} for ${t.task}`}
            renderValue={(v) => (
              <span className={rmMetricClass(v)}>{v || "—"}</span>
            )}
          />
        );

        return (
          <div style={{ flex:1, minHeight:0, display:"flex", flexDirection:"column", overflow:"hidden", background:"var(--app-bg)" }}>
            <div className="bp-root rm-flexroot" data-theme={themeId || "navy"}>
              <div className="rm-wrap rm-flexcol" ref={wrapRef}>
                <div className="rm-sticky" ref={stickyRef}>
                <div className="rm-head">
                  <span className="rm-title">Roadmap</span>
                  <span className="rm-sub">
                    {(() => {
                      const shown = groups.reduce((n, g) => n + g.rows.length, 0);
                      return q.trim()
                        ? `${shown} / ${tasks.length} tasks`
                        : `${tasks.length} tasks · manual priority · autosaved`;
                    })()}
                  </span>
                  <input
                    type="search"
                    className="rm-search"
                    placeholder="Search tasks…"
                    value={q}
                    onChange={(e) => setQ(e.target.value)}
                  />
                  <button type="button" className="rm-addbtn" onClick={() => addTask(true)}>
                    + Current
                  </button>
                  <button type="button" className="rm-addbtn rm-addnext" onClick={() => addTask(false)}>
                    + Next
                  </button>
                  <button type="button" className="rm-addbtn rm-addnext" onClick={() => addTask(false, true)} title="Add unscheduled task">
                    + Backlog
                  </button>
                  <button type="button" className="rm-addbtn rm-addnext" onClick={addMonth} title="Tambah bulan berikutnya ke timeline">
                    + Month
                  </button>
                  <span className={"rm-saved" + (saved ? " on" : "")}>Saved</span>
                </div>
                {deferred.length > 0 && (
                  <div className="rm-deferred" role="status">
                    ⚠ {deferred.length} task ter-defer (dependency BLOCKED): {deferred.join(", ")}
                  </div>
                )}

                <div className="stats-row">
                  <div className="stat-block">
                    <div className="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h5"/></svg></div>
                    <div><div className="stat-num">{kpi.total}</div><div className="stat-label">Total Tasks</div></div>
                  </div>
                  <div className="stat-block">
                    <div className="stat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
                    <div><div className="stat-num">{kpi.current}</div><div className="stat-label">Current Tasks</div></div>
                  </div>
                  <div className="stat-block">
                    <div className="stat-icon" style={{background:"var(--priority-p1-bg)",color:"var(--priority-p1-fg)"}}><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg></div>
                    <div>
                      <div><span className="stat-badge" style={{background:"var(--priority-p1-bg)",color:"var(--priority-p1-fg)"}}>● P1</span></div>
                      <div className="stat-num">{kpi.p1}</div><div className="stat-label">(Kerjakan dulu)</div>
                    </div>
                  </div>
                  <div className="stat-block">
                    <div className="stat-icon" style={{background:"var(--priority-p2-bg)",color:"var(--priority-p2-fg)"}}><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg></div>
                    <div>
                      <div><span className="stat-badge" style={{background:"var(--priority-p2-bg)",color:"var(--priority-p2-fg)"}}>● P2</span></div>
                      <div className="stat-num">{kpi.p2}</div>
                    </div>
                  </div>
                  <div className="stat-block">
                    <div className="stat-icon" style={{background:"var(--priority-p3-bg)",color:"var(--priority-p3-fg)"}}><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.5 6H21l-5 4 2 7-6-4-6 4 2-7-5-4h6.5z"/></svg></div>
                    <div>
                      <div><span className="stat-badge" style={{background:"var(--priority-p3-bg)",color:"var(--priority-p3-fg)"}}>● P3</span></div>
                      <div className="stat-num">{kpi.p3}</div>
                    </div>
                  </div>
                  {kpi.backlog > 0 && (
                    <div className="stat-block">
                      <div className="stat-icon" style={{background:"var(--priority-backlog-bg)",color:"var(--priority-backlog-fg)"}}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"/></svg></div>
                      <div>
                        <div><span className="stat-badge" style={{background:"var(--priority-backlog-bg)",color:"var(--priority-backlog-fg)"}}>● Backlog</span></div>
                        <div className="stat-num">{kpi.backlog}</div><div className="stat-label">(Belum ready)</div>
                      </div>
                    </div>
                  )}

                  <div className="rules-area">
                    <div className="rule-box rule-cfg">
                      <div className="rule-title">Auto-Schedule</div>
                      <div className="cfg-row">
                        <label>Dev<input type="number" min="1" max="9" value={cfg.dev}
                          onChange={(e) => { const v = { ...cfg, dev: Math.max(1, +e.target.value || 1) }; setCfg(v); saveRoadmapIDB(v, "roadmap_cfg_v1"); }} /></label>
                        <label>QA<input type="number" min="1" max="9" value={cfg.qa}
                          onChange={(e) => { const v = { ...cfg, qa: Math.max(1, +e.target.value || 1) }; setCfg(v); saveRoadmapIDB(v, "roadmap_cfg_v1"); }} /></label>
                        <label>Cap<input type="number" min="0.1" max="1" step="0.05" value={cfg.cap}
                          onChange={(e) => { const v = { ...cfg, cap: Math.min(1, Math.max(0.1, +e.target.value || 0.8)) }; setCfg(v); saveRoadmapIDB(v, "roadmap_cfg_v1"); }} /></label>
                      </div>
                      <div className="cfg-row">
                        <button type="button" className="rm-addbtn rm-compute" onClick={computeSchedule} title="Hitung timeline dari effort/testing/priority/dependency + kapasitas tim (preview)">⚡ Compute</button>
                        {preview && (
                          <>
                            <button type="button" className="rm-addbtn rm-apply" onClick={applyPreview} title="Terapkan hasil scheduler ke timeline">✓ Apply</button>
                            <button type="button" className="rm-addbtn rm-discard" onClick={discardPreview} title="Batalkan preview">✕ Discard</button>
                          </>
                        )}
                      </div>
                    </div>
                    <div className="rule-box">
                      <div className="rule-title">Priority Rule</div>
                      <div className="rule-item">1. Impact (H &gt; M &gt; L)</div>
                      <div className="rule-item">2. Effort (L &gt; M &gt; H)</div>
                      <div className="rule-item">3. Testing (L &gt; M &gt; H)</div>
                      <div className="rule-item">4. Dependency (constraint timeline, bukan pengganti priority)</div>
                    </div>
                    <div className="rule-box">
                      <div className="rule-title">Timeline Codes</div>
                      <div className="rule-item">S = September &nbsp;&nbsp; D = December</div>
                      <div className="rule-item">O = October &nbsp;&nbsp;&nbsp;&nbsp; B = Backlog</div>
                      <div className="rule-item">N = November</div>
                    </div>
                  </div>
                </div>
                </div>

                <div className="table-panel" ref={panelRef}>
                  <svg className="dep-svg" ref={svgRef}></svg>
                  <table className="task-table">
                    <thead>
                      <tr>
                        <th rowSpan={2} className="sl">#</th>
                        <th rowSpan={2} className="sl w250">Task</th>
                        <th rowSpan={2} className="sl w-area">Strategic Area</th>
                        <th rowSpan={2} className="sl w250">Description</th>
                        <th rowSpan={2} className="sl w80">Source</th>
                        <th rowSpan={2} className="sl w80">Impact</th>
                        <th rowSpan={2} className="sl w80">Effort</th>
                        <th rowSpan={2} className="sl w80">Testing</th>
                        <th rowSpan={2} className="sl w80">Dependency</th>
                        <th rowSpan={2} className="sl w80">Priority</th>
                        <th rowSpan={2} className="sl sl-edge w80">Status</th>
                        {months.map((m, mi) => (
                          <th key={mi} className="mo" colSpan={4}>{m}</th>
                        ))}
                        <th rowSpan={2} className="mo">Backlog</th>
                      </tr>
                      <tr>
                        {months.map((m, mi) =>
                          [1, 2, 3, 4].map((w) => {
                            const si = mi * 4 + (w - 1);
                            const load = slotLoad[si] || 0;
                            const over = load > cfg.dev;
                            return (
                              <th key={mi + "-" + w} className={"wk" + (w === 1 ? " mo-start" : "") + (over ? " wk-over" : "")}
                                title={over ? load + " task paralel > " + cfg.dev + " dev (overload)" : "W" + w}>
                                {over ? load + "/" + cfg.dev : "W" + w}
                              </th>
                            );
                          })
                        )}
                      </tr>
                    </thead>
                    <tbody>
                      {groups.map((g, gi) => (
                        <React.Fragment key={g.key}>
                          {/* spacer row between sections */}
                          {gi > 0 && (
                            <tr className="sec-gap"><td colSpan={RM_COLSPAN}></td></tr>
                          )}
                          <tr className="grp" data-section={g.section}>
                            <td colSpan={RM_COLSPAN}>
                              <span className="grp-label">{g.label}</span>
                              {g.section === "current" && <span style={{fontSize:10,color:"var(--text-3)",marginLeft:8}}>Start now</span>}
                              {g.section === "next" && <span style={{fontSize:10,color:"var(--text-3)",marginLeft:8}}>Planned work</span>}
                              {g.section === "backlog" && <span style={{fontSize:10,color:"var(--text-4)",marginLeft:8}}>Not scheduled</span>}
                            </td>
                          </tr>
                          {g.rows.map((t) => (
                            <tr key={t.id} data-tid={t.id} data-group={g.section}
                              onMouseEnter={() => depList(t).length && setHotId(t.id)}
                              onMouseLeave={() => setHotId((h) => (h === t.id ? null : h))}>
                              <td className="num sl">
                                <button
                                  type="button"
                                  className="rm-expand"
                                  title={expandedId === t.id ? "Collapse" : "Expand detail"}
                                  onClick={() => setExpandedId((e) => (e === t.id ? null : t.id))}
                                >
                                  {expandedId === t.id ? "▾" : "▸"}
                                </button>
                                <span className="rm-rank">{t.rank}</span>
                                <button
                                  type="button"
                                  className="rm-del"
                                  title="Delete task"
                                  onClick={() => removeTask(t.id)}
                                >
                                  ×
                                </button>
                              </td>
                              <td className="tname sl w250">
                                <RmEdit
                                  value={t.task}
                                  placeholder="Task name"
                                  onCommit={(v) => updateTask(t.id, { task: v })}
                                />
                              </td>
                              <td className="area sl w-area">
                                <RmCombo
                                  width={77}
                                  searchable
                                  value={t.strategicArea}
                                  options={RM_AREAS}
                                  onChange={(v) =>
                                    updateTask(t.id, { strategicArea: v })
                                  }
                                  label={`Strategic area for ${t.task}`}
                                />
                              </td>
                              <td className="tdesc sl w250">
                                <RmEdit
                                  value={t.desc}
                                  placeholder="Description"
                                  onCommit={(v) => updateTask(t.id, { desc: v })}
                                />
                              </td>
                              <td className="sl w80"><span className={rmSrcClass(t.sourceColumn)} title={t.sourceColumn || undefined}>{t.sourceColumn || "—"}</span></td>
                              <td className="sl w80">{level(t, "impact")}</td>
                              <td className="sl w80">{level(t, "effort")}</td>
                              <td className="sl w80">{level(t, "testing")}</td>
                              <td className="dep sl w80">
                                {(() => {
                                  const deps = depList(t);
                                  const picked = new Set(deps);
                                  // options for a picker: same section, exclude self and
                                  // already-picked (optionally keep `keep` so a replace combo
                                  // still shows its own current value as selectable context)
                                  const optsFor = (keep) => [
                                    ...(tasks || [])
                                      .filter(
                                        (o) =>
                                          o.id !== t.id &&
                                          (o.id === keep || !picked.has(o.id)) &&
                                          !!o.current === !!t.current
                                      )
                                      .map((o) => ({ v: o.id, label: o.task })),
                                  ];
                                  return (
                                    <div className="dep-cell">
                                      {deps.map((d) => (
                                        <span key={d} className="dep-chip" title={nameById[d] || d}>
                                          {/* click chip = replace this dep */}
                                          <RmCombo
                                            width={54}
                                            searchable
                                            value={d}
                                            options={optsFor(d)}
                                            onChange={(v) =>
                                              v &&
                                              updateTask(t.id, {
                                                dependency: deps.map((x) => (x === d ? v : x)),
                                              })
                                            }
                                            label={`Change dependency ${nameById[d] || d} for ${t.task}`}
                                            renderValue={() => (
                                              <span className="dep-name">{nameById[d] || d}</span>
                                            )}
                                          />
                                          <button
                                            type="button"
                                            className="dep-x"
                                            title="Remove dependency"
                                            onClick={() =>
                                              updateTask(t.id, {
                                                dependency: deps.filter((x) => x !== d),
                                              })
                                            }
                                          >
                                            ×
                                          </button>
                                        </span>
                                      ))}
                                      {/* + dep only when nothing selected yet */}

      function App() {
        const APP_NAV_STATE_KEY = "qa_browser_nav_state_v1";
        // ── Hash routing ─────────────────────────────────────────────────────
        const SECTION_ID_TO_WORKSPACE_NAV = {
          brd: "brd",
          assessments: "assessment",
          prd: "prd",
          test: "testcase",
          feature: "feature-list",
          "incident-report": "incident-report",
          summary: "summary",
          "release-notes": "release-notes",
          uat: "uat",
          presentation: "presentation",
          gdocs: "google-docs",
        };
        const WORKSPACE_NAV_TO_SECTION_ID = Object.fromEntries(
          Object.entries(SECTION_ID_TO_WORKSPACE_NAV).map(([k, v]) => [v, k]),
        );
        function parseHash() {
          const raw = window.location.hash.replace(/^#\/?/, "");
          if (!raw) return {};
          const parts = raw.split("/");
          const page = parts[0];
          if (page === "workspace") {
            return {
              mainNav: "workspace",
              workspaceNav: parts[1] || null,
              filePath: parts.slice(2).join("/") || null,
            };
          }
          return { mainNav: page };
        }
        function navToHash(mn, wn, sel) {
          if (mn === "workspace") {
            let h = "#/workspace";
            if (wn) {
              h += "/" + wn;
              if (sel?.path) {
                // strip section folder prefix (first segment)
                const rel = sel.path.replace(/^[^/]+\//, "");
                if (rel !== sel.path) h += "/" + rel;
              }
            }
            return h;
          }
          return "#/" + mn;
        }
        function readAppNavState() {
          try {
            return (
              JSON.parse(localStorage.getItem(APP_NAV_STATE_KEY) || "{}") || {}
            );
          } catch {
            return {};
          }
        }
        function normalizeMainNav(value) {
          return [
            "dashboard",
            "bigpic",
            "roadmap",
            "workspace",
            "tracker",
            "monitoring",
            "new-request",
            "memory",
            "settings",
          ].includes(value)
            ? value
            : "dashboard";
        }
        function normalizeWorkspaceNav(value, mainNavValue) {
          if (mainNavValue === "dashboard")
            return [
              "dashboard-openproject",
              "dashboard-testcase-stats",
            ].includes(value)
              ? value
              : "dashboard-openproject";
          if (mainNavValue === "workspace")
            return [
              "brd",
              "assessment",
              "prd",
              "testcase",
              "feature-list",
              "incident-report",
              "summary",
              "release-notes",
              "uat",
              "presentation",
              "google-docs",
            ].includes(value)
              ? value
              : null;
          return null;
        }
        function normalizeSelected(value) {
          if (!value || typeof value !== "object") return null;
          if (!value.path || !value.sectionId || !value.name) return null;
          return {
            path: value.path,
            sectionId: value.sectionId,
            name: value.name,
            ext: value.ext || "",
            gdocId: value.gdocId || "",
          };
        }
        const urlOpenPath = new URLSearchParams(window.location.search).get(
          "open",
        );
        const hashState = parseHash();
        const hashFilePathRef = useRef(hashState.filePath || null);
        const hashWorkspaceNavRef = useRef(hashState.workspaceNav || null);
        const savedNavState = readAppNavState();
        const initialMainNav = urlOpenPath
          ? "workspace"
          : hashState.mainNav
            ? normalizeMainNav(hashState.mainNav)
            : normalizeMainNav(savedNavState.mainNav);
        const initialWorkspaceNav = urlOpenPath
          ? null
          : hashState.mainNav
            ? normalizeWorkspaceNav(hashState.workspaceNav, initialMainNav)
            : normalizeWorkspaceNav(savedNavState.workspaceNav, initialMainNav);
        const [sections, setSections] = useState([]);
        const [selected, setSelected] = useState(() =>
          urlOpenPath || hashFilePathRef.current ? null : normalizeSelected(savedNavState.selected),
        ); // { path, sectionId, name, ext }
        const [fileData, setFileData] = useState(null);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState(null);
        const [sideSearch, setSideSearch] = useState("");
        const [sidebarWidth, setSidebarWidth] = useState(256);

        const [autoMap, setAutoMap] = useState({});
        const [runCase, setRunCase] = useState(null); // { caseId, specFile, grepPattern }
        const [importing, setImporting] = useState(false);
        const [importMsg, setImportMsg] = useState("");
        const [gdocs, setGdocs] = useState([]); // node-shaped tree from /api/gdocs
        const [gdocsStatus, setGdocsStatus] = useState(null); // { oauthConfigured, connected, email, folderName }
        const [tcStats, setTcStats] = useState(null);
        const [view, setView] = useState("files");
        // ── Corin-style navigation ─────────────────────────────────────────
        const [mainNav, rawSetMainNav] = useState(initialMainNav); // 'dashboard' | 'workspace' | 'memory' | 'settings'
        const [workspaceNav, setWorkspaceNav] = useState(initialWorkspaceNav); // dashboard child or workspace child
        const [themeId, setThemeId] = useState("navy");
        const [activeSection, setActiveSection] = useState(
          () => normalizeSelected(savedNavState.selected)?.sectionId || null,
        );
        // Tracker sidenav state — lifted so left sidebar can drive tab + sheet
        const [trackerTab, setTrackerTab] = useState("statistics"); // 'statistics' | 'input'
        const [trackerSheet, setTrackerSheet] = useState("all");
        const [trackerSheetTabs, setTrackerSheetTabs] = useState([]);

        function confirmTrackerLeave() {
          if (!window.__qaTrackerDirty) return true;
          return window.confirm("Tracker belum di-save. Tinggalkan halaman?");
        }
        function setMainNav(next) {
          if (!confirmTrackerLeave()) return;
          rawSetMainNav(next);
        }

        const [creating, setCreating] = useState(null); // { path, sectionId }
        const [creatingBusy, setCreatingBusy] = useState(false);

        const [user, setUser] = useState(() => {
          try {
            return JSON.parse(localStorage.getItem("qa_user") || "null");
          } catch {
            return null;
          }
        });
        const [loginErr, setLoginErr] = useState("");

        const DEFAULT_REQUEST_BLOCKS = [
          {
            id: "req-1",
            type: "paragraph",
            props: {},
            content: [
              {
                type: "text",
                text: "Klik text ini untuk edit request baru.",
                styles: {},
              },
            ],
            children: [
              {
                id: "req-2",
                type: "checkListItem",
                props: { checked: false },
                content: [{ type: "text", text: "Checklist item", styles: {} }],
                children: [],
              },
            ],
          },
        ];
        const [requestBlocks, setRequestBlocks] = useState(
          DEFAULT_REQUEST_BLOCKS,
        );
        const [requestSyncMeta, setRequestSyncMeta] = useState({
          loading: true,
          saving: false,
          error: "",
          updatedAt: null,
          updatedBy: null,
        });
        const requestEditorRef = useRef(null);
        const [blockNoteState, setBlockNoteState] = useState({
          loading: false,
          ready: false,
          error: "",
          rev: 0,
        });
        const canAdminEdit = user?.role === "admin";
        const themeRef = useRef(null);

        useEffect(() => {
          try {
            localStorage.setItem(
              APP_NAV_STATE_KEY,
              JSON.stringify({
                mainNav,
                workspaceNav,
                selected,
              }),
            );
          } catch {}
        }, [mainNav, workspaceNav, selected]);

        // ── Hash sync: state → URL ──────────────────────────────────────────
        useEffect(() => {
          const h = navToHash(mainNav, workspaceNav, selected);
          if (window.location.hash !== h) {
            history.replaceState(null, "", h);
          }
        }, [mainNav, workspaceNav, selected?.path]);

        // ── Hash sync: URL → state (back/forward) ──────────────────────────
        useEffect(() => {
          function onHash() {
            const h = parseHash();
            if (!h.mainNav) return;
            const nm = normalizeMainNav(h.mainNav);
            setMainNav(nm);
            if (nm === "workspace") {
              setWorkspaceNav(normalizeWorkspaceNav(h.workspaceNav, nm));
            }
          }
          window.addEventListener("hashchange", onHash);
          return () => window.removeEventListener("hashchange", onHash);
        }, []);

        const isDraggingRef = useRef(false);
        const dragStartXRef = useRef(0);
        const dragStartWRef = useRef(0);

        // ── Sidebar resize ──────────────────────────────────────────────────────────

        function onResizeStart(e) {
          isDraggingRef.current = true;
          dragStartXRef.current = e.clientX;
          dragStartWRef.current = sidebarWidth;
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";
          const onMove = (ev) => {
            if (!isDraggingRef.current) return;
            const next = Math.min(
              480,
              Math.max(
                160,
                dragStartWRef.current + ev.clientX - dragStartXRef.current,
              ),
            );
            setSidebarWidth(next);
          };
          const onUp = () => {
            isDraggingRef.current = false;
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
          };
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        }

        // ── Theme ───────────────────────────────────────────────────────────────────
        function switchTheme(id) {
          const t = THEMES.find((x) => x.id === id);
          if (!t) return;
          applyThemeVars(t);
          saveThemeIDB(id);
          setThemeId(id);
          requestAnimationFrame(() =>
            requestAnimationFrame(() => themeRef.current?.setTheme(id)),
          );
        }

        // ── Load file tree from API ──────────────────────────────────────────────────
        async function loadTree() {
          try {
            const res = await fetch("/api/files");
            const data = await res.json();
            setSections(data);
            // expand first section that has content
            const first = data.find((s) => s.tree?.length > 0);
            if (first && !activeSection) setActiveSection(first.id);
          } catch (e) {
            setError("Cannot reach server: " + e.message);
          }
        }

        // ── Quiet tree refresh (sidebar only — never touches selection/open file) ─────
        async function refreshTree() {
          try {
            const data = await fetch("/api/files").then((r) => r.json());
            if (Array.isArray(data)) setSections(data);
          } catch {}
        }

        // ── Create a folder or new TSV from the sidebar ───────────────────────────────
        async function createItem(name, type) {
          if (!creating || !name) return;
          setCreatingBusy(true);
          try {
            if (type === "folder") {
              const r = await fetch("/api/files/mkdir", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ path: `${creating.path}/${name}` }),
              });
              if (!r.ok) throw new Error(await r.text());
            } else {
              const fp = `${creating.path}/${name.replace(/\.tsv$/i, "")}.tsv`;
              const tpl = serializeCardToTSV([{ ...EMPTY_TC(), id: "TC-001" }]);
              const r = await fetch(
                "/api/files/content?path=" + encodeURIComponent(fp),
                {
                  method: "PUT",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ content: tpl }),
                },
              );
              if (!r.ok) throw new Error(await r.text());
            }
            await refreshTree();
            setActiveSection(creating.sectionId);
            setCreating(null);
          } catch (e) {
            alert("Create failed: " + e.message);
          }
          setCreatingBusy(false);
        }

        // ── Load Google Docs (OAuth, via server.js) ──────────────────────────────────
        async function loadGDocs() {
          try {
            const st = await fetch("/api/gdocs/status").then((r) => r.json());
            setGdocsStatus(st);
            if (!st.connected || st.needsReconnect) {
              setGdocs([]);
              return;
            }
            const r = await fetch("/api/gdocs");
            const list = await r.json().catch(() => []);
            if (!r.ok)
              throw new Error(list.error || "Failed to load Google Docs");
            setGdocs(Array.isArray(list) ? list : []);
          } catch (e) {
            setGdocsStatus((prev) => ({
              ...(prev || {}),
              oauthConfigured: prev ? prev.oauthConfigured : false,
              connected: false,
              error: "Cannot reach server: " + e.message,
            }));
            setGdocs([]);
          }
        }

        async function loadTestcaseStats() {
          try {
            const data = await fetch("/api/testcases/stats").then((r) =>
              r.json(),
            );
            setTcStats(data);
          } catch {
            setTcStats(null);
          }
        }

        useEffect(() => {
          loadTestcaseStats();
        }, []);

        // ── Load automation map for a file's test cases ──────────────────────────────
        async function loadAutoMap(cases) {
          if (!cases?.length) return;
          const ids = cases.map((c) => c.id).filter(Boolean);
          if (!ids.length) return;
          try {
            const rows = await fetch(
              "/api/testcases?" + new URLSearchParams({ limit: 500 }),
            ).then((r) => r.json());
            const map = {};
            for (const row of rows) {
              if (row.tc_type || row.spec_file) {
                map[row.id] = {
                  tc_type: row.tc_type || "manual",
                  spec_file: row.spec_file || "",
                  grep_pattern: row.grep_pattern || "",
                };
              }
            }
            setAutoMap(map);
          } catch {}
        }

        // ── Open a file ─────────────────────────────────────────────────────────────
        async function openFile(node, sectionId, options = {}) {
          if (node.kind !== "file") return;
          setView("files");
          setSelected({
            path: node.path,
            sectionId,
            name: node.name,
            ext: node.ext,
            gdocId: node.gdocId,
          });
          if (!options.keepNav) {
            setMainNav("workspace");
            setWorkspaceNav(SECTION_ID_TO_WORKSPACE_NAV[sectionId] || null);
          }
          setActiveSection(sectionId);
          setLoading(true);
          setFileData(null);

          try {
            // Google Doc → fetch via /api/gdocs, render as read-only markdown
            if (node.ext === "gdoc") {
              const r = await fetch(
                "/api/gdocs/" + encodeURIComponent(node.gdocId),
              );
              if (!r.ok)
                throw new Error(
                  (await r.json().catch(() => ({}))).error ||
                    "Failed to read Google Doc",
                );
              const d = await r.json();
              setFileData({
                type: "md",
                content: d.markdown,
                path: node.path,
                gdocId: node.gdocId,
                title: d.title,
              });
              setLoading(false);
              return;
            }
            if (node.ext === "pptx") {
              setFileData({
                type: "binary",
                path: node.path,
                ext: node.ext,
                openUrl:
                  "/api/files/open?path=" + encodeURIComponent(node.path),
              });
              setLoading(false);
              return;
            }
            const text = await fetch(
              "/api/files/content?path=" + encodeURIComponent(node.path),
            ).then((r) => r.text());
            if (node.ext === "md") {
              setFileData({ type: "md", content: text, path: node.path });
            } else {
              // parseFile splits each line into columns first, then checks card format
              const parsed = parseFile(text, node.ext || "tsv");
              if (parsed.type === "card") {
                const cases = parsed.cases;
                // try to get exec data from companion JSON
                const execPath = node.path
                  .replace(/\.tsv$/i, ".exec.json")
                  .replace(/\.csv$/i, ".exec.json");
                let execData = null;
                try {
                  const ejson = await fetch(
                    "/api/files/content?path=" + encodeURIComponent(execPath),
                  ).then((r) => (r.ok ? r.json() : null));
                  execData = ejson;
                } catch {}
                setFileData({ type: "card", cases, execData, path: node.path });
                await loadAutoMap(cases);
              } else {
                setFileData({ type: "text", content: text, path: node.path });
              }
            }
          } catch (e) {
            setError(e.message);
          }
          setLoading(false);
        }

        // ── Save exec JSON via API ───────────────────────────────────────────────────
        async function saveExecViaAPI(tsvPath, execData) {
          const execPath = tsvPath
            .replace(/\.tsv$/i, ".exec.json")
            .replace(/\.csv$/i, ".exec.json");
          await fetch(
            "/api/files/content?path=" + encodeURIComponent(execPath),
            {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                content: JSON.stringify(execData, null, 2),
              }),
            },
          );
        }

        // ── Save automation mapping ──────────────────────────────────────────────────
        async function handleSaveMap(caseId, mapData) {
          try {
            await fetch(`/api/testcases/${caseId}/map`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(mapData),
            });
            setAutoMap((prev) => ({
              ...prev,
              [caseId]: {
                tc_type: mapData.tc_type || "manual",
                spec_file: mapData.spec_file || "",
                grep_pattern: mapData.grep_pattern || "",
              },
            }));
          } catch (e) {
            alert("Save mapping failed: " + e.message);
          }
        }

        // ── Import TSV/MD files into DB ──────────────────────────────────────────────
        async function handleImport() {
          setImporting(true);
          setImportMsg("");
          try {
            const r = await fetch("/api/import", { method: "POST" }).then((r) =>
              r.json(),
            );
            setImportMsg(
              `✓ Imported ${r.test_cases} test cases, ${r.prd_files} PRD files`,

            setTimeout(() => setImportMsg(""), 4000);

            setImportMsg("⚠ " + e.message);

        // ── Restore theme on mount + load tree ───────────────────────────────────────

                applyThemeVars(t);
                setThemeId(tid);
                themeRef.current?.setTheme(tid);
              }

          })();
          loadTree();
          loadGDocs();
          fetch("/api/new-request")
            .then((r) => r.json())
            .then((d) => {
              if (d?.ok && Array.isArray(d.blocks) && d.blocks.length) {
                setRequestBlocks(normalizeIncomingRequestBlocks(d.blocks));
                setRequestSyncMeta({
                  loading: false,
                  saving: false,
                  error: "",
                  updatedAt: d.updatedAt || null,
                  updatedBy: d.updatedBy || null,
                });
              } else {
                setRequestSyncMeta((prev) => ({
                  ...prev,
                  loading: false,
                  error: d?.error || "",
                }));
              }
            })
            .catch((e) =>
              setRequestSyncMeta((prev) => ({
                ...prev,
                loading: false,
                error: "Sync failed: " + e.message,
              })),
            );
        }, []);

        // Live sidebar updates: server pings on any file/folder change → quiet tree refresh
        useEffect(() => {
          let es;
          try {
            es = new EventSource("/api/files/events");
            es.onmessage = () => refreshTree();
          } catch {}
          return () => {
            try {
              es && es.close();
            } catch {}
          };
        }, []);

        // Sync activeSection when selected changes
        useEffect(() => {
          if (selected?.sectionId) setActiveSection(selected.sectionId);

        // ── Render sidebar tree nodes ────────────────────────────────────────────────
        function TreeDir({
          node,
          sectionId,
          pad,
          forceOpen,
          activePath,
          creating,
          creatingBusy,
          setCreating,
          createItem,
          children,
        }) {
          const inPath = activePath && activePath.startsWith(node.path + "\\");
          // persisted open/collapse per folder path; default collapsed except root-level or saved-open
          const [open, setOpen] = useState(
            () => folderOpenState(node.path, depthDefaultOpen(pad)) || inPath,
          );
          // auto-expand when the selected file lands inside this folder
          useEffect(() => {
            if (inPath) setOpen(true);
          }, [inPath]);
          const toggle = () =>
            setOpen((o) => {

              setFolderOpenState(node.path, n);

        function folderOpenState(pathKey, fallback) {
          try {
            const raw = localStorage.getItem("qab-folder-open");

            const m = JSON.parse(raw);
            return pathKey in m ? m[pathKey] : fallback;

            const m = JSON.parse(

          return () => {

          };
