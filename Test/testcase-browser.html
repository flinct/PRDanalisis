        function isLegacyRequestBlock(block) {
          return (
            !!block &&
            typeof block === "object" &&
            ("text" in block ||
              "level" in block ||
              block.type === "text" ||
              block.type === "bullet" ||
              block.type === "numbered" ||
              block.type === "todo")
          );
        }

        function rich(text) {
          return text ? [{ type: "text", text: String(text), styles: {} }] : [];
        }

        function legacyTypeToBlockNoteType(block) {
          if (block.type === "todo") return "checkListItem";
          if (block.type === "bullet") return "bulletListItem";
          if (block.type === "numbered") return "numberedListItem";
          return "paragraph";
        }

        function normalizeBlockNoteBlocks(input) {
          if (!Array.isArray(input)) return DEFAULT_REQUEST_BLOCKS;
          return input.map((block, idx) => {
            const next = { ...block };
            if (!next.id)
              next.id = `req-bn-${idx}-${Math.random().toString(36).slice(2, 6)}`;
            if (!next.type) next.type = "paragraph";
            if (!next.props || typeof next.props !== "object") next.props = {};
            if (!Array.isArray(next.content))
              next.content = rich(next.text || "");
            next.content = next.content.map((part) => ({
              type: "text",
              text: String(part?.text || ""),
              styles: { ...(part?.styles || {}) },
            }));
            if (!Array.isArray(next.children)) next.children = [];
            next.children = normalizeBlockNoteBlocks(next.children);
            if (next.type === "checkListItem")
              next.props = {
                ...next.props,
                checked: !!(next.props?.checked || next.checked),
              };
            if (next.type === "heading")
              next.props = {
                ...next.props,
                level: Math.min(
                  3,
                  Math.max(1, Number(next.props?.level || 1) || 1),
                ),
              };
            return next;
          });
        }

        function legacyBlocksToBlockNote(blocks) {
          if (!Array.isArray(blocks) || !blocks.length)
            return DEFAULT_REQUEST_BLOCKS;
          const roots = [];
          const stack = [];
          blocks.forEach((block, idx) => {
            const level = Math.max(0, Number(block?.level || 0) || 0);
            const next = {
              id: block.id || `req-legacy-${idx}`,
              type: legacyTypeToBlockNoteType(block || {}),
              props: block?.type === "todo" ? { checked: !!block.checked } : {},
              content: rich(block?.text || ""),
              children: [],
            };
            while (stack.length > level) stack.pop();
            const parent = stack[stack.length - 1];
            if (parent) parent.children.push(next);
            else roots.push(next);
            stack[level] = next;
          });
          return roots.length ? roots : DEFAULT_REQUEST_BLOCKS;
        }

        function normalizeIncomingRequestBlocks(blocks) {
          if (!Array.isArray(blocks) || !blocks.length)
            return DEFAULT_REQUEST_BLOCKS;
          return blocks.some(isLegacyRequestBlock)
            ? legacyBlocksToBlockNote(blocks)
            : normalizeBlockNoteBlocks(blocks);
        }

        const fallbackText = useMemo(() => {
          const lines = [];
          const walk = (blocks, depth = 0) => {
            (blocks || []).forEach((block) => {
              const text = Array.isArray(block.content)
                ? block.content.map((part) => part?.text || "").join("")
                : "";
              const prefix =
                block.type === "checkListItem"
                  ? `- [${block.props?.checked ? "x" : " "}] `
                  : block.type === "bulletListItem"
                    ? "- "
                    : block.type === "numberedListItem"
                      ? "1. "
                      : block.type === "heading"
                        ? `${"#".repeat(Math.min(3, Math.max(1, Number(block.props?.level || 1))))} `
                        : block.type === "quote"
                          ? "> "
                          : block.type === "codeBlock"
                            ? "```\n"
                            : "";
              lines.push(`${"  ".repeat(depth)}${prefix}${text}`.trimEnd());
              if (block.type === "codeBlock") lines.push("```");
              if (block.children?.length) walk(block.children, depth + 1);
            });
          };
          walk(requestBlocks);
          return lines.join("\n");
        }, [requestBlocks]);

        function parseFallbackText(value) {
          const lines = String(value || "").split(String.fromCharCode(10));
          const out = [];

          lines.forEach((line, idx) => {
            const raw = String(line || "")
              .split(String.fromCharCode(13))
              .join("");
            const trimmed = raw.trim();
            if (!trimmed) return;

            const spaces = raw.match(/^\s*/)?.[0]?.length || 0;
            const depth = Math.max(0, Math.floor(spaces / 2));
            let type = "paragraph";
            let text = trimmed;
            let props = {};
            const heading = trimmed.match(/^(#{1,3})\s+(.*)$/);
            if (heading) {
              type = "heading";
              props.level = heading[1].length;
              text = heading[2];
            } else if (/^- \[( |x)\]\s+/.test(trimmed)) {
              type = "checkListItem";
              props.checked = trimmed[3] === "x";
              text = trimmed.replace(/^- \[(?: |x)\]\s+/, "");
            } else if (/^-\s+/.test(trimmed)) {
              type = "bulletListItem";
              text = trimmed.replace(/^-\s+/, "");
            } else if (/^\d+\.\s+/.test(trimmed)) {
              type = "numberedListItem";
              text = trimmed.replace(/^\d+\.\s+/, "");
            } else if (/^>\s+/.test(trimmed)) {
              type = "quote";
              text = trimmed.replace(/^>\s+/, "");
            }
            out.push({
              id: `req-fallback-${idx}`,
              depth,
              type,
              props,
              content: rich(text),
              children: [],
            });
          });
          const roots = [];
          const stack = [];
          out.forEach((block) => {
            while (stack.length > block.depth) stack.pop();
            const next = {
              id: block.id,
              type: block.type,
              props: block.props,
              content: block.content,
              children: [],
            };
            const parent = stack[stack.length - 1];
            if (parent) parent.children.push(next);
            else roots.push(next);
            stack[block.depth] = next;
          });
          return roots.length ? roots : DEFAULT_REQUEST_BLOCKS;

                                        height: 3,
                                        borderRadius: "50%",
                                        background: sec.color,
                                        flexShrink: 0,
                                      }}
                                    />
                                    <span
                                      style={{
                                        flex: 1,
                                        fontSize: 10,
                                        fontWeight: 600,
                                        color: sec.color,
                                        textTransform: "uppercase",
                                        letterSpacing: 0.5,
                                      }}
                                    >
                                      {sec.label}
                                    </span>
                                    {!sec.remote && sec.folderName && (
                                      <button
                                        onClick={(e) => {
                                          e.stopPropagation();
                                          setActiveSection(sec.id);
                                          setCreating({
                                            path: sec.folderName,
                                            sectionId: sec.id,
                                          });
                                        }}
                                        title="New folder / TSV"
                                        style={{
                                          fontSize: 13,
                                          lineHeight: 1,
                                          background: "none",
                                          border: "none",
                                          color: "var(--text-4)",
                                          cursor: "pointer",
                                          padding: "0 2px",
                                        }}
                                      >
                                        +
                                      </button>
                                    )}
                                    {sec.remote && (
                                      <span
                                        title="Google Docs"
                                        style={{
                                          fontSize: 9,
                                          color: "var(--text-5)",
                                        }}
                                      >
                                        ☁
                                      </span>
                                    )}
                                    {count > 0 && (
                                      <span
                                        style={{
                                          fontSize: 9,
                                          color: "var(--text-5)",
                                        }}
                                      >
                                        {count}
                                      </span>
                                    )}
                                    <span
                                      style={{
                                        fontSize: 9,
                                        color: "var(--text-5)",
                                        marginLeft: 2,
                                      }}
                                    >
                                      {isActive ? "▾" : "▸"}
                                    </span>
                                  </div>
                                );
                              };
                              const SectionBody = (sec) => {
                                if (sec.remote && !sec.configured) {
                                  return (
                                    <div
                                      style={{
                                        padding: "8px 14px",
                                        fontSize: 10,
                                        color: "var(--text-5)",
                                        lineHeight: 1.5,
                                      }}
                                    >
                                      {sec.statusError ||
                                        "⚠ Belum terhubung — buka ⚙ Settings."}
                                    </div>
                                  );
                                }
                                return (
                                  <React.Fragment>
                                    {creating &&
                                      creating.path === sec.folderName && (
                                        <NewItemForm
                                          pad={20}
                                          busy={creatingBusy}
                                          onCreate={createItem}
                                          onCancel={() => setCreating(null)}
                                        />
                                      )}
                                    {sec.tree?.length > 0 ? (
                                      <div style={{ paddingBottom: 4 }}>
                                        {renderTree(sec.tree, sec.id)}
                                      </div>
                                    ) : (
                                      <div
                                        style={{
                                          padding: "8px 14px",
                                          fontSize: 10,
                                          color: "var(--text-5)",
                                        }}
                                      >
                                        {sec.remote
                                          ? "Belum ada dokumen di folder mirror"
                                          : "No files"}
                                      </div>
                                    )}
                                  </React.Fragment>
                                );
                              };
                              const active = allSections.find(
                                (s) => s.id === activeSection,
                              );
                              if (!active) {
                                return (
                                  <div style={{ flex: 1, overflowY: "auto" }}>
                                    {allSections.map((sec) =>
                                      SectionHeader(sec, false),
                                    )}
                                  </div>
                                );
                              }
                              const others = allSections.filter(
                                (s) => s.id !== active.id,
                              );
                              return (
                                <React.Fragment>
                                  {SectionHeader(active, true)}
                                  <div style={{ flex: 1, overflowY: "auto" }}>
                                    {SectionBody(active)}
                                  </div>
                                  {others.length > 0 && (
                                    <div
                                      style={{
                                        flexShrink: 0,
                                        borderTop: "1px solid var(--border-1)",
                                      }}
                                    >
                                      {others.map((sec) =>
                                        SectionHeader(sec, false),
                                      )}
                                    </div>
                                  )}
                                </React.Fragment>
                              );
                            })()}
                        </div>
                      </div>

                      {/* Resize handle */}
                      <div
                        onMouseDown={onResizeStart}
                        style={{
                          width: 4,
                          cursor: "col-resize",
                          flexShrink: 0,
                          background: "transparent",
                          borderRight: "1px solid var(--border-1)",
                        }}
                        onMouseEnter={(e) =>
                          (e.target.style.background = "var(--border-1)")
                        }
                        onMouseLeave={(e) =>
                          (e.target.style.background = "transparent")
                        }
                      />

                      {/* Content area */}
                      <div
                        style={{
                          flex: 1,
                          display: "flex",
                          flexDirection: "column",
                          overflow: "hidden",
                          background: "var(--app-bg)",
                        }}
                      >
                        {selected && (
                          <div
                            style={{
                              padding: "5px 14px",
                              borderBottom: "1px solid var(--border-1)",
                              background: "var(--sidebar-bg)",
                              flexShrink: 0,
                              fontSize: 10,
                              color: "var(--text-4)",
                              display: "flex",
                              alignItems: "center",
                              gap: 6,
                            }}
                          >
                            <span style={{ color: "var(--text-5)" }}>
                              {selected.sectionId}
                            </span>
                            <span style={{ color: "var(--text-6)" }}>/</span>
                            <span style={{ color: "var(--text-3)" }}>
                              {selected.name}
                            </span>
                          </div>
                        )}
                        {renderContent()}
                      </div>
                    </div>
                  );
                };

                // ── Workspace: main content area (file viewer) ──────────────
                if (mainNav === "workspace") {
                  return (
                    <div
                      style={{
                        flex: 1,
                        display: "flex",
                        flexDirection: "column",
                        overflow: "hidden",
                        background: "var(--app-bg)",
                      }}
                    >
                      {selected && (
                        <div
                          style={{
                            padding: "4px 14px",
                            borderBottom: "1px solid var(--border-1)",
                            background: "var(--sidebar-bg)",
                            flexShrink: 0,
                            display: "flex",
                            alignItems: "center",
                            gap: 4,
                            fontFamily: "monospace",
                          }}
                        >
                          <span
                            style={{ fontSize: 10, color: "var(--text-5)" }}
                          >
                            PRDanalisis
                          </span>
                          <span style={{ fontSize: 8, color: "var(--text-6)" }}>
                            /
                          </span>
                          <span
                            style={{
                              fontSize: 10,
                              color: "#fbbf24",
                              fontWeight: 500,
                            }}
                          >
                            {selected.sectionId}
                          </span>
                          <span style={{ fontSize: 8, color: "var(--text-6)" }}>
                            /
                          </span>
                          <span
                            style={{
                              fontSize: 10,
                              color: "var(--text-2)",
                              fontWeight: 400,
                            }}
                          >
                            {selected.name}
                          </span>
                        </div>
                      )}
                      {renderContent()}
                    </div>
                  );
                }

                // ── Big Picture (native render from prototype) ─────────────
                if (mainNav === "bigpic") {
                  return <BigPictureView page={0} themeId={themeId} />;
                }
                // ── Roadmap (interactive, M1) ──────────────────────────────
                if (mainNav === "roadmap") {
                  return <RoadmapView themeId={themeId} />;
                }

                // ── Memory ─────────────────────────────────────────────────
                if (mainNav === "tracker")
                  return (
                    <div
                      style={{
                        flex: 1,
                        minHeight: 0,
                        overflow: "hidden",
                        background: "var(--app-bg)",
                      }}
                    >
                      <window.TrackerModule.TrackerView
                        user={user}
                        onDirtyChange={handleTrackerDirty}
                        tab={trackerTab}
                        onTabChange={setTrackerTab}
                        selectedSheet={trackerSheet}
                        onSelectedSheetChange={setTrackerSheet}
                        onSheetTabsChange={setTrackerSheetTabs}
                      />
                    </div>
                  );
                if (mainNav === "monitoring")
                  return (
                    <div
                      style={{
                        flex: 1,
                        minHeight: 0,
                        overflow: "auto",
                        background: "var(--app-bg)",
                      }}
                    >
                      <window.MonitoringModule.MonitoringView />
                    </div>
                  );
                if (mainNav === "new-request") return renderNewRequestView();
                if (mainNav === "memory") return renderMemoryView();

                // ── Settings ───────────────────────────────────────────────
                return (
                  <SettingsPage
                    status={gdocsStatus}
                    onRefreshStatus={loadGDocs}
                    onSwitchTheme={switchTheme}
                    currentTheme={themeId}
                    onImport={handleImport}
                    importing={importing}
                    importMsg={importMsg}
                    user={user}
                  />
                );
              })()}
            </div>

            {/* Run Panel overlay (global) */}
            {runCase && (
              <RunPanel
                caseId={runCase.caseId}
                specFile={runCase.specFile}
                grepPattern={runCase.grepPattern}
                onClose={() => setRunCase(null)}
              />
            )}
          </div>
        );
      }

      // ─── BOOTSTRAP ────────────────────────────────────────────────────────────────
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
