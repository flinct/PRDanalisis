        /* §80-116 timeline: per-month split into 4 weeks; drag-select any week
           span. Backlog stays a single cell (clear schedule). Schedule stores
           {month,week} at both ends; internally we use a linear week-slot index
           0..15 (Sep w1 = 0 … Dec w4 = 15). */
        const RM_SLOTS = months.length * 4; // 4 weeks per month
        const slotOf = (month, week) => {
          const mi = months.indexOf(month);
          return mi < 0 ? -1 : mi * 4 + (week - 1);
        };
        const slotMonth = (i) => months[Math.floor(i / 4)];
        // total table columns: 11 frozen + weeks + 1 backlog
        const RM_COLSPAN = 13 + RM_SLOTS + 1;
        const slotWeek = (i) => (i % 4) + 1;
        const [drag, setDrag] = React.useState(null); // {id, a, b} week-slot indices
        const suppressClick = React.useRef(false); // set on timeline mousedown; blocks the click that follows a drag
        React.useEffect(() => {
          if (!drag) return;
          const commit = () => {
            const lo = Math.min(drag.a, drag.b),
              hi = Math.max(drag.a, drag.b);
            updateTask(drag.id, {
              schedule: {
                start: { month: slotMonth(lo), week: slotWeek(lo) },
                end: { month: slotMonth(hi), week: slotWeek(hi) },
              },
            });
            setDrag(null);
          };
          window.addEventListener("mouseup", commit);
          return () => window.removeEventListener("mouseup", commit);
        }, [drag, updateTask]);
        // week-slot span [lo,hi] a task's bar covers, or null for backlog/unscheduled
        const schedSpan = (t) => {
          if (drag && drag.id === t.id)
            return [Math.min(drag.a, drag.b), Math.max(drag.a, drag.b)];
          if (!t.schedule) return null;
          const lo = slotOf(t.schedule.start.month, t.schedule.start.week);
          const hi = slotOf(t.schedule.end.month, t.schedule.end.week);
          return lo < 0 || hi < 0 ? null : [lo, hi];
        };

        /* ── Auto-scheduler (§ timeline-scheduling-formula.md v2) ──────────────
           Greedy list-scheduling: DEV_WEEKS/QA_WEEKS from effort/testing, priority
           score picks order, dev+qa lanes cap parallelism, deps honored (qa_end),
           HOLD inert / BLOCKED defers downstream. Writes each task's schedule
           {start,end} in week granularity. Validated against Python self-check. */
        const DEV_WEEKS = { L: 2, M: 4, H: 8 };
        const QA_WEEKS = { L: 1, M: 2, H: 3 };
        const IMPW = { H: 3, M: 2, L: 1 };
        const EFFINV = { L: 3, M: 2, H: 1 };
        const prioScore = (t) => {
          const P = { P0: 4, P1: 3, P2: 2, P3: 1, Backlog: 0 }[t.priority] || 0;
          return (
            P * 1000 +
            (IMPW[t.impact] || 0) * 100 +
            (EFFINV[t.effort] || 0) * 10 +
            ({ L: 3, M: 2, H: 1 }[t.testing] || 0)
          );
        };
        const computeSchedule = React.useCallback(() => {
          const prev = tasks;
          if (!prev) return;
          const cap = cfg.cap > 0 ? cfg.cap : 0.8;
          const nDev = Math.max(1, cfg.dev | 0);
          const nQa = Math.max(1, cfg.qa | 0);
          const byId = Object.fromEntries(prev.map((t) => [t.id, t]));
          const isHold = (t) => t.status === "hold";
          const isBlocked = (t) => t.status === "blocked";
          // section = current | next | backlog (derived same as groups memo).
          // backlog is NOT scheduled — leave unscheduled so it stays backlog.
          const sectionOf = (t) => (t.current ? "current" : t.schedule ? "next" : "backlog");
          const SECT = { current: 2, next: 1, backlog: 0 };
          const active = prev.filter(
            (t) => !isHold(t) && !isBlocked(t) && sectionOf(t) !== "backlog"
          );
          const blockedIds = new Set(prev.filter(isBlocked).map((t) => t.id));
          const devFree = new Array(nDev).fill(0);
          const qaFree = new Array(nQa).fill(0);
          const done = {}; // id -> [devEnd, qaEnd]
          const result = {}; // id -> {devStart, devEnd, qaEnd}
          const remaining = new Set(active.map((t) => t.id));
          const depsOf = (t) =>
            Array.isArray(t.dependency) ? t.dependency : t.dependency ? [t.dependency] : [];
          const depOk = (t) => {
            for (const d of depsOf(t)) {
              if (blockedIds.has(d)) return false; // BLOCKED dep → block downstream
              const dt = byId[d];
              if (!dt) continue; // stale/cross id → inert
              if (isHold(dt)) continue; // HOLD dep → inert
              if (remaining.has(d)) return false; // not scheduled yet
            }
            return true;
          };
          let guard = 0;
          while (remaining.size && guard++ < 2000) {
            let ready = active.filter((t) => remaining.has(t.id) && depOk(t));
            if (!ready.length) break; // rest blocked-downstream → deferred
            // section tier first (current before next), then priority score
            ready.sort(
              (a, b) =>
                SECT[sectionOf(b)] - SECT[sectionOf(a)] ||
                prioScore(b) - prioScore(a) ||
                (a.rank || 0) - (b.rank || 0)
            );
            const t = ready[0];
            const est = Math.max(0, ...depsOf(t).map((d) => (done[d] ? done[d][1] : 0)));
            const pm = t.pm_front_weeks || 0;
            const dl = devFree.indexOf(Math.min(...devFree));
            const dStart = Math.max(devFree[dl], est, pm);
            const risk = t.risk || 1;
            const dEnd = dStart + ((DEV_WEEKS[t.effort] || 4) * risk) / cap;
            devFree[dl] = dEnd;
            const ql = qaFree.indexOf(Math.min(...qaFree));
            const qStart = Math.max(qaFree[ql], dEnd);
            const qEnd = qStart + (QA_WEEKS[t.testing] || 2) / cap;
            qaFree[ql] = qEnd;
            done[t.id] = [dEnd, qEnd];
            result[t.id] = { dStart, dEnd, qEnd };
            remaining.delete(t.id);
          }
          setDeferred([...remaining]);
          // auto-extend months so every task gets its real slot (no pile-up clamp).
          // makespan can exceed the visible 4-month window; grow `months` to fit.
          let maxWeek = 0;
          for (const id in result) maxWeek = Math.max(maxWeek, Math.ceil(result[id].dEnd));
          const neededMonths = Math.max(months.length, Math.ceil(maxWeek / 4));
          let cols = months;
          if (neededMonths > months.length) {
            const ext = [...months];
            while (ext.length < neededMonths) {
              const li = MONTH_NAMES.indexOf(ext[ext.length - 1]);
              ext.push(MONTH_NAMES[(li + 1) % 12]);
            }
            cols = ext;
            setMonths(ext);
            saveRoadmapIDB(ext, "roadmap_months_v1");
          }
          const maxSlot = cols.length * 4 - 1;
          const prov = {};
          for (const id in result) {
            const r = result[id];
            const lo = Math.min(maxSlot, Math.round(r.dStart));
            const hi = Math.min(maxSlot, Math.max(lo, Math.round(r.dEnd) - 1));
            prov[id] = { lo, hi };
          }
          setPreview(prov); // preview only — commit via Apply
        }, [tasks, cfg, months]);

        // commit preview → write schedule to tasks + persist
        const applyPreview = React.useCallback(() => {
          if (!preview) return;
          setTasks((prev) => {
            if (!prev) return prev;
            const next = prev.map((t) => {
              const r = preview[t.id];
              if (!r) return t; // untouched (hold/blocked/backlog/deferred)
              return {
                ...t,
                schedule: {
                  start: { month: slotMonth(r.lo), week: slotWeek(r.lo) },
                  end: { month: slotMonth(r.hi), week: slotWeek(r.hi) },
                },
              };
            });
            saveRoadmapIDB(next);
            return next;
          });
          setPreview(null);
          setSaved(true);
          clearTimeout(savedTimer.current);
          savedTimer.current = setTimeout(() => setSaved(false), 1200);
        }, [preview]);

        const discardPreview = React.useCallback(() => setPreview(null), []);

        // per-week-slot task count → overload highlight when count > dev lanes
        const slotLoad = React.useMemo(() => {
          const load = {};
          (tasks || []).forEach((t) => {
            if (t.status === "hold" || t.status === "blocked") return;
            // preview active → count ghost span; else committed schedule
            const pv = preview && preview[t.id];
            const sp = pv
              ? [pv.lo, pv.hi]
              : t.schedule
              ? [
                  slotOf(t.schedule.start.month, t.schedule.start.week),
                  slotOf(t.schedule.end.month, t.schedule.end.week),
                ]
              : null;
            if (!sp || sp[0] < 0) return;
            for (let s = sp[0]; s <= sp[1]; s++) load[s] = (load[s] || 0) + 1;
          });
          return load;
        }, [tasks, months, preview]);


        /* KPI derived live from tasks — never hardcoded (§ prototype used static 30) */
        const kpi = React.useMemo(() => {
          // ponytail: same view-aware filter as groups memo
          const all = tasks || [];
          let list = monthView ? all : all.filter(t => !t._source);
          if (monthView) {
            const mi = months.indexOf(monthView);
            if (mi >= 0) list = list.filter(t => {
              if (!t.schedule) return false;
              const smi = months.indexOf(t.schedule.start.month);
              const emi = months.indexOf(t.schedule.end.month);
              return smi <= mi && mi <= emi;
            });
          }
          const by = (p) => list.filter((t) => t.priority === p).length;
          return {
            total: list.length,
            current: list.filter((t) => t.current).length,
            p0: by("P0"),
            p1: by("P1"),
            p2: by("P2"),
            p3: by("P3"),
            backlog: by("Backlog"),
          };
        }, [tasks, monthView, months]);

        /* §121 revised (user 2026-09-11): sort by Priority Rule, not manual rank.
           Priority (P1>P2>P3>Backlog) → Impact (H>M>L) → Effort (L>M>H) →
           Testing (L>M>H). Unknown metric sorts last. rank kept only as final
           tiebreak so order is deterministic. */
        const groups = React.useMemo(() => {
          const PRIO = { P0: -1, P1: 0, P2: 1, P3: 2, Backlog: 3 };
          const HIGH = { H: 0, M: 1, L: 2 }; // impact: high first
          const LOW = { L: 0, M: 1, H: 2 }; // effort/testing: low first
          const g = (map, v) => (v in map ? map[v] : 9);
          const cmp = (a, b) =>
            g(PRIO, a.priority) - g(PRIO, b.priority) ||
            g(HIGH, a.impact) - g(HIGH, b.impact) ||
            g(LOW, a.effort) - g(LOW, b.effort) ||
            g(LOW, a.testing) - g(LOW, b.testing) ||
            (a.rank || 0) - (b.rank || 0);
          const needle = q.trim().toLowerCase();
          const hit = (t) =>
            !needle ||
            [t.task, t.desc, t.strategicArea, t.sourceColumn, t.priority]
              .filter(Boolean)
              .some((s) => s.toLowerCase().includes(needle));
          const list0 = (tasks || []).filter(hit).sort(cmp);
          // default view: hide any OP-connected task (only show in month view)
          let list = monthView ? list0 : list0.filter(t => !t._source);
          // month-view: filter to selected month
          if (monthView) {
            const mi = months.indexOf(monthView);
            if (mi >= 0) {
              list = list.filter(t => {
                if (!t.schedule) return false;
                const smi = months.indexOf(t.schedule.start.month);
                const emi = months.indexOf(t.schedule.end.month);
                return smi <= mi && mi <= emi;
              });
            }
          }
          // enforce dependency order within a section: a task appears below all
          // its deps. Stable topo (Kahn) using cmp for the ready-set tiebreak so
          // priority order is preserved except where a dep forces a later slot.
          const depsOf = (t) =>
            (Array.isArray(t.dependency)
              ? t.dependency
              : t.dependency
              ? [t.dependency]
              : []);
          const ordered = (rows) => {
            const byId = new Map(rows.map((t) => [t.id, t]));
            const done = new Set();
            const out = [];
            let guard = rows.length + 1;
            while (out.length < rows.length && guard-- > 0) {
              for (const t of rows) {
                if (done.has(t.id)) continue;
                // ready when every in-section dep is already placed
                const ready = depsOf(t).every(
                  (d) => !byId.has(d) || done.has(d)
                );
                if (ready) {
                  out.push(t);
                  done.add(t.id);
                }
              }
            }
            // cycle fallback: append any leftover in cmp order
            if (out.length < rows.length)
              for (const t of rows) if (!done.has(t.id)) out.push(t);
            return out;
          };
          const cur = ordered(list.filter((t) => t.current && t._opStatusMapped !== "Closed"));
          const next = ordered(list.filter((t) => !t.current && t.schedule && t._opStatusMapped !== "Closed"));
          const closed = ordered(list.filter((t) => t._opStatusMapped === "Closed"));
          const backlog = ordered(list.filter((t) => !t.current && !t.schedule && t._opStatusMapped !== "Closed"));
          return [
            { key: "current", label: "CURRENT TASKS — START NOW", rows: cur, section: "current" },
            { key: "next", label: "NEXT UP", rows: next, section: "next" },
            { key: "closed", label: "CLOSED (OP)", rows: closed, section: "closed" },
            { key: "backlog", label: "BACKLOG", rows: backlog, section: "backlog" },
          ].filter((g) => g.rows.length);
        }, [tasks, q, monthView, months, verMap]);

        // after adding a task, scroll it into view and focus its name cell
        React.useEffect(() => {
          if (!focusId) return;
          const row = document.querySelector('[data-tid="' + focusId + '"]');
          if (!row) return;
          row.scrollIntoView({ behavior: "smooth", block: "center" });
          const edit = row.querySelector(".rm-editable");
          if (edit) edit.dispatchEvent(new MouseEvent("dblclick", { bubbles: true }));
          setFocusId(null);
        }, [focusId, groups]);

        /* dependency picker: a task can depend on many others, and any task can
           be a dependency of many rows. Store t.dependency as an id array
           (back-compat: coerce legacy string / null). Render names via lookup. */
        const nameById = React.useMemo(() => {
          const m = {};
          (tasks || []).forEach((t) => (m[t.id] = t.task));
          return m;
        }, [tasks]);
        // legacy string / null → array of dep ids
        const depList = (t) =>
          Array.isArray(t.dependency)
            ? t.dependency
            : t.dependency
            ? [t.dependency]
            : [];

        /* dependency cluster on hover: forward deps of hovered + reverse
           (tasks that depend on hovered). Used by clusteredGroups to
           temporarily move dep rows adjacent to the hovered row. */
        const hotDeps = React.useMemo(() => {
          if (!hotId || !tasks) return new Set();
          const hovered = tasks.find((x) => x.id === hotId);
          const ids = new Set(depList(hovered));
          tasks.forEach((t) => { if (t.id !== hotId && depList(t).includes(hotId)) ids.add(t.id); });
          return ids;
        }, [hotId, tasks]);

        const clusteredGroups = React.useMemo(() => {
          if (!hotDeps.size || !groups.length) return groups;
          const depTasks = [];
          const remaining = groups.map((g) => {
            const kept = [];
            g.rows.forEach((t) => { (hotDeps.has(t.id) ? depTasks : kept).push({ ...t, _fromGroup: g.key }); });
            return { ...g, rows: kept };
          });
          if (!depTasks.length) return groups;
          return remaining.map((g) => {
            const idx = g.rows.findIndex((t) => t.id === hotId);
            if (idx < 0) return g;
            return { ...g, rows: [...g.rows.slice(0, idx + 1), ...depTasks, ...g.rows.slice(idx + 1)] };
          });
        }, [groups, hotId, hotDeps]);

        // fetch a single OpenProject work package by id (server proxy), cache result
        const fetchWp = React.useCallback((opId) => {
          if (!opId) return;
          setWpCache((c) => ({ ...c, [opId]: { loading: true } }));
          fetch(`/api/dashboard/openproject/work-package/${encodeURIComponent(opId)}`)
            .then((r) => r.json())
            .then((j) => {
              if (!j.ok) throw new Error(j.error || "fetch failed");
              setWpCache((c) => ({ ...c, [opId]: { data: j.workPackage } }));
            })
            .catch((e) => setWpCache((c) => ({ ...c, [opId]: { error: e.message } })));
        }, []);
        const RM_PRD_STATES = ["", "Draft", "Review", "Approved", "Done"];

        // freeze the identity/metadata columns horizontally: only the timeline
        // scrolls sideways. Compute cumulative left from the header's sticky-cell
        // widths (running sum), then apply by column index to every row — avoids
        // offsetLeft positioned-ancestor quirks that leave a phantom left gutter.
        React.useEffect(() => {
          const panel = wrapRef.current
            ? wrapRef.current.querySelector(".table-panel")
            : null;
          if (!panel) return;
          const sync = () => {
            const head = panel.querySelector("thead tr");
            if (!head) return;
            const headSl = head.querySelectorAll(".sl");
            const lefts = [];
            let acc = 0;
            headSl.forEach((c) => {
              lefts.push(acc);
              acc += c.offsetWidth;
            });
            panel.querySelectorAll("tr").forEach((tr) => {
              tr.querySelectorAll(".sl").forEach((cell, i) => {
                if (lefts[i] != null) cell.style.left = lefts[i] + "px";
              });
            });
          };
          sync();
          const ro = new ResizeObserver(sync);
          ro.observe(panel);
          return () => ro.disconnect();
        }, [tasks, groups]);

        /* dependency connectors: elbow lines in the left gutter between the rank
           cells of a dep and its dependent — visible even when F is in P1 and A
           is far below in P3. Redrawn on data/hover/scroll (anchors sit on sticky
           cells, so horizontal scroll shifts their content-x). */
        React.useEffect(() => {
          const panel = panelRef.current, svg = svgRef.current;
          if (!panel || !svg) return;
          let raf = 0;
          const NS = "http://www.w3.org/2000/svg";
          const draw = () => {
            raf = 0;
            const pr = panel.getBoundingClientRect();
            svg.setAttribute("width", panel.scrollWidth);
            svg.setAttribute("height", panel.scrollHeight);
            while (svg.firstChild) svg.removeChild(svg.firstChild);
            panel.querySelectorAll("tr.dep-hot").forEach((r) => r.classList.remove("dep-hot"));
            const rowOf = {};
            panel.querySelectorAll("tr[data-tid]").forEach((r) => (rowOf[r.dataset.tid] = r));
            const pt = (r) => {
              const c = r.querySelector("td.num") || r;
              const cr = c.getBoundingClientRect();
              return { x: cr.right - pr.left + panel.scrollLeft - 6,
                       y: cr.top - pr.top + panel.scrollTop + cr.height / 2 };
            };
            let lane = 0;
            (tasks || []).forEach((t) => {
              const to = rowOf[t.id];
              if (!to) return;
              depList(t).forEach((d) => {
                const from = rowOf[d];
                if (!from || from === to) return;
                const a = pt(from), b = pt(to);
                const x = panel.scrollLeft + 6 + (lane++ % 4) * 4;
                const hot = hotId === t.id || hotId === d;
                const p = document.createElementNS(NS, "path");
                p.setAttribute("d", `M ${a.x} ${a.y} C ${x} ${a.y} ${x} ${b.y} ${b.x} ${b.y}`);
                if (hot) p.setAttribute("class", "hot");
                svg.appendChild(p);
                [[a, 2.2], [b, 3.2]].forEach(([n, r]) => {
                  const c = document.createElementNS(NS, "circle");
                  c.setAttribute("cx", n.x); c.setAttribute("cy", n.y); c.setAttribute("r", r);
                  if (hot) c.setAttribute("class", "hot");
                  svg.appendChild(c);
                });
                if (hot) { from.classList.add("dep-hot"); to.classList.add("dep-hot"); }
              });
            });
          };
          const onScroll = () => { if (!raf) raf = requestAnimationFrame(draw); };
          draw();
          panel.addEventListener("scroll", onScroll);
          const ro = new ResizeObserver(onScroll);
          ro.observe(panel);
          return () => { panel.removeEventListener("scroll", onScroll); ro.disconnect(); if (raf) cancelAnimationFrame(raf); };
        }, [tasks, groups, hotId]);

        if (err)
          return (
            <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", color:"var(--text-5)", fontSize:12 }}>
              Error loading roadmap: {err}
            </div>
          );
        if (!tasks)
          return (
            <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", color:"var(--text-5)", fontSize:12 }}>
              Loading…
            </div>
          );

        const level = (t, field) => (
          <RmCombo
            width={78}
            value={t[field]}
            options={RM_LEVELS}
            onChange={(v) => updateTask(t.id, { [field]: v })}
            label={`${field} for ${t.task}`}
            renderValue={(v) => (
              <span className={rmMetricClass(v)}>{v || "—"}</span>
            )}
          />
        );

        return (
          <div style={{ flex:1, minHeight:0, display:"flex", flexDirection:"column", overflow:"hidden", background:"var(--app-bg)" }}>
            <div className="bp-root rm-flexroot" data-theme={themeId || "navy"}>
              <div className="rm-wrap rm-flexcol" ref={wrapRef}>
                <div className="rm-sticky" ref={stickyRef}>
                <div className="rm-head">
                  <span className="rm-title">Roadmap</span>
                  <span className="rm-sub">
                    {(() => {
                      const shown = groups.reduce((n, g) => n + g.rows.length, 0);
                      return q.trim()
                        ? `${shown} / ${kpi.total} tasks`
                        : `${kpi.total} tasks · manual priority · autosaved`;
                    })()}
                  </span>
                  <input
                    type="search"
                    className="rm-search"
                    placeholder="Search tasks…"
                    value={q}
                    onChange={(e) => setQ(e.target.value)}
                  />
                  <button type="button" className="rm-addbtn" onClick={() => addTask(true)}>
                    + Current
                  </button>
                  <button type="button" className="rm-addbtn rm-addnext" onClick={() => addTask(false)}>
                    + Next
                  </button>
                  <button type="button" className="rm-addbtn rm-addnext" onClick={() => addTask(false, true)} title="Add unscheduled task">
                    + Backlog
                  </button>
                  <button type="button" className="rm-addbtn rm-addnext" onClick={addMonth} title="Tambah bulan berikutnya ke timeline">
                    + Month
                  </button>
                  <span className={"rm-saved" + (saved ? " on" : "")}>Saved</span>
                </div>

                {/* Month-view tabs (only visible when a month is selected) */}
                {monthView && (
                <div className="rm-month-tabs">
                  <button type="button" className="rm-month-tab" onClick={() => setMonthView(null)}>
                    All <span className="tab-count">{(tasks||[]).length}</span>
                  </button>
                  {months.map(m => {
                    const rmCount = (tasks||[]).filter(t => {
                      if (!t.schedule) return false;
                      return t.schedule.start.month === m || t.schedule.end.month === m ||
                        (months.indexOf(t.schedule.start.month) <= months.indexOf(m) && months.indexOf(m) <= months.indexOf(t.schedule.end.month));
                    }).length;
                    const hasVer = !!(verMap[m] && verMap[m].length);
                    return (
                      <button key={m} type="button" className={"rm-month-tab" + (monthView === m ? " active" : "")} onClick={() => setMonthView(m)}>
                        {!hasVer && <span className="tab-dot" title="No OP version assigned"></span>}
                        {m} <span className="tab-count">{rmCount}</span>
                      </button>
                    );
                  })}
                  <span className="rm-month-info" style={{marginLeft:8}}>
                    <span className="info-dot"></span>
                    {verMap[monthView] && verMap[monthView].length ? `Linked to ${verMap[monthView].length} OP version(s)` : `Double-click month header to link OP version`}
                  </span>
                </div>
                )}

                {deferred.length > 0 && (
                  <div className="rm-deferred" role="status">
                    ⚠ {deferred.length} task ter-defer (dependency BLOCKED): {deferred.join(", ")}
                  </div>
                )}

                <div className="stats-row">
                  <div className="stat-block">
                    <div className="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M9 3v3h6V3M8 11h8M8 15h5"/></svg></div>
                    <div><div className="stat-num">{kpi.total}</div><div className="stat-label">Total Tasks</div></div>
                  </div>
                  <div className="stat-block">
                    <div className="stat-icon"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
                    <div><div className="stat-num">{kpi.current}</div><div className="stat-label">Current Tasks</div></div>
                  </div>
                  {kpi.p0 > 0 && (
                    <div className="stat-block">
                      <div className="stat-icon" style={{background:"var(--priority-p0-bg)",color:"var(--priority-p0-fg)"}}><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 22h20z"/></svg></div>
                      <div>
                        <div><span className="stat-badge" style={{background:"var(--priority-p0-bg)",color:"var(--priority-p0-fg)"}}>▲ P0</span></div>
                        <div className="stat-num">{kpi.p0}</div><div className="stat-label">(Kritis / sekarang)</div>
                      </div>
                    </div>
                  )}
                  <div className="stat-block">
                    <div className="stat-icon" style={{background:"var(--priority-p1-bg)",color:"var(--priority-p1-fg)"}}><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg></div>
                    <div>
                      <div><span className="stat-badge" style={{background:"var(--priority-p1-bg)",color:"var(--priority-p1-fg)"}}>● P1</span></div>
                      <div className="stat-num">{kpi.p1}</div><div className="stat-label">(Kerjakan dulu)</div>
                    </div>
                  </div>
                  <div className="stat-block">
                    <div className="stat-icon" style={{background:"var(--priority-p2-bg)",color:"var(--priority-p2-fg)"}}><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="6"/></svg></div>
                    <div>
                      <div><span className="stat-badge" style={{background:"var(--priority-p2-bg)",color:"var(--priority-p2-fg)"}}>● P2</span></div>
                      <div className="stat-num">{kpi.p2}</div>
                    </div>
                  </div>
                  <div className="stat-block">
                    <div className="stat-icon" style={{background:"var(--priority-p3-bg)",color:"var(--priority-p3-fg)"}}><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.5 6H21l-5 4 2 7-6-4-6 4 2-7-5-4h6.5z"/></svg></div>
                    <div>
                      <div><span className="stat-badge" style={{background:"var(--priority-p3-bg)",color:"var(--priority-p3-fg)"}}>● P3</span></div>
                      <div className="stat-num">{kpi.p3}</div>
                    </div>
                  </div>
                  {kpi.backlog > 0 && (
                    <div className="stat-block">
                      <div className="stat-icon" style={{background:"var(--priority-backlog-bg)",color:"var(--priority-backlog-fg)"}}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"/></svg></div>
                      <div>
                        <div><span className="stat-badge" style={{background:"var(--priority-backlog-bg)",color:"var(--priority-backlog-fg)"}}>● Backlog</span></div>
                        <div className="stat-num">{kpi.backlog}</div><div className="stat-label">(Belum ready)</div>
                      </div>
                    </div>
                  )}

                  <div className="rules-area">
                    <div className="rule-box rule-cfg">
                      <div className="rule-title">Auto-Schedule</div>
                      <div className="cfg-row">
                        <label>Dev<input type="number" min="1" max="9" value={cfg.dev}
                          onChange={(e) => { const v = { ...cfg, dev: Math.max(1, +e.target.value || 1) }; setCfg(v); saveRoadmapIDB(v, "roadmap_cfg_v1"); }} /></label>
                        <label>QA<input type="number" min="1" max="9" value={cfg.qa}
                          onChange={(e) => { const v = { ...cfg, qa: Math.max(1, +e.target.value || 1) }; setCfg(v); saveRoadmapIDB(v, "roadmap_cfg_v1"); }} /></label>
                        <label>Cap<input type="number" min="0.1" max="1" step="0.05" value={cfg.cap}
                          onChange={(e) => { const v = { ...cfg, cap: Math.min(1, Math.max(0.1, +e.target.value || 0.8)) }; setCfg(v); saveRoadmapIDB(v, "roadmap_cfg_v1"); }} /></label>
                      </div>
                      <div className="cfg-row">
                        <button type="button" className="rm-addbtn rm-compute" onClick={computeSchedule} title="Hitung timeline dari effort/testing/priority/dependency + kapasitas tim (preview)">⚡ Compute</button>
                        {preview && (
                          <>
                            <button type="button" className="rm-addbtn rm-apply" onClick={applyPreview} title="Terapkan hasil scheduler ke timeline">✓ Apply</button>
                            <button type="button" className="rm-addbtn rm-discard" onClick={discardPreview} title="Batalkan preview">✕ Discard</button>
                          </>
                        )}
                      </div>
                    </div>
                    <div className="rule-box">
                      <div className="rule-title">Priority Rule</div>
                      <div className="rule-item">1. Impact (H &gt; M &gt; L)</div>
                      <div className="rule-item">2. Effort (L &gt; M &gt; H)</div>
                      <div className="rule-item">3. Testing (L &gt; M &gt; H)</div>
                      <div className="rule-item">4. Dependency (constraint timeline, bukan pengganti priority)</div>
                    </div>
                    <div className="rule-box">
                      <div className="rule-title">Timeline Codes</div>
                      <div className="rule-item">S = September &nbsp;&nbsp; D = December</div>
                      <div className="rule-item">O = October &nbsp;&nbsp;&nbsp;&nbsp; B = Backlog</div>
                      <div className="rule-item">N = November</div>
                    </div>
                  </div>
                </div>
                </div>

                {selIds.size > 0 && (
                <div className="rm-bulk-bar">
                  <span className="rm-bulk-count">{selIds.size} selected</span>
                  <select ref={bulkPrioRef} className="rm-bulk-sel" defaultValue="">
                    <option value="" disabled>Priority…</option>
                    {RM_PRIOS.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                  <select ref={bulkStatRef} className="rm-bulk-sel" defaultValue="">
                    <option value="" disabled>Status…</option>
                    {["NOW","NEXT","BACKLOG","HOLD","BLOCKED"].map(s => <option key={s} value={s}>{s}</option>)}
                  </select>
                  <button type="button" className="rm-addbtn" onClick={() => {
                    const p = bulkPrioRef.current?.value || "";
                    const s = bulkStatRef.current?.value || "";
                    if (!p && !s) return;
                    bulkApply(p || null, s || null);
                  }}>Apply</button>
                  <button type="button" className="rm-addbtn rm-addnext" onClick={() => setSelIds(new Set())}>Clear</button>
                </div>
                )}

                <div className="table-panel" ref={panelRef}>
                  <svg className="dep-svg" ref={svgRef}></svg>
                  <table className="task-table">
                    <thead>
                      <tr>
                        <th rowSpan={2} className="sl" style={{width:28,padding:0}}><input type="checkbox" checked={selIds.size > 0 && selIds.size === (groups||[]).reduce((n,g)=>n+g.rows.length,0)} onChange={toggleAll} title="Select all" /></th>
                        <th rowSpan={2} className="sl">#</th>
                        <th rowSpan={2} className="sl w250">Task</th>
                        <th rowSpan={2} className="sl w-area">Strategic Area</th>
                        <th rowSpan={2} className="sl w250">Description</th>
                        <th rowSpan={2} className="sl w80">Source</th>
                        <th rowSpan={2} className="sl w80">Impact</th>
                        <th rowSpan={2} className="sl w80">Effort</th>
                        <th rowSpan={2} className="sl w80">Testing</th>
                        <th rowSpan={2} className="sl w80">Dependency</th>
                        <th rowSpan={2} className="sl w80">Priority</th>
                        <th rowSpan={2} className="sl sl-edge w80">Status</th>
                        <th rowSpan={2} className="sl w70">Progress</th>
                        {months.map((m, mi) => {
                          const isActive = monthView === m;
                          const vIds = verMap[m] || [];
                          const hasVer = vIds.length > 0;
                          return (
                            <th key={mi} className="mo" colSpan={4}
                              style={{cursor:'pointer'}}
                              title={isActive ? 'Double-click to add/remove versions' : 'Double-click to filter ' + m}
                              onDoubleClick={() => { setMonthView(m); setVerDDOpen(true); }}>
                              {m}
                              {hasVer && <span style={{marginLeft:4,fontSize:9,color:'var(--accent-secondary)',fontWeight:700}}>{((opMeta.versions||[]).find(v => String(v.id) === String(vIds[0]))?.name || 'v'+vIds[0]) + (vIds.length > 1 ? ' +' + (vIds.length - 1) : '')}</span>}
                              {!hasVer && monthView === m && <span style={{marginLeft:4,width:6,height:6,borderRadius:3,background:'var(--accent-warning,#F59E0B)',display:'inline-block'}}></span>}
                              {/* inline version dropdown — multi-select, stays open until outside click */}
                              {isActive && verDDOpen && (
                                <div className="rm-ver-dd" ref={verDDRef} style={{position:'absolute',top:'100%',left:0,zIndex:200,width:260,maxHeight:220,overflow:'auto'}}
                                  onClick={e => e.stopPropagation()}>
                                  <input className="rm-ver-search" placeholder="Search versions…" value={verSearch} onChange={e => setVerSearch(e.target.value)} autoFocus />
                                  {(opMeta.versions||[]).filter(v => !verSearch || v.name.toLowerCase().includes(verSearch.toLowerCase())).map(v => {
                                    const on = vIds.some(id => String(id) === String(v.id));
                                    return (
                                    <div key={v.id} className={"rm-ver-opt" + (on ? " sel" : "")} onClick={() => {
                                      const kept = vIds.filter(id => String(id) !== String(v.id));
                                      const next = {...verMap, [m]: on ? kept : [...kept, v.id]};
                                      setVerMap(next); saveRoadmapIDB(next, "roadmap_ver_map_v1");
                                    }}>
                                      <span className="ver-name">{v.name}</span>
                                      <span className="ver-id">#{v.id}</span>
                                    </div>
                                    );
                                  })}
                                </div>
                              )}
                            </th>
                          );
                        })}
                        <th rowSpan={2} className="mo">Backlog</th>
                      </tr>
                      <tr>
                        {months.map((m, mi) =>
                          [1, 2, 3, 4].map((w) => {
                            const si = mi * 4 + (w - 1);
                            const load = slotLoad[si] || 0;
                            const over = load > cfg.dev;
                            return (
                              <th key={mi + "-" + w} className={"wk" + (w === 1 ? " mo-start" : "") + (over ? " wk-over" : "")}
                                style={over ? {cursor:"pointer"} : undefined}
                                title={over ? load + " task paralel > " + cfg.dev + " dev (overload) — klik untuk filter " + m : "W" + w}
                                onClick={over ? () => setMonthView(m) : undefined}>
                                {over ? load + "/" + cfg.dev : "W" + w}
                              </th>

                          })
                        )}
                      </tr>
                    </thead>
                    <tbody>
                      {clusteredGroups.map((g, gi) => (
                        <React.Fragment key={g.key}>
                          {/* spacer row between sections */}
                          {gi > 0 && (
                            <tr className="sec-gap"><td colSpan={RM_COLSPAN}></td></tr>
                          )}
                          <tr className="grp" data-section={g.section}>
                            <td colSpan={RM_COLSPAN}>
                              <span className="grp-label">{g.label}</span>
                              {g.section === "current" && <span style={{fontSize:10,color:"var(--text-3)",marginLeft:8}}>Start now</span>}
                              {g.section === "next" && <span style={{fontSize:10,color:"var(--text-3)",marginLeft:8}}>Planned work</span>}
                              {g.section === "backlog" && <span style={{fontSize:10,color:"var(--text-4)",marginLeft:8}}>Not scheduled</span>}
                              {g.section === "closed" && <span style={{fontSize:10,color:"var(--text-5)",marginLeft:8}}>Done di OpenProject</span>}
                            </td>
                          </tr>
                          {g.rows.map((t) => (
                            <React.Fragment key={t.id}>
                            <tr data-tid={t.id} data-group={t._fromGroup || g.section}
                              className={(hotId === t.id ? "dep-selected " : "") + (hotDeps.has(t.id) ? "dep-clustered" : "")}
                              onClick={(e) => {
                                // ponytail: a drag started in the timeline flags suppressClick; consume it here

                                // whitelist — only the sticky ID–Status columns (.sl) toggle cluster; timeline & controls ignored
                                if (!e.target.closest(".sl")) return;

                              }}>
                              <td className="sl" style={{width:28,padding:0,textAlign:'center'}}><input type="checkbox" checked={selIds.has(t.id)} onChange={() => toggleSel(t.id)} /></td>
                              <td className="num sl" title="Klik baris (kolom ID–Status) untuk sorot dependency">
                                <button
                                  type="button"
                                  className="rm-expand"
                                  title={expandedId === t.id ? "Collapse" : "Expand detail"}
                                  onClick={() => setExpandedId((e) => (e === t.id ? null : t.id))}
                                >
                                  {expandedId === t.id ? "▾" : "▸"}
                                </button>
                                <span className="rm-rank" onClick={() => setExpandedId((e) => (e === t.id ? null : t.id))} style={{cursor:"pointer"}}>{t.rank}</span>
                                <button
                                  type="button"
                                  className="rm-del"
                                  title="Delete task"
                                  onClick={() => {
                                    if (window.confirm(`Hapus task "${t.task}"?`)) removeTask(t.id);

                                </button>
                              </td>
                              <td className="tname sl w250">
                                {t._source === 'op' && <span className="rm-src-dot src-op" title="OpenProject task"></span>}

      // ── RoadmapPage: pixel replica of pen export 'Roadmap — All View (4Q)' ──

      // ── Roadmap Dropdown: reusable click-to-edit pill menu (local state only) ──
      // ponytail: one component for prio/status/E/I/T. Absolute menu, outside-click close.
      function RoadmapDropdown({ value, options, colorMap, w, radius, onChange }) {
        const [open, setOpen] = React.useState(false);
        const ref = React.useRef(null);
        React.useEffect(() => {
          if (!open) return;
          const h = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };

        const c = colorMap[value] || "#94a3b8";
        return (

            {open && (
              <div style={{ position: "absolute", top: "100%", left: 0, marginTop: 4, zIndex: 50, background: "#111827", border: "1px solid #263244", borderRadius: 6, overflow: "hidden", minWidth: 90 }}>
                {options.map((o) => (
                  <div key={o} onClick={(e) => { e.stopPropagation(); onChange(o); setOpen(false); }}
                    onMouseEnter={(e) => (e.currentTarget.style.background = "#1e293b")}
                    onMouseLeave={(e) => (e.currentTarget.style.background = "transparent")}
                    style={{ padding: "6px 10px", fontSize: 10, fontWeight: 700, color: colorMap[o] || "#cbd5e1", cursor: "pointer", whiteSpace: "nowrap", textAlign: "center" }}>{o}</div>
                ))}
              </div>
            )}
          </div>
        );
      }

      // ponytail: module-level bridge so the tier-2 nav-row "+ Q" button can
      // trigger addQuarter() living inside RoadmapPage without lifting state.
      const roadmapAddQ = { fn: null };
      const RM_MONTHS_ID = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
      const RM_Q_DOTS = ["#f59e0b", "#3b82f6", "#a78bfa", "#22c55e", "#06b6d4", "#ec4899", "#475569"];
      // next quarter after a label like "Q4 2026" → "Q1 2027"; months follow calendar
      function nextQuarter(prev, usedDots) {
        const m = /Q([1-4])\s+(\d{4})/.exec(prev.label || "");
        let qn = m ? +m[1] : 1, yr = m ? +m[2] : new Date().getFullYear();
        qn = qn % 4 + 1; if (qn === 1) yr += 1; // Q4→Q1 rolls year
        const start = (qn - 1) * 3; // Q1→0(Jan), Q4→9(Okt)
        const dot = RM_Q_DOTS.find((d) => !usedDots.includes(d)) || RM_Q_DOTS[(qn - 1) % RM_Q_DOTS.length];
        return { label: "Q" + qn + " " + yr, dot, months: [0, 1, 2].map((i) => RM_MONTHS_ID[start + i]) };
      }

      // ── qLink model helpers (multi-version). New shape: { versions:[{id,name,color}], scope } ──
      // scope: {type:'all-months'} | {type:'months',months:[0..2]} | {type:'all-weeks'} | {type:'weeks',weeks:[1..4]}
      const VER_PALETTE = ["#f59e0b", "#ec4899", "#3b82f6", "#22c55e", "#a78bfa", "#06b6d4", "#ef4444", "#84cc16"];
      const verColor = (id) => { let h = 0; const s = String(id); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return VER_PALETTE[h % VER_PALETTE.length]; };
      // normalize old single-version shape → {versions:[...], scope}
      function qlNorm(lk) {
        if (!lk) return null;
        if (Array.isArray(lk.versions)) return lk;
        // legacy: {versionId, versionName, scope:'all'|{weeks}}
        const versions = lk.versionId != null ? [{ id: lk.versionId, name: lk.versionName || ("v" + lk.versionId), color: verColor(lk.versionId) }] : [];
        const scope = lk.scope === "all" || !lk.scope ? { type: "all-months" } : { type: "weeks", weeks: lk.scope.weeks || [] };
        return { versions, scope };
      }
      const qlVerIds = (lk) => { const n = qlNorm(lk); return n ? n.versions.map((v) => v.id) : []; };
      const qlScopeLabel = (scope, months) => {
        if (!scope || scope.type === "all-months") return "all months";
        if (scope.type === "all-weeks") return "all weeks";
        if (scope.type === "months") return (scope.months || []).map((mi) => months[mi]).join(",");
        if (scope.type === "weeks") return "W" + (scope.weeks || []).join("");
        return "";
      };
      // seamless header badge: up to 3 colored diamonds + "+N"
      function VerDiamonds({ lk, size = 11 }) {
        const n = qlNorm(lk);
        if (!n || !n.versions.length) return null;
        const shown = n.versions.slice(0, 3), extra = n.versions.length - shown.length;
        return (

      // map RoadmapView tasks (IDB roadmap_v1, same data as the Project→Roadmap page) → RoadmapPage sections shape
      // [#, task, area, prio, status, E, I, T, assignees[], [mStart,mEnd]]  — month index 0 = Okt (RoadmapPage Q4 start)
      const RM_CAL = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Mei: 4, Jun: 5, Jul: 6, Aug: 7, Agu: 7, Sep: 8, Oct: 9, Okt: 9, Nov: 10, Dec: 11, Des: 11 };
      function tasksToSections(tasks) {
        const mIdx = (mn) => Math.max(0, (RM_CAL[mn] != null ? RM_CAL[mn] : 9) - 9); // calendar → RoadmapPage index (Okt=0)
        const span = (t) => t.schedule ? [mIdx(t.schedule.start.month), mIdx(t.schedule.end.month)] : [0, 0];
        // v2: "backlog" is a STATUS, not a priority. status===backlog → BACKLOG section regardless of schedule.
        const stat = (t) => t.status === "backlog" ? "backlog" : t.status === "hold" ? "hold" : t.status === "blocked" ? "blocked"
          : t.current ? "now" : t.schedule ? "next" : "backlog";
        const prio = (p) => ["P0", "P1", "P2", "P3"].includes(p) ? p : "P3"; // v2: no "Backlog" priority
        const lvl = (v) => ["H", "M", "L"].includes(v) ? v : "M";
        // sort rule copied from RoadmapView: priority → impact(H<M<L) → effort(L<M<H) → testing(L<M<H) → rank
        const PRIO = { P0: -1, P1: 0, P2: 1, P3: 2 }, HIGH = { H: 0, M: 1, L: 2 }, LOW = { L: 0, M: 1, H: 2 };
        const gm = (m, v) => (v in m ? m[v] : 9);
        const cmp = (a, b) =>
          gm(PRIO, prio(a.priority)) - gm(PRIO, prio(b.priority)) ||
          gm(HIGH, lvl(a.impact)) - gm(HIGH, lvl(b.impact)) ||
          gm(LOW, lvl(a.effort)) - gm(LOW, lvl(b.effort)) ||
          gm(LOW, lvl(a.testing)) - gm(LOW, lvl(b.testing)) ||
          (a.rank || 0) - (b.rank || 0);
        const sect = (t) => { const s = stat(t); return s === "backlog" ? "backlog" : s === "now" || t.current ? "now" : t.schedule || s === "next" ? "next" : "backlog"; };
        // ponytail: drop OP tasks by any marker; linked tasks stay (they are roadmap rows)
        const isOP = (t) => t._source === "op" || (typeof t.id === "string" && t.id.startsWith("op-")) || t.sourceColumn === "OP";
        const buckets = { now: [], next: [], backlog: [] };
        const kept = (tasks || []).filter((t) => !isOP(t));
        // resolve dependency task-ids → task names (fallback to raw id if unknown). matches v1 which stores deps as ids.
        const nameById = Object.fromEntries(kept.map((t) => [t.id, t.task || t.id]));
        const depIds = (t) => (Array.isArray(t.dependency) ? t.dependency : t.dependency ? [t.dependency] : []);
        const depNames = (t) => depIds(t).map((d) => nameById[d] || d);
        kept.sort(cmp).forEach((t) => buckets[sect(t)].push(t));
        const toRows = (arr) => arr.map((t, i) => [i + 1, t.task || "", t.strategicArea || "", prio(t.priority), stat(t),
          lvl(t.effort), lvl(t.impact), lvl(t.testing), [], span(t), depNames(t), t.desc || "", t.id, depIds(t)]); // r[12]=id, r[13]=raw dep ids
        return [["NOW", "#f59e0b", toRows(buckets.now)], ["NEXT", "#3b82f6", toRows(buckets.next)], ["BACKLOG", "#475569", toRows(buckets.backlog)]];
      }

      function RoadmapPage() {
        const QUARTERS_INIT = [
          { label: "Q4 2026", dot: "#f59e0b", months: ["Okt", "Nov", "Des"] },
          { label: "Q1 2027", dot: "#3b82f6", months: ["Jan", "Feb", "Mar"] },
          { label: "Q2 2027", dot: "#a78bfa", months: ["Apr", "Mei", "Jun"] },
          { label: "Q3 2027", dot: "#475569", months: ["Jul", "Agu", "Sep"] },
        ];
        const [QUARTERS, setQuarters] = React.useState(QUARTERS_INIT);
        const qLoaded = React.useRef(false);
        // persist custom quarter list to IDB (roadmap_quarters_v1) — load on mount, save on change (same pattern as qLink)
        React.useEffect(() => {
          loadRoadmapIDB("roadmap_quarters_v1").then((s) => {
            if (Array.isArray(s) && s.length) setQuarters(s);
            qLoaded.current = true;
          }).catch(() => { qLoaded.current = true; });
        }, []);
        React.useEffect(() => { if (qLoaded.current) saveRoadmapIDB(QUARTERS, "roadmap_quarters_v1"); }, [QUARTERS]);
        // ponytail: addQuarter already defined below (via nextQuarter + roadmapAddQ nav bridge) — don't redeclare here.
        // qLink: { [qLabel]: { versionId, versionName, scope } }  scope='all' | {weeks:[1..4]}
        const [qLink, setQLink] = React.useState({});
        const qLinkLoaded = React.useRef(false);
        // persist qLink to IDB (roadmap_q_link_v1) — load on mount, save on change
        React.useEffect(() => {
          loadRoadmapIDB("roadmap_q_link_v1").then((s) => {
            if (s && typeof s === "object") setQLink(s);
            qLinkLoaded.current = true;
          }).catch(() => { qLinkLoaded.current = true; });
        }, []);
        React.useEffect(() => {
          if (qLinkLoaded.current) saveRoadmapIDB(qLink, "roadmap_q_link_v1"); // skip the initial empty write before load resolves
        }, [qLink]);
        const [qPopup, setQPopup] = React.useState(null); // { label, x, y }
        const [monthView, setMonthView] = React.useState(null); // null | { qLabel, mi } (mi 0..2 within quarter)
        const qClickTimer = React.useRef(null); // distinguish single (month view) vs double (link popup) click on Q
        // Q timeline area is capped at 38vw and scrolls horizontally. ALL strips (header + every row) are scroll sources,
        // synced to one shared scrollLeft so dragging from any row moves the whole timeline together. header row is sticky-top.
        const qScrollNodes = React.useRef(new Set());
        const qSyncing = React.useRef(false);
        const regQScroll = (el) => { if (!el) return; qScrollNodes.current.add(el); };
        const onQScroll = (e) => {
          if (qSyncing.current) return;
          qSyncing.current = true;
          const sl = e.target.scrollLeft;
          qScrollNodes.current.forEach((n) => { if (n.isConnected && n !== e.target && n.scrollLeft !== sl) n.scrollLeft = sl; });
          requestAnimationFrame(() => { qSyncing.current = false; });
        };
        // Q timeline strip: 38vw cap, horizontal scroll, synced with all siblings. used in header + every row.
        // per-strip scrollbar hidden via .q-nobar; ONE shared scrollbar renders at table bottom (qScrollBar).
        const qStrip = (children) => (
          <div ref={regQScroll} onScroll={onQScroll} className="q-nobar"
            style={{ display: "flex", alignItems: "center", gap: 4, width: "38vw", flexShrink: 0, overflowX: "auto", overflowY: "hidden" }}>
            {children}
          </div>
        );
        // single shared horizontal scrollbar, sticky at the table bottom. inner spacer = total quarters width so the thumb size matches.
        const QTOTAL = () => QUARTERS.length * 152 + (QUARTERS.length - 1) * 4;
        const qScrollBar = (
          <div ref={regQScroll} onScroll={onQScroll}
            style={{ position: "sticky", bottom: 0, left: "auto", alignSelf: "flex-end", width: "38vw", flexShrink: 0, overflowX: "auto", overflowY: "hidden", background: "#0B0F15", zIndex: 4 }}>
            <div style={{ width: QTOTAL(), height: 1 }} />
          </div>
        );
        const [opVersions, setOpVersions] = React.useState([]);
        const [opMeta, setOpMeta] = React.useState({ priorities: [], statuses: [] }); // for roadmap→OP id mapping on push
        const [opPeople, setOpPeople] = React.useState([]); // available assignees fetched from OP (may be empty if token lacks permission)
        const [opEdits, setOpEdits] = React.useState({}); // local overlay of OP-row edits, keyed by wp.id. persisted; pushed to OP on demand.
        const opEditsLoaded = React.useRef(false);
        const [mvOp, setMvOp] = React.useState({ verId: null, loading: false, rows: [] }); // OP work packages for the linked version in month view
        // version + priority/status meta + available assignees from OpenProject
        React.useEffect(() => {
          let dead = false;
          (async () => {
            try {
              const r = await fetch("/api/dashboard/openproject/meta?projectId=7");
              const d = await r.json();
              if (!dead && d.ok) { setOpVersions(d.versions || []); setOpMeta({ priorities: d.priorities || [], statuses: d.statuses || [] }); }
            } catch (_) {}
            try {
              const r2 = await fetch("/api/dashboard/openproject/available-assignees?projectId=7");
              const d2 = await r2.json();
              if (!dead && d2.ok) setOpPeople(d2.assignees || []);
            } catch (_) {}
          })();
          return () => { dead = true; };
        }, []);
        // load/persist OP-row edit overlay
        React.useEffect(() => { (async () => { const v = await loadRoadmapIDB("roadmap_op_edits_v1"); if (v && typeof v === "object") setOpEdits(v); opEditsLoaded.current = true; })(); }, []);
        React.useEffect(() => { if (opEditsLoaded.current) saveRoadmapIDB(opEdits, "roadmap_op_edits_v1"); }, [opEdits]);
        const setOpEdit = (wpId, field, val) => setOpEdits((p) => ({ ...p, [wpId]: { ...(p[wpId] || {}), [field]: val } }));
        // fetch OP work packages for the Q's linked version(s) when month view opens on a linked Q
        const mvLink = monthView ? qLink[monthView.qLabel] : null;
        const mvVerIds = qlVerIds(mvLink);
        React.useEffect(() => {
          if (!mvLink || mvVerIds.length === 0) { setMvOp({ verId: null, loading: false, rows: [] }); return; }
          let dead = false;
          setMvOp({ verId: mvVerIds.join(","), loading: true, rows: [] });
          (async () => {
            try {
              const r = await fetch("/api/dashboard/openproject/work-packages?versionIds=" + mvVerIds.join(",") + "&pageSize=200");
              const d = await r.json();
              if (!dead) setMvOp({ verId: mvVerIds.join(","), loading: false, rows: d.ok ? (d.allWorkPackages || d.workPackages || []) : [] });
            } catch (_) { if (!dead) setMvOp({ verId: mvVerIds.join(","), loading: false, rows: [] }); }
          })();
          return () => { dead = true; };
        }, [mvVerIds.join(",")]);
        const addQuarter = React.useCallback(() => {
          setQuarters((prev) => {
            const used = prev.map((q) => q.dot);
            return [...prev, nextQuarter(prev[prev.length - 1], used)];
          });
        }, []);
        // register addQuarter into the nav-row bridge for the lifetime of this page
        React.useEffect(() => { roadmapAddQ.fn = addQuarter; return () => { roadmapAddQ.fn = null; }; }, [addQuarter]);
        const prio = { P0: "#ef4444", P1: "#f59e0b", P2: "#a78bfa", P3: "#475569" };
        // status vocab mapped to new set: Active→now, In Progress→next, New→backlog (+ hold/blocked selectable)
        const stat = { now: "#f59e0b", next: "#3b82f6", backlog: "#475569", hold: "#a78bfa", blocked: "#ef4444", done: "#22c55e" };
        const PRIO_OPTS = ["P0", "P1", "P2", "P3"];
        const STAT_OPTS = ["now", "next", "backlog", "hold", "blocked"];
        const EIM_OPTS = ["H", "M", "L"];
        const eim = { H: "#ef4444", M: "#f59e0b", L: "#22c55e" };
        // OP ↔ roadmap mapping (v2, user-defined). NOTE: differs from v1's RM_PRIO_FROM_OP — keep separate, don't reuse.
        // prio: urgent→P0, high→P1, med/normal→P2, low→P3. status: new→next, closed→done, everything else→now (in progress).
        const opPrioToRm = (name) => ({ urgent: "P0", high: "P1", medium: "P2", normal: "P2", low: "P3" })[String(name || "").trim().toLowerCase()] || "P2";
        const opStatusToRm = (name) => { const n = String(name || "").trim().toLowerCase(); return n === "new" ? "next" : (n === "closed" || n === "close" || n === "done" || n === "rejected") ? "done" : "now"; };
        // OP timeline = WHEN worked (which week), from the work package's start/due dates intersected with the viewed month.
        // roadmap fiscal year starts Oct (monthAbs 0 = Oct of the first quarter's year). returns [w1,w4] 1-based, or null if no date in this month.
        const Q0_YEAR = parseInt(String((QUARTERS[0] && QUARTERS[0].label) || "").match(/\d{4}/) || ["2026"], 10) || 2026;
        const opWeeksForMonth = (wp, monthAbsIdx) => {
          const realMonth = (9 + monthAbsIdx) % 12, realYear = Q0_YEAR + Math.floor((9 + monthAbsIdx) / 12);
          const wkOf = (iso) => { const d = new Date(iso); if (isNaN(d) || d.getMonth() !== realMonth || d.getFullYear() !== realYear) return null; return Math.min(4, Math.max(1, Math.ceil(d.getDate() / 7))); };
          const s = wp.startDate ? wkOf(wp.startDate) : null, e = wp.dueDate ? wkOf(wp.dueDate) : null;
          if (s == null && e == null) return null;
          return [s || e, e || s].sort((a, b) => a - b);
        };
        // merged view of an OP row = local overlay (opEdits) on top of the mapped OP values. all OP-row cells read through this.
        const opRowView = (wp) => {
          const o = opEdits[wp.id] || {};
          return {
            subject: o.subject != null ? o.subject : (wp.subject || ""),
            desc: o.desc != null ? o.desc : String(wp.description || "").slice(0, 1000), // OP desc capped at 1000 chars (truncate long imports)
            prio: o.prio != null ? o.prio : opPrioToRm(wp.priorityName),
            status: o.status != null ? o.status : opStatusToRm(wp.statusName),
            impact: o.impact || "", effort: o.effort || "", testing: o.testing || "",
            dependency: o.dependency || "", // CSV of names/ids, user-entered
            assigneeId: o.assigneeId != null ? o.assigneeId : (wp.assigneeId || null),
            qa: Array.isArray(o.qa) ? o.qa : [], // QA assignee ids (multiple) — no native OP field, lives in desc meta
            responsibleId: o.responsibleId != null ? o.responsibleId : null,
          };
        };
        // roadmap→OP id lookups for push

      // ── Dashboard v2: KPI strip + donut + status bars + difficulty/priority columns.

        // Difficulty/priority: real keys + 'unset' when non-zero. ponytail: 'unset' shown only if present.

        const prioKeys = [...(summary.priorityKeys || []), "unset"].filter((k) => (summary.priorities[k] || 0) > 0);
        const diffMax = Math.max(1, ...diffKeys.map((k) => summary.difficulties[k] || 0));
        const prioMax = Math.max(1, ...prioKeys.map((k) => summary.priorities[k] || 0));

        const ACCENTS = ["#6ea8fe", "#63e6be", "#ffd43b", "#ff8787", "#b197fc", "#ffa94d", "#74c0fc", "#8ce99a"];
        const colorFor = (i) => ACCENTS[i % ACCENTS.length];
        const label = (s) => String(s || "").replace(/(^|\s)\S/g, (c) => c.toUpperCase());

        const card = { background: "var(--elevated-bg)", border: "1px solid var(--border-1)", borderRadius: 10, padding: 16 };

            {/* KPI strip */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 12, marginBottom: 16 }}>

                <div key={k.l} style={card}>

                  <div style={kpiLbl}>{k.l}</div>

            <div style={{ display: "grid", gridTemplateColumns: "280px 1fr", gap: 12, marginBottom: 16 }}>
              {/* Overall donut */}
              <div style={{ ...card, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center" }}>
                <div style={{ ...secTitle, alignSelf: "flex-start" }}>Overall</div>
                <svg width="140" height="140" viewBox="0 0 140 140">
                  <circle cx="70" cy="70" r={R} fill="none" stroke="var(--border-1)" strokeWidth="14" />
                  <circle cx="70" cy="70" r={R} fill="none" stroke="#63e6be" strokeWidth="14"
                    strokeLinecap="round" strokeDasharray={`${dash} ${C}`} transform="rotate(-90 70 70)" />
                  <text x="70" y="70" textAnchor="middle" dominantBaseline="central"
                    fontSize="26" fontWeight="700" fill="var(--text-1)">{overallPct + "%"}</text>

              {/* Task Status horizontal bars */}
              <div style={card}>
                <div style={secTitle}>Task Status</div>
                <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                  {statusKeys.length === 0 ? (
                    <div style={{ fontSize: 12, color: "var(--text-3)" }}>No status data.</div>
                  ) : statusKeys.map((k, i) => {
                    const val = summary.statuses[k] || 0;
                    const w = Math.round((val / statusMax) * 100);
                    return (
                      <div key={k} style={{ display: "flex", alignItems: "center", gap: 10 }}>
                        <div style={{ width: 110, fontSize: 11, color: "var(--text-2)", textAlign: "right" }}>{label(k)}</div>
                        <div style={{ flex: 1, height: 16, background: "var(--border-1)", borderRadius: 4, overflow: "hidden" }}>

            {/* Difficulty + Priority columns */}
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>

      }

      // ── Cost sub-page: upload AWS cost export (CSV/XLSX), parse in-browser ──
      // ponytail: CSV native parser (no dep); XLSX via CDN SheetJS. No fabricated numbers.
      function parseCsv(text) {
        // RFC-4180-ish: handles quoted fields, commas/newlines inside quotes, "" escape.
        const rows = [];
        let row = [], field = "", inQ = false;
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          if (inQ) {
            if (c === '"') {
              if (text[i + 1] === '"') { field += '"'; i++; }
              else inQ = false;
            } else field += c;
          } else {
            if (c === '"') inQ = true;
            else if (c === ",") { row.push(field); field = ""; }
            else if (c === "\r") { /* skip */ }
            else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
            else field += c;
          }
        }
        if (field.length || row.length) { row.push(field); rows.push(row); }
        // drop trailing empty rows
        while (rows.length && rows[rows.length - 1].every((x) => String(x).trim() === "")) rows.pop();
        return rows;
      }
      // ponytail: strip currency/commas/parens-as-negative; keep real negatives (credits).
      function parseNum(v) {
        if (v == null) return NaN;
        let s = String(v).trim();
        if (!s) return NaN;
        let neg = false;
        if (/^\(.*\)$/.test(s)) { neg = true; s = s.slice(1, -1); }
        s = s.replace(/[^0-9.\-]/g, "");
        if (s === "" || s === "-" || s === ".") return NaN;
        let n = Number(s);
        if (!isFinite(n)) return NaN;
        return neg ? -n : n;
      }
      function CostDashboard() {
        const [data, setData] = React.useState(null); // { headers, rows, fileName }
        const [err, setErr] = React.useState("");

        const card = { background: "var(--elevated-bg)", border: "1px solid var(--border-1)", borderRadius: 10, padding: 16 };
        const kpiVal = { fontSize: 26, fontWeight: 700, color: "var(--text-1)", lineHeight: 1.1 };
        const kpiLbl = { fontSize: 11, color: "var(--text-3)", marginTop: 4, textTransform: "uppercase", letterSpacing: 0.4 };
        const secTitle = { fontSize: 12, fontWeight: 600, color: "var(--text-2)", textTransform: "uppercase", letterSpacing: 0.5, marginBottom: 12 };
        const ACCENTS = ["#6ea8fe", "#63e6be", "#ffd43b", "#ff8787", "#b197fc", "#ffa94d", "#74c0fc", "#8ce99a"];
        const colorFor = (i) => ACCENTS[i % ACCENTS.length];
        const fmt = (n) => (isFinite(n) ? n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : "—");

        // matrix = array-of-arrays (header row + data rows). Normalize to {headers, rows}.
        function ingest(matrix, fileName) {
          const clean = (matrix || []).filter((r) => r && r.some((c) => String(c == null ? "" : c).trim() !== ""));
          if (clean.length < 2) { setErr("File has no data rows."); setData(null); return; }
          const headers = clean[0].map((h) => String(h == null ? "" : h).trim());
          const rows = clean.slice(1);
          setErr("");
          setData({ headers, rows, fileName });
        }

        function onFile(e) {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const isX = /\.xlsx$/i.test(file.name);
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              if (isX) {
                if (!window.XLSX) { setErr("XLSX library not loaded (offline?)"); setData(null); return; }
                const wb = window.XLSX.read(new Uint8Array(ev.target.result), { type: "array" });
                const ws = wb.Sheets[wb.SheetNames[0]];
                const matrix = window.XLSX.utils.sheet_to_json(ws, { header: 1 });
                ingest(matrix, file.name);
              } else {
                ingest(parseCsv(String(ev.target.result)), file.name);
              }
            } catch (ex) {
              setErr("Parse failed: " + (ex && ex.message ? ex.message : String(ex)));
              setData(null);
            }
          };
          reader.onerror = () => { setErr("Could not read file."); setData(null); };
          if (isX) reader.readAsArrayBuffer(file);
          else reader.readAsText(file);
        }

        // derive metrics from parsed data
        const model = React.useMemo(() => {
          if (!data) return null;
          const { headers, rows } = data;
          const n = headers.length;
          // numeric columns = any col where a majority of data cells parse as numbers
          const numericCols = [];
          for (let c = 0; c < n; c++) {
            let ok = 0, tot = 0;
            for (const r of rows) { const v = r[c]; if (String(v == null ? "" : v).trim() !== "") { tot++; if (isFinite(parseNum(v))) ok++; } }
            if (tot > 0 && ok / tot >= 0.6) numericCols.push(c);
          }
          // service/name col = first non-numeric column (fallback col 0)
          let nameCol = 0;
          for (let c = 0; c < n; c++) { if (!numericCols.includes(c)) { nameCol = c; break; } }
          // identify a 'Total costs' column (if present) and month columns = numeric cols that aren't the total col
          const lc = headers.map((h) => h.toLowerCase());
          let totalColIdx = -1;
          for (const c of numericCols) { if (/total/.test(lc[c])) { totalColIdx = c; break; } }
          const monthCols = numericCols.filter((c) => c !== totalColIdx);

          // detect a 'Total costs' summary data row (name col matches /total/)
          let summaryRowIdx = -1;
          for (let i = rows.length - 1; i >= 0; i--) {
            if (/total/i.test(String(rows[i][nameCol] || ""))) { summaryRowIdx = i; break; }
          }
          const serviceRows = rows.filter((_, i) => i !== summaryRowIdx);

          // per-month sums over service rows
          const monthSums = monthCols.map((c) => serviceRows.reduce((a, r) => { const v = parseNum(r[c]); return a + (isFinite(v) ? v : 0); }, 0));
          const monthLabels = monthCols.map((c) => headers[c] || ("col" + c));

          // per-service total (use total col if present else sum of month cols)
          const services = serviceRows.map((r) => {
            const name = String(r[nameCol] == null ? "" : r[nameCol]).trim() || "(unnamed)";
            let tot;
            if (totalColIdx >= 0) { tot = parseNum(r[totalColIdx]); }
            else { tot = monthCols.reduce((a, c) => { const v = parseNum(r[c]); return a + (isFinite(v) ? v : 0); }, 0); }
            return { name, total: isFinite(tot) ? tot : 0, cells: monthCols.map((c) => parseNum(r[c])) };
          });

          // net total: prefer summary row's total col, else total col sum, else month sums sum
          let net;
          if (summaryRowIdx >= 0 && totalColIdx >= 0) net = parseNum(rows[summaryRowIdx][totalColIdx]);
          if (!isFinite(net)) net = services.reduce((a, s) => a + s.total, 0);
          const gross = services.reduce((a, s) => a + (s.total > 0 ? s.total : 0), 0);
          const credits = services.reduce((a, s) => a + (s.total < 0 ? s.total : 0), 0); // negative or 0
          const nMonths = monthCols.length;
          const avg = nMonths ? net / nMonths : net;

          return { headers, nameCol, monthCols, monthLabels, monthSums, services, net, gross, credits, nMonths, avg, totalColIdx, summaryRowIdx };
        }, [data]);

        if (!data || !model) {
          return (
            <div style={{ flex: 1, minHeight: 0, overflow: "auto", background: "var(--app-bg)", padding: 20 }}>
              <div style={{ marginBottom: 16 }}>
                <div style={{ fontSize: 18, fontWeight: 700, color: "var(--text-1)" }}>Cost — AWS Billing</div>
                <div style={{ fontSize: 12, color: "var(--text-3)", marginTop: 2 }}>net of credits/discounts</div>
                <span style={{ display: "inline-block", marginTop: 8, padding: "3px 10px", borderRadius: 6, fontSize: 11, color: "#F59E0B", background: "#F59E0B22", border: "1px solid #F59E0B55" }}>costs.csv • AWS Cost Explorer</span>
              </div>
              <div style={{ ...card, display: "flex", flexDirection: "column", alignItems: "center", gap: 12, padding: 40 }}>
                <div style={{ color: "var(--text-2)", fontSize: 14 }}>Upload AWS cost export (CSV or XLSX)</div>
                <input type="file" accept=".csv,.xlsx" onChange={onFile}
                  style={{ color: "var(--text-3)", fontSize: 12 }} />
                {err ? <div style={{ color: "#ff8787", fontSize: 12 }}>{err}</div> : null}
              </div>
            </div>
          );
        }

        const topServices = [...model.services].sort((a, b) => Math.abs(b.total) - Math.abs(a.total)).slice(0, 7);
        const topMax = Math.max(1, ...topServices.map((s) => Math.abs(s.total)));
        const monthMax = Math.max(1, ...model.monthSums.map((v) => Math.abs(v)));

        const kpis = [
          { v: fmt(model.net), l: "Net Total" },
          { v: fmt(model.gross), l: "Gross" },
          { v: fmt(model.credits), l: "Credits" },
          { v: fmt(model.avg), l: "Avg / Month" },
          { v: String(model.nMonths), l: "# Months" },
        ];

        return (
          <div style={{ flex: 1, minHeight: 0, overflow: "auto", background: "var(--app-bg)", padding: 20 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <div>
                <div style={{ fontSize: 18, fontWeight: 700, color: "var(--text-1)" }}>Cost — AWS Billing</div>
                <div style={{ fontSize: 12, color: "var(--text-3)", marginTop: 2 }}>net of credits/discounts</div>
              </div>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <span style={{ padding: "3px 10px", borderRadius: 6, fontSize: 11, color: "#F59E0B", background: "#F59E0B22", border: "1px solid #F59E0B55" }}>costs.csv • AWS Cost Explorer</span>
                <span style={{ fontSize: 11, color: "var(--text-3)" }}>{data.fileName}</span>
                <input type="file" accept=".csv,.xlsx" onChange={onFile} style={{ color: "var(--text-3)", fontSize: 11 }} />
              </div>
            </div>
            {err ? <div style={{ color: "#ff8787", fontSize: 12, marginBottom: 12 }}>{err}</div> : null}
            {model.net !== model.gross ? (
              <div style={{ fontSize: 11, color: "var(--text-3)", marginBottom: 12 }}>
                Net differs from Gross — credits/negative values present ({fmt(model.credits)}).
              </div>
            ) : null}

            {/* KPI strip */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(5, 1fr)", gap: 12, marginBottom: 16 }}>
              {kpis.map((k) => (
                <div key={k.l} style={card}>
                  <div style={kpiVal}>{k.v}</div>
                  <div style={kpiLbl}>{k.l}</div>
                </div>
              ))}
            </div>

            {/* Monthly column chart */}
            <div style={{ ...card, marginBottom: 16 }}>
              <div style={secTitle}>Monthly Cost</div>
              {model.monthCols.length === 0 ? (
                <div style={{ fontSize: 12, color: "var(--text-3)" }}>No monthly columns detected.</div>
              ) : (
                <div style={{ display: "flex", alignItems: "flex-end", gap: 10, height: 140 }}>
                  {model.monthSums.map((v, i) => {
                    const h = Math.round((Math.abs(v) / monthMax) * 110) + 4;
                    return (
                      <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
                        <div style={{ fontSize: 10, color: "var(--text-2)" }}>{fmt(v)}</div>
                        <div style={{ width: "100%", height: h, background: v < 0 ? "#ff8787" : colorFor(i), borderRadius: "4px 4px 0 0" }} />
