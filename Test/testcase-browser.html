                <div style={statCard}><div style={{ fontSize:11, color:'var(--text-4)', textTransform:'uppercase' }}>Total</div><div style={{ marginTop:6, fontSize:24, fontWeight:700 }}>{tcStats?.total ?? '-'}</div></div>
                <div style={statCard}><div style={{ fontSize:11, color:'var(--text-4)', textTransform:'uppercase' }}>Manual</div><div style={{ marginTop:6, fontSize:24, fontWeight:700 }}>{typeRows.find(x => x.tc_type === 'manual')?.n ?? 0}</div></div>
                <div style={statCard}><div style={{ fontSize:11, color:'var(--text-4)', textTransform:'uppercase' }}>Auto</div><div style={{ marginTop:6, fontSize:24, fontWeight:700 }}>{typeRows.find(x => x.tc_type === 'auto')?.n ?? 0}</div></div>
                <div style={statCard}><div style={{ fontSize:11, color:'var(--text-4)', textTransform:'uppercase' }}>Last Run Status</div><div style={{ marginTop:6, fontSize:13, lineHeight:1.7, color:'var(--text-2)' }}>{runRows.length ? runRows.map(x => `${x.status}: ${x.n}`).join(' · ') : '-'}</div></div>
              </div>
              <div style={{ display:'grid', gridTemplateColumns:'1.4fr 1fr 1fr', gap:12 }}>
                <div style={statCard}><div style={{ fontSize:11, color:'var(--text-4)', textTransform:'uppercase', marginBottom:8 }}>By Module</div><div style={{ display:'grid', gap:6 }}>{topModules.length ? topModules.map(row => <div key={row.module} style={{ display:'flex', justifyContent:'space-between', gap:8, fontSize:12 }}><span style={{ color:'var(--text-2)' }}>{row.module || '-'}</span><span style={{ color:'var(--text-1)', fontWeight:700 }}>{row.n}</span></div>) : <div style={{ fontSize:12, color:'var(--text-5)' }}>No data</div>}</div></div>
                <div style={statCard}><div style={{ fontSize:11, color:'var(--text-4)', textTransform:'uppercase', marginBottom:8 }}>By Type</div><div style={{ display:'grid', gap:6 }}>{typeRows.length ? typeRows.map(row => <div key={row.tc_type} style={{ display:'flex', justifyContent:'space-between', gap:8, fontSize:12 }}><span style={{ color:'var(--text-2)' }}>{row.tc_type}</span><span style={{ color:'var(--text-1)', fontWeight:700 }}>{row.n}</span></div>) : <div style={{ fontSize:12, color:'var(--text-5)' }}>No data</div>}</div></div>
                <div style={statCard}><div style={{ fontSize:11, color:'var(--text-4)', textTransform:'uppercase', marginBottom:8 }}>By Last Run</div><div style={{ display:'grid', gap:6 }}>{runRows.length ? runRows.map(row => <div key={row.status} style={{ display:'flex', justifyContent:'space-between', gap:8, fontSize:12 }}><span style={{ color:'var(--text-2)' }}>{row.status}</span><span style={{ color:'var(--text-1)', fontWeight:700 }}>{row.n}</span></div>) : <div style={{ fontSize:12, color:'var(--text-5)' }}>No run data</div>}</div></div>
              </div>
            </div>
          ) : (
            <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', color:'var(--text-5)', fontSize:12 }}>
              {sub}: konten akan diisi sesuai item yang dipilih
            </div>
          )}
        </div>
      );
    }

    function renderMemoryView() {
    return (
    <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center', background:'var(--app-bg)', color:'var(--text-5)', fontSize:12 }}>
    Memory — belum ada konten
    </div>
    );
    }

    useEffect(() => {
      if (requestSyncMeta.loading || !requestBlocks?.length) return;
      const t = setTimeout(() => {
        setRequestSyncMeta(prev => ({ ...prev, saving:true, error:'' }));
        fetch('/api/new-request', {
          method:'PUT',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ blocks: requestBlocks, updatedBy: user?.name || user?.username || 'user' })
        }).then(r => r.json()).then(d => {
          if (!d?.ok) throw new Error(d?.error || 'Save failed');
          setRequestSyncMeta({ loading:false, saving:false, error:'', updatedAt:d.updatedAt || null, updatedBy:d.updatedBy || null });
        }).catch(e => setRequestSyncMeta(prev => ({ ...prev, saving:false, error:'Save failed: ' + e.message })));
      }, 400);
      return () => clearTimeout(t);
    }, [requestBlocks, user?.name, user?.username]);

    useEffect(() => {
      if (!pendingRequestFocusId || !requestEditorRef.current) return;
      const el = requestEditorRef.current.querySelector(`[data-block-id="${pendingRequestFocusId}"] [data-block-text]`);
      if (!el) return;
      const textNode = el.firstChild && el.firstChild.nodeType === Node.TEXT_NODE ? el.firstChild : el;
      const fullText = el.textContent || '';
      const wanted = pendingRequestFocusOffsetRef.current;
      const offset = typeof wanted === 'number' ? Math.max(0, Math.min(wanted, fullText.length)) : fullText.length;
      const sel = window.getSelection();
      const range = document.createRange();
      if (textNode === el) {
        range.selectNodeContents(el);
        range.collapse(false);
      } else {
        range.setStart(textNode, offset);
        range.collapse(true);
      }
      sel.removeAllRanges();
      sel.addRange(range);
      requestEditorRef.current.focus();
      pendingRequestFocusOffsetRef.current = null;
      setPendingRequestFocusId(null);
    }, [requestBlocks, pendingRequestFocusId]);

    function currentBlockIdFromSelection() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0) return null;
      let n = sel.anchorNode;
      while (n && n !== requestEditorRef.current) {
        if (n.nodeType === 1 && n.dataset && n.dataset.blockId) return n.dataset.blockId;
        n = n.parentNode;
      }
      return null;
    }
    function currentBlockIdsFromSelection() {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || !requestEditorRef.current) return [];
      const range = sel.getRangeAt(0);
      const blocks = Array.from(requestEditorRef.current.querySelectorAll('[data-block-id]'));
      const ids = blocks.filter(el => {
        try { return range.intersectsNode(el); } catch { return false; }
      }).map(el => el.dataset.blockId).filter(Boolean);
      return ids.length ? ids : [currentBlockIdFromSelection()].filter(Boolean);
    }
    function caretAtBlockStart(id) {
      const sel = window.getSelection();
      if (!sel || sel.rangeCount === 0 || !requestEditorRef.current || !id) return false;
      const textEl = requestEditorRef.current.querySelector(`[data-block-id="${id}"] [data-block-text]`);
      if (!textEl) return false;
      const range = sel.getRangeAt(0);
      if (!range.collapsed) return false;
      const probe = document.createRange();
      probe.selectNodeContents(textEl);
      probe.setEnd(range.startContainer, range.startOffset);
      return probe.toString().length === 0;
    }
    function patchRequestBlocks(ids, patch) {
      if (!ids?.length) return;
      const set = new Set(ids);
      setRequestBlocks(prev => prev.map(b => set.has(b.id) ? { ...b, ...patch } : b));
    }
    function patchRequestBlock(id, patch) {
      setRequestBlocks(prev => prev.map(b => b.id === id ? { ...b, ...patch } : b));
    }
    function syncRequestBlocksFromDom() {
      if (!requestEditorRef.current) return;
      const next = Array.from(requestEditorRef.current.querySelectorAll('[data-block-id]')).map((el, idx) => {
        const textEl = el.querySelector('[data-block-text]');
        return {
          id: el.dataset.blockId || `req-${idx}`,
          type: el.dataset.blockType || 'text',
          text: (textEl ? textEl.textContent : el.textContent) || '',
          checked: el.dataset.blockChecked === 'true',
          menuOpen: false,
        };
      });
      if (next.length) setRequestBlocks(next);
    }

    function addRequestBlock(afterId) {
      const block = { id:'req-' + Date.now() + '-' + Math.random().toString(36).slice(2,6), type:'text', text:'', checked:false };
      pendingRequestFocusOffsetRef.current = 0;
      setPendingRequestFocusId(block.id);
      setRequestBlocks(prev => {
        const i = prev.findIndex(b => b.id === afterId);
        return i === -1 ? [...prev, block] : [...prev.slice(0, i + 1), block, ...prev.slice(i + 1)];
      });
    }
    function removeRequestBlock(id) {
      setRequestBlocks(prev => {
        if (prev.length <= 1) return prev;
        const idx = prev.findIndex(b => b.id === id);
        const next = prev.filter(b => b.id !== id);
        const prevId = idx > 0 ? prev[idx - 1]?.id : next[0]?.id;
        pendingRequestFocusOffsetRef.current = null;
        setPendingRequestFocusId(prevId || null);
        return next;
      });
    }
    function moveRequestBlock(fromId, toId) {
      if (!fromId || !toId || fromId === toId) return;
      setRequestBlocks(prev => {
        const fromIdx = prev.findIndex(b => b.id === fromId);
        const toIdx = prev.findIndex(b => b.id === toId);
        if (fromIdx === -1 || toIdx === -1) return prev;
        const next = [...prev];
        const [moved] = next.splice(fromIdx, 1);
        next.splice(toIdx, 0, moved);
        return next;
      });
    }
    useEffect(() => {
      const onPointerDown = (e) => {
        if (!requestEditorRef.current) return;
        if (!requestEditorRef.current.contains(e.target)) {
          setRequestBlocks(prev => prev.some(b => b.menuOpen) ? prev.map(b => b.menuOpen ? { ...b, menuOpen:false } : b) : prev);
        }
      };
      document.addEventListener('pointerdown', onPointerDown);
      return () => document.removeEventListener('pointerdown', onPointerDown);
    }, []);
    function renderNewRequestView() {
      const blockTypes = ['text','todo','bullet','numbered'];
      const iconBtn = {
        width:22, height:22, borderRadius:6, border:'1px solid var(--border-1)', background:'transparent',
        color:'var(--text-4)', cursor:'pointer', display:'inline-flex', alignItems:'center', justifyContent:'center', fontSize:12
      };
      let numberedCounter = 0;
      return (
        <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', background:'var(--app-bg)' }}>
          <div style={{ padding:'12px 20px', borderBottom:'1px solid var(--border-1)' }}>
            <div style={{ fontSize:18, fontWeight:700, color:'var(--text-1)' }}>New Request</div>
            <div style={{ fontSize:11, color:'var(--text-4)', marginTop:4 }}>Select bebas lintas block. Enter = block baru. Hover kiri untuk + / menu.</div>
            <div style={{ fontSize:10, color: requestSyncMeta.error ? '#fca5a5' : 'var(--text-5)', marginTop:4 }}>
              {requestSyncMeta.loading ? 'Loading shared draft…' : requestSyncMeta.saving ? 'Saving to server…' : requestSyncMeta.error ? requestSyncMeta.error : `Shared draft${requestSyncMeta.updatedBy ? ` · by ${requestSyncMeta.updatedBy}` : ''}${requestSyncMeta.updatedAt ? ` · ${requestSyncMeta.updatedAt}` : ''}`}
            </div>
          </div>
          <div style={{ flex:1, overflowY:'auto', padding:'18px 26px 80px' }}>
            <div style={{ maxWidth:860, margin:'0 auto' }}>
              <div
                ref={requestEditorRef}
                contentEditable
                suppressContentEditableWarning
                onBlur={() => syncRequestBlocksFromDom()}
                onKeyDown={e => {
                  if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    const id = currentBlockIdFromSelection();
                    syncRequestBlocksFromDom();
                    addRequestBlock(id);
                  } else if (e.key === ' ' && !e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
                    const id = currentBlockIdFromSelection();
                    const el = id ? requestEditorRef.current?.querySelector(`[data-block-id="${id}"] [data-block-text]`) : null;
                    if (id && el && el.textContent === '-') {
                      e.preventDefault();
                      el.textContent = '';
                      patchRequestBlock(id, { type:'bullet', text:'' });
                      pendingRequestFocusOffsetRef.current = 0;
                      setPendingRequestFocusId(id);
                    }
                  } else if (e.key === 'Backspace') {
                    const id = currentBlockIdFromSelection();
                    if (id) {
                      const el = requestEditorRef.current?.querySelector(`[data-block-id="${id}"] [data-block-text]`);
                      if (el && !el.textContent.trim()) {
                        e.preventDefault();
                        removeRequestBlock(id);
                        return;
                      }
                      if (caretAtBlockStart(id)) {
                        e.preventDefault();
                        syncRequestBlocksFromDom();
                        setRequestBlocks(prev => {
                          const idx = prev.findIndex(b => b.id === id);
                          if (idx <= 0) return prev;
                          const curr = prev[idx];
                          const before = prev[idx - 1];
                          const glue = before.text && curr.text ? ' ' : '';
                          const merged = { ...before, text: `${before.text || ''}${glue}${curr.text || ''}` };
                          pendingRequestFocusOffsetRef.current = (before.text || '').length + glue.length;
                          setPendingRequestFocusId(before.id);
                          return [...prev.slice(0, idx - 1), merged, ...prev.slice(idx + 1)];
                        });
                      }
                    }
                  }
                }}
                style={{ outline:'none', color:'var(--text-1)', fontSize:13, lineHeight:1.7 }}>
                {requestBlocks.map((block) => {
                  const menuOpen = block.menuOpen === true;
                  if (block.type === 'numbered') numberedCounter += 1; else numberedCounter = 0;
                  return (
                    <div
                      key={block.id}
                      data-block-id={block.id}
                      data-block-type={block.type}
                      data-block-checked={block.checked ? 'true' : 'false'}
                      className='nr-block'
                      style={{ position:'relative', padding:'4px 0' }}
                      onDragOver={e => {
                        if (!requestDragSrcRef.current) return;
                        e.preventDefault();
                        e.dataTransfer.dropEffect = 'move';
                      }}
                      onDrop={e => {
                        const from = requestDragSrcRef.current;
                        if (!from) return;
                        e.preventDefault();
                        moveRequestBlock(from, block.id);
                        requestDragSrcRef.current = null;
                      }}>
                      <div contentEditable={false} style={{ position:'absolute', left:-52, top:4, display:'flex', gap:6, opacity:0.18, userSelect:'none' }} className='nr-hover-actions'>
                        <button title='Add below' onMouseDown={e => { e.preventDefault(); syncRequestBlocksFromDom(); addRequestBlock(block.id); }} style={iconBtn}>+</button>
                        <button
                          title='Drag to reorder · click to open menu'
                          draggable
                          onDragStart={e => {
                            requestDragSrcRef.current = block.id;
                            e.dataTransfer.effectAllowed = 'move';
                            e.dataTransfer.setData('text/plain', block.id);
                          }}
                          onDragEnd={() => { requestDragSrcRef.current = null; }}
                          onClick={e => {
                            e.preventDefault();
                            patchRequestBlocks(requestBlocks.map(b => b.id), { menuOpen:false });
                            patchRequestBlock(block.id, { menuOpen: !menuOpen });
                          }}
                          style={{ ...iconBtn, cursor:'grab' }}>⋮⋮</button>
                      </div>
                      {menuOpen && (
                        <div contentEditable={false} style={{ position:'absolute', left:-4, top:24, zIndex:20, minWidth:180, background:'#111827', border:'1px solid var(--border-1)', borderRadius:8, padding:6, boxShadow:'0 10px 30px rgba(0,0,0,0.45)', userSelect:'none' }}>
                          {blockTypes.map(t => (
                            <div key={t} onMouseDown={e => { e.preventDefault(); const ids = currentBlockIdsFromSelection(); patchRequestBlocks(ids.length ? ids : [block.id], { type:t, menuOpen:false }); }}
                              style={{ padding:'8px 10px', borderRadius:6, cursor:'pointer', color:'var(--text-2)', fontSize:12, background:block.type === t ? 'rgba(59,130,246,0.18)' : 'transparent', border:block.type === t ? '1px solid #3b82f6' : '1px solid transparent' }}>{t}</div>
                          ))}
                        </div>
                      )}
                      <div style={{ display:'flex', alignItems:'flex-start', gap:block.type === 'text' ? 0 : 10 }}>
                        {block.type !== 'text' && (
                          <span contentEditable={false} style={{ width:22, userSelect:'none', color:'var(--text-4)', marginTop:2, display:'inline-flex', justifyContent:'center' }}>
                            {block.type === 'todo'
                              ? <input type='checkbox' checked={!!block.checked} onChange={e => patchRequestBlock(block.id, { checked:e.target.checked })} />
                              : block.type === 'bullet' ? '•'
                              : block.type === 'numbered' ? `${numberedCounter}.`
                              : ''}
                          </span>
                        )}
                        <span data-block-text style={{ flex:1, minHeight:20, whiteSpace:'pre-wrap' }}>{block.text}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
              <button onMouseDown={e => { e.preventDefault(); syncRequestBlocksFromDom(); addRequestBlock(requestBlocks[requestBlocks.length - 1]?.id); }} style={{ marginTop:12, fontSize:11, padding:'6px 10px', borderRadius:6, border:'1px solid var(--border-1)', background:'transparent', color:'var(--text-3)', cursor:'pointer' }}>+ Add block</button>
            </div>
          </div>
        </div>
      );
    }

    // ── Main render ─────────────────────────────────────────────────────
    if (!user) return <LoginPage onLogin={setUser} error={loginErr} setError={setLoginErr} />;
    return (
      <div style={{ height:'100vh', display:'flex', overflow:'hidden' }}>

        {/* ── Left Sidenav (Corin style) ──────────────────────────────── */}
        <div style={{ width:200, flexShrink:0, display:'flex', flexDirection:'column',
          background:'var(--sidebar-bg)', borderRight:'1px solid var(--border-1)' }}>
          {/* Logo */}
          <div style={{ padding:'14px 14px 18px', fontSize:14, fontWeight:700, color:'var(--text-1)', letterSpacing:0.5 }}>
            ◈ <span style={{ color:'var(--text-2)' }}>QA Browser</span>
            <div style={{ fontSize:9, color:'var(--text-5)', marginTop:2 }}>SatuInbox</div>
          </div>

          {/* Nav items — switch content bila di dalam workspace */}
          <div style={{ flex:1, display:'flex', flexDirection:'column', gap:2, padding:'4px 0', overflow:'hidden' }}>
            {mainNav === 'workspace' ? (
              <>
                {/* Workspace label — big, on top */}
                <div style={{ padding:'2px 16px 8px', fontSize:14, color:'var(--text-1)', fontWeight:700, letterSpacing:0.3 }}>Workspace</div>
                {/* Back button — smaller, under label */}
                <div onClick={() => { setMainNav('dashboard'); setWorkspaceNav(null); }}
                  onMouseEnter={e => e.currentTarget.style.color='var(--text-2)'}
                  onMouseLeave={e => e.currentTarget.style.color='var(--text-4)'}
                  style={{ display:'flex', alignItems:'center', gap:6, padding:'4px 16px 10px',
                    cursor:'pointer', fontSize:10, color:'var(--text-4)', transition:'color 0.1s' }}>
                  <span style={{ fontSize:11 }}>←</span><span>Back</span>
                </div>
                <div style={{ padding:'0 16px 10px' }}>
                  <input value={sideSearch} onChange={e=>setSideSearch(e.target.value)}
                    placeholder="filter files..."
                    style={{ width:'100%', background:'var(--elevated-bg)', border:'1px solid var(--border-1)',
                      borderRadius:6, padding:'7px 10px', fontSize:11, color:'var(--text-2)',
                      outline:'none', fontFamily:'inherit' }}/>
                </div>
                <div style={{ flex:1, overflowY:'auto' }}>
                  {WORKSPACE_SUB.map(item => {
                    const expanded = workspaceNav === item.id;
                    // map workspace item id → real section id from server
                    const sectionIdMap = { brd:'brd', assessment:'assessments', prd:'prd', testcase:'test', 'feature-list':'feature', 'google-docs':'gdocs' };
                    const secId = sectionIdMap[item.id];
                    const sec = secId ? allSections.find(s => s.id === secId) : null;
                    const count = sec?.tree ? sec.tree.reduce((s, n) => s + countFiles(n), 0) : 0;
                    return (
                      <div key={item.id}>
                        <div onClick={() => setWorkspaceNav(expanded ? null : item.id)}
                          style={{ display:'flex', alignItems:'center', gap:8, padding:'7px 14px', margin:'1px 8px', cursor:'pointer', borderRadius:6,
                            fontSize:12, fontWeight: expanded ? 600 : 500,
                            color: expanded ? '#fff' : 'var(--text-2)',
                            background: expanded ? 'rgba(255,255,255,0.08)' : 'transparent' }}>
                          <span style={{ fontSize:9, color:'var(--text-5)', width:8 }}>{expanded ? '▾' : '▸'}</span>
                          <span style={{ flex:1 }}>{item.label}</span>
                          {count > 0 && <span style={{ fontSize:9, color:'var(--text-5)', background:'rgba(255,255,255,0.06)', padding:'1px 6px', borderRadius:8 }}>{count}</span>}
                          {sec?.remote && <span style={{ fontSize:9, color:'var(--text-5)' }}>☁</span>}
                        </div>
                        {expanded && (
                          <div style={{ padding:'2px 0 6px' }}>
                            {sec && sec.tree?.length > 0 ? (
                              <div style={{ paddingLeft:8 }}>{renderTree(sec.tree, sec.id)}</div>
                            ) : sec && sec.remote && !sec.configured ? (
                              <div style={{ padding:'4px 22px', fontSize:10, color:'var(--text-5)', lineHeight:1.5 }}>
                                {sec.statusError || '⚠ Belum terhubung'}
                              </div>
                            ) : sec ? (
                              <div style={{ padding:'4px 22px', fontSize:10, color:'var(--text-5)' }}>Kosong</div>
                            ) : (
                              <div style={{ padding:'4px 22px', fontSize:10, color:'var(--text-5)' }}>Belum ada folder untuk {item.label}</div>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </>
            ) : (
              <>
                {NAV_ITEMS.map(n => (
                  <React.Fragment key={n.id}>
                    <div onClick={() => {
                      setMainNav(n.id);
                      if (n.id === 'workspace') setActiveSection(null);
                      if (n.id === 'dashboard') setWorkspaceNav(prev => (prev === 'dashboard-testcase-stats' ? prev : 'dashboard-openproject'));
                      if (n.id !== 'workspace' && n.id !== 'dashboard') setWorkspaceNav(null);
                    }}
                      style={navItemStyle(n.id)}>
                      <span style={{ fontSize:14 }}>{n.icon}</span>
                      <span>{n.label}</span>
                    </div>
                    {n.id === 'dashboard' && mainNav === 'dashboard' ? DASHBOARD_SUB.map(sub => (
                      <button key={sub.id} onClick={() => { setMainNav('dashboard'); setWorkspaceNav(sub.id); }} style={dashboardSubItemStyle(sub.id)}>
                        {sub.label}
                      </button>
                    )) : null}
                  </React.Fragment>
                ))}

                {/* Spacer push footer to bottom */}
                <div style={{ flex:1 }} />

                <div style={{ padding:'10px 14px 12px', borderTop:'1px solid var(--border-1)' }}>
                  <div style={{ fontSize:11, color:'var(--text-2)', fontWeight:600 }}>{user?.name || user?.username}</div>
                  <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginTop:4 }}>
                    <span style={{ fontSize:10, color: canAdminEdit ? '#93c5fd' : '#fbbf24' }}>{user?.role}</span>
                    <button onClick={() => { try { localStorage.removeItem('qa_user'); } catch {} setUser(null); setLoginErr(''); }}
                      style={{ fontSize:10, background:'transparent', border:'1px solid var(--border-1)', color:'var(--text-3)', borderRadius:4, padding:'2px 8px', cursor:'pointer' }}>↩ Logout</button>
                  </div>
                  {canAdminEdit && (
                    <div onClick={() => { setMainNav('settings'); setWorkspaceNav(null); }}
                      style={{ ...navItemStyle('settings'), margin:'10px 0 0', padding:'7px 10px' }}>
                      <span style={{ fontSize:14 }}>⚙</span>
                      <span style={{ fontSize:12 }}>Settings</span>
                    </div>
                  )}
                </div>
              </>
            )}
          </div>
        </div>

        {/* ── Main Content ────────────────────────────────────────────── */}
        <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>

          {(() => {
            // ── Dashboard: kosong placeholder ──────────────────────────
            if (mainNav === 'dashboard') {
              if (workspaceNav === 'dashboard-testcase-stats') return <TestcaseStatsDashboard stats={tcStats} />;
              return <OpenProjectDashboard />;
            }

            // ── File tree shell (shared: used by workspace when no sub selected) ──
            const renderFileTreeShell = (startCollapsed = false) => {
              // Force all sections collapsed if startCollapsed
              if (startCollapsed) {
                // collapseActive is a local var; we'll manage by clearing activeSection on init
                // handled via useEffect at caller
              }
              return (
                <div style={{ flex:1, display:'flex', overflow:'hidden' }}>
                  {/* Sidebar file tree */}
                  <div style={{ width: sidebarWidth, flexShrink:0, display:'flex', flexDirection:'column',
                    background:'var(--sidebar-bg)', borderRight:'1px solid var(--border-1)', overflow:'hidden' }}>
                    <div style={{ padding:'6px 8px', borderBottom:'1px solid var(--border-1)', flexShrink:0 }}>
                      <input value={sideSearch} onChange={e=>setSideSearch(e.target.value)}
                        placeholder="filter files..."
                        style={{ width:'100%', background:'var(--elevated-bg)', border:'1px solid var(--border-1)',
                          borderRadius:4, padding:'4px 8px', fontSize:11, color:'var(--text-2)',
                          outline:'none', fontFamily:'inherit' }}/>
                    </div>
                    <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
                      {error && (
                        <div style={{ padding:'8px 12px', margin:'6px 8px', fontSize:10, color:'#f87171',
                          background:'#2d0e0e', border:'1px solid #7f1d1d', borderRadius:4, lineHeight:1.5, flexShrink:0 }}>
                          ⚠ {error}
                        </div>
                      )}
                      {allSections.length === 0 && (
                        <div style={{ padding:20, fontSize:11, color:'var(--text-5)', textAlign:'center' }}>
                          {error ? error : 'Loading files...'}
                        </div>
                      )}
                      {allSections.length > 0 && (() => {
                        const SectionHeader = (sec, isActive) => {
                          const count = sec.tree ? sec.tree.reduce((s, n) => s + countFiles(n), 0) : 0;
                          return (
                            <div key={sec.id} onClick={() => setActiveSection(isActive ? null : sec.id)}
                              style={{ padding:'6px 10px', display:'flex', alignItems:'center', gap:6, flexShrink:0,
                                cursor:'pointer', borderBottom:'1px solid var(--border-2)',
                                background: isActive ? 'rgba(255,255,255,0.03)' : 'transparent' }}>
                              <span style={{ width:3, height:3, borderRadius:'50%', background: sec.color, flexShrink:0 }}/>
                              <span style={{ flex:1, fontSize:10, fontWeight:600, color: sec.color, textTransform:'uppercase', letterSpacing:0.5 }}>{sec.label}</span>
                              {!sec.remote && sec.folderName && (
                                <button onClick={e=>{ e.stopPropagation(); setActiveSection(sec.id); setCreating({ path: sec.folderName, sectionId: sec.id }); }}
                                  title="New folder / TSV"
                                  style={{ fontSize:13, lineHeight:1, background:'none', border:'none', color:'var(--text-4)', cursor:'pointer', padding:'0 2px' }}>+</button>
                              )}
                              {sec.remote && <span title="Google Docs" style={{ fontSize:9, color:'var(--text-5)' }}>☁</span>}
                              {count > 0 && <span style={{ fontSize:9, color:'var(--text-5)' }}>{count}</span>}
                              <span style={{ fontSize:9, color:'var(--text-5)', marginLeft:2 }}>{isActive ? '▾' : '▸'}</span>
                            </div>
                          );
                        };
                        const SectionBody = (sec) => {
                          if (sec.remote && !sec.configured) {
                            return <div style={{ padding:'8px 14px', fontSize:10, color:'var(--text-5)', lineHeight:1.5 }}>
                              {sec.statusError || '⚠ Belum terhubung — buka ⚙ Settings.'}
                            </div>;
                          }
                          return (
                            <React.Fragment>
                              {creating && creating.path === sec.folderName && (
                                <NewItemForm pad={20} busy={creatingBusy} onCreate={createItem} onCancel={()=>setCreating(null)} />
                              )}
                              {sec.tree?.length > 0
                                ? <div style={{ paddingBottom:4 }}>{renderTree(sec.tree, sec.id)}</div>
                                : <div style={{ padding:'8px 14px', fontSize:10, color:'var(--text-5)' }}>{sec.remote ? 'Belum ada dokumen di folder mirror' : 'No files'}</div>}
                            </React.Fragment>
                          );
                        };
                        const active = allSections.find(s => s.id === activeSection);
                        if (!active) {
                          return <div style={{ flex:1, overflowY:'auto' }}>{allSections.map(sec => SectionHeader(sec, false))}</div>;
                        }
                        const others = allSections.filter(s => s.id !== active.id);
                        return (
                          <React.Fragment>
                            {SectionHeader(active, true)}
                            <div style={{ flex:1, overflowY:'auto' }}>{SectionBody(active)}</div>
                            {others.length > 0 && (
                              <div style={{ flexShrink:0, borderTop:'1px solid var(--border-1)' }}>
                                {others.map(sec => SectionHeader(sec, false))}
                              </div>
                            )}
                          </React.Fragment>
                        );
                      })()}
                    </div>
                  </div>

                  {/* Resize handle */}
                  <div onMouseDown={onResizeStart}
                    style={{ width:4, cursor:'col-resize', flexShrink:0, background:'transparent',
                      borderRight:'1px solid var(--border-1)' }}
                    onMouseEnter={e=>e.target.style.background='var(--border-1)'}
                    onMouseLeave={e=>e.target.style.background='transparent'} />

                  {/* Content area */}
                  <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', background:'var(--app-bg)' }}>
                    {selected && (
                      <div style={{ padding:'5px 14px', borderBottom:'1px solid var(--border-1)',
                        background:'var(--sidebar-bg)', flexShrink:0,
                        fontSize:10, color:'var(--text-4)', display:'flex', alignItems:'center', gap:6 }}>
                        <span style={{ color:'var(--text-5)' }}>{selected.sectionId}</span>
                        <span style={{ color:'var(--text-6)' }}>/</span>
                        <span style={{ color:'var(--text-3)' }}>{selected.name}</span>
                      </div>
                    )}
                    {renderContent()}
                  </div>
                </div>
              );
            };

            // ── Workspace: main content area (file viewer) ──────────────
            if (mainNav === 'workspace') {
              return (
                <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', background:'var(--app-bg)' }}>
                  {selected && (
                    <div style={{ padding:'4px 14px', borderBottom:'1px solid var(--border-1)', background:'var(--sidebar-bg)', flexShrink:0, display:'flex', alignItems:'center', gap:4, fontFamily:'monospace' }}>
                      <span style={{ fontSize:10, color:'var(--text-5)' }}>PRDanalisis</span>
                      <span style={{ fontSize:8, color:'var(--text-6)' }}>/</span>
                      <span style={{ fontSize:10, color:'#fbbf24', fontWeight:500 }}>{selected.sectionId}</span>
                      <span style={{ fontSize:8, color:'var(--text-6)' }}>/</span>
                      <span style={{ fontSize:10, color:'var(--text-2)', fontWeight:400 }}>{selected.name}</span>
                    </div>
                  )}
                  {renderContent()}
                </div>
              );
            }

            // ── Memory ─────────────────────────────────────────────────
            if (mainNav === 'new-request') return renderNewRequestView();
            if (mainNav === 'memory') return renderMemoryView();

            // ── Settings ───────────────────────────────────────────────
            return (
              <SettingsPage
                status={gdocsStatus}
                onRefreshStatus={loadGDocs}
                onSwitchTheme={switchTheme}
                currentTheme={themeId}
                onImport={handleImport}
                importing={importing}
                importMsg={importMsg}
                user={user}
              />
            );
          })()}

        </div>

        {/* Run Panel overlay (global) */}
        {runCase && (
          <RunPanel
            caseId={runCase.caseId}
            specFile={runCase.specFile}
            grepPattern={runCase.grepPattern}
            onClose={() => setRunCase(null)}
          />
        )}
      </div>
    );
  }

  // ─── BOOTSTRAP ────────────────────────────────────────────────────────────────
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);

  </script>
</body>
</html>
