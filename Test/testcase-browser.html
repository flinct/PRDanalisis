    <script>
      // Block Live Server auto-reload when saving TSV/JSON files.
      // livereload.js uses `socket.onmessage = fn` (property assignment, not addEventListener),
      // so we intercept the onmessage setter on every WebSocket connected to the live-reload port.
      (function () {
        const NativeWS = window.WebSocket;

        function PatchedWS(url, protocols) {
          const ws =
            protocols != null
              ? new NativeWS(url, protocols)
              : new NativeWS(url);
          const isLR =
            typeof url === "string" &&
            (url.includes("livereload") || url.includes("5500"));
          if (isLR) {
            let _handler = null;
            let _listenerAdded = false;
            Object.defineProperty(ws, "onmessage", {
              get() {
                return _handler;
              },
              set(fn) {
                _handler = fn;
                if (!_listenerAdded) {
                  _listenerAdded = true;
                  NativeWS.prototype.addEventListener.call(
                    ws,
                    "message",
                    function (evt) {
                      try {
                        const d = JSON.parse(evt.data);
                        if (d && d.command === "reload") return;
                      } catch (e) {}
                      if (_handler) _handler.call(ws, evt);
                    },
                  );
                }
              },
              configurable: true,
            });
          }
          return ws;
        }

        PatchedWS.prototype = NativeWS.prototype;
        PatchedWS.CONNECTING = 0;
        PatchedWS.OPEN = 1;
        PatchedWS.CLOSING = 2;
        PatchedWS.CLOSED = 3;
        window.WebSocket = PatchedWS;

        // Backup: override location.reload for any scripted reload attempt
        try {
          Object.defineProperty(Location.prototype, "reload", {
            value: function () {
              console.info("[QA Browser] scripted reload blocked");
            },
            configurable: true,
            writable: true,
          });
        } catch (e) {}
      })();
    </script>

      function loadScriptOnce(src, key) {
        return new Promise((resolve, reject) => {
          if (window[key]) return resolve(window[key]);
          const existing = document.querySelector(
            `script[data-hermes-key="${key}"]`,
          );
          if (existing) {
            existing.addEventListener("load", () => resolve(window[key]), {
              once: true,
            });
            existing.addEventListener(
              "error",
              () => reject(new Error(`failed to load ${key}`)),
              { once: true },
            );
            return;
          }
          const s = document.createElement("script");
          s.src = src;
          s.async = true;

          s.onload = () => resolve(window[key]);
          s.onerror = () => reject(new Error(`failed to load ${key}`));
          document.head.appendChild(s);
        });
      }

      function loadCssOnce(href, key) {
        return new Promise((resolve, reject) => {
          if (document.querySelector(`link[data-hermes-key="${key}"]`))
            return resolve();
          const link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = href;
          link.dataset.hermesKey = key;
          link.onload = () => resolve();
          link.onerror = () => reject(new Error(`failed to load ${key}`));
          document.head.appendChild(link);
        });
      }

        { color: "#f59e0b", dimBg: "#1a0f00", dimBd: "#92400e" },
        { color: "#ec4899", dimBg: "#1a001a", dimBd: "#831843" },
        { color: "#06b6d4", dimBg: "#001a1e", dimBd: "#0e7490" },
        { color: "#84cc16", dimBg: "#0d1a00", dimBd: "#365314" },
        { color: "#f97316", dimBg: "#1a0800", dimBd: "#9a3412" },
        { color: "#a78bfa", dimBg: "#0d0720", dimBd: "#4c1d95" },
      ];
      const EXCLUDED_FOLDERS = new Set(["port", "node_modules"]);

      // ─── CONSTANTS ───────────────────────────────────────────────────────────────
      const STATUS_OPTIONS = [
        "Passed",
        "Failed",
        "On Test",
        "Need to Test",
        "",
      ];
      const ENV = ["DEV", "Staging", "Prod"];
      const SCHEMA_VERSION = 1;

      const STATUS_STYLE = {
        passed: { bg: "#052e16", fg: "#4ade80", bd: "#166534" },
        failed: { bg: "#2d0e0e", fg: "#f87171", bd: "#7f1d1d" },
        "on test": { bg: "#0c1a3a", fg: "#60a5fa", bd: "#1e3a5f" },
        "need to test": { bg: "#2a1a04", fg: "#fbbf24", bd: "#713f12" },
      };
      function sStyle(val = "") {
        const s = STATUS_STYLE[(val || "").toLowerCase().trim()] || {
          bg: "var(--elevated-bg)",
          fg: "var(--text-5)",
          bd: "var(--border-1)",
        };
        return {
          background: s.bg,
          color: s.fg,
          border: `1px solid ${s.bd}`,
          padding: "2px 9px",
          borderRadius: 20,
          fontSize: 10,
          fontWeight: 700,
          whiteSpace: "nowrap",
          display: "inline-block",
        };
      }

      // ─── UTILS ───────────────────────────────────────────────────────────────────
      function nowISO() {
        return new Date().toISOString();
      }
      function fmtDate(iso) {
        if (!iso) return "";
        try {
          return new Date(iso).toLocaleString("id-ID", {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });
        } catch {
          return iso;
        }
      }
      function uid() {
        return (
          "evt_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7)
        );
      }

      // ─── MODELS ──────────────────────────────────────────────────────────────────
      const EMPTY_EXEC_ROW = (rowKey = "1") => ({
        rowKey,
        actual: "",
        status: { DEV: "", Staging: "", Prod: "" },
      });

      const EMPTY_EXEC = (count = 1) => ({
        notes: "",
        overallStatus: { DEV: "", Staging: "", Prod: "" },
        results: Array.from({ length: count }, (_, i) =>
          EMPTY_EXEC_ROW(String(i + 1)),
        ),
        updatedAt: null,
      });

      const EMPTY_TC = () => ({
        id: "",
        scenario: "",
        precondition: "",
        description: "",
        url: "",
        testType: "POSITIVE",
        tester: "",
        createdBy: "",
        createDate: "",
        steps: [""],
        expectedResults: [{ key: "1", expected: "" }],
        exec: EMPTY_EXEC(1),
        history: [],
      });

      // ─── PARSERS ─────────────────────────────────────────────────────────────────
      function parseLine(line, sep = "\t") {
        const out = [];
        let cur = "",
          inQ = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') {
            if (inQ && line[i + 1] === '"') {
              cur += '"';
              i++;
            } else inQ = !inQ;
          } else if (ch === sep && !inQ) {
            out.push(cur);
            cur = "";
          } else cur += ch;
        }
        out.push(cur);
        return out;
      }

      function isCardFmt(lines) {
        return lines.slice(0, 30).some((l) => l[0] === "Test ID");
      }

      function parseBlock(rows) {
        const tc = {
          id: "",
          scenario: "",
          precondition: "",
          description: "",
          url: "",
          testType: "POSITIVE",
          tester: "",
          createdBy: "",
          createDate: "",
          steps: [],
          expectedResults: [],
          exec: null,
          history: [],
          _legacyExec: {
            notes: "",
            overallStatus: { DEV: "", Staging: "", Prod: "" },
            results: [],
          },
        };
        let inResults = false;

        for (const c of rows) {
          while (c.length < 11) c.push("");
          if (!c.some((x) => x.trim())) continue;
          switch (c[0]) {
            case "Test ID":
              tc.id = c[1] || "";
              if (c[5] === "Note:") tc._legacyExec.notes = c[6] || "";
              tc._legacyExec.overallStatus.DEV = c[8] || "";
              tc._legacyExec.overallStatus.Staging = c[9] || "";
              tc._legacyExec.overallStatus.Prod = c[10] || "";
              break;
            case "Create at":
              tc.createDate = c[3] || "";
              tc.createdBy = c[6] || "";
              tc.tester = c[8] || "";
              break;
            case "Scenario":
              tc.scenario = c[3] || "";
              tc.precondition = c[6] || "";
              break;
            case "Url":
              tc.url = c[3] || "";
              tc.description = c[6] || "";
              break;
            case "Steps":
              tc.testType = c[6] || "";
              if (c[3]) tc.steps.push(c[3]);
              break;
            default:
              if (!c[0]) {
                if (c[5] === "Status Response") {
                  inResults = true;
                } else if (!inResults && c[2] && c[3]) {
                  tc.steps.push(c[3]);
                } else if (inResults && c[6]) {
                  const rowKey = String(tc.expectedResults.length + 1);
                  tc.expectedResults.push({
                    key: rowKey,
                    expected: c[6] || "",
                  });
                  tc._legacyExec.results.push({
                    rowKey,
                    actual: c[7] || "",
                    status: {
                      DEV: c[8] || "",
                      Staging: c[9] || "",
                      Prod: c[10] || "",
                    },
                  });
                }
              }
          }
        }

        if (tc.steps.length === 0) tc.steps = [""];
        if (tc.expectedResults.length === 0)
          tc.expectedResults = [{ key: "1", expected: "" }];
        return tc;
      }

      function parseCardFormat(lines) {
        const cases = [];
        let i = 0;
        while (i < lines.length) {
          if (lines[i][0] === "Test ID") {
            let j = i + 1;
            while (j < lines.length && lines[j][0] !== "Test ID") j++;
            cases.push(parseBlock(lines.slice(i, j)));
            i = j;
          } else i++;
        }
        return cases;
      }

      function parseFlatFormat(lines) {
        const ne = lines.filter((l) => l.some((c) => c.trim()));
        return ne.length
          ? { headers: ne[0], rows: ne.slice(1) }
          : { headers: [], rows: [] };
      }

      function parseFile(text, ext) {
        const sep = ext === "csv" ? "," : "\t";
        const lines = text
          .replace(/\r\n/g, "\n")
          .replace(/\r/g, "\n")
          .split("\n")
          .map((l) => parseLine(l, sep));
        const ne = lines.filter((l) => l.some((c) => c.trim()));
        if (!ne.length) return { type: "empty" };
        if (isCardFmt(ne)) return { type: "card", cases: parseCardFormat(ne) };
        return { type: "flat", ...parseFlatFormat(ne) };
      }

      // ─── VERSION HELPERS ─────────────────────────────────────────────────────────
      function getActiveVersion(execData) {
        if (!execData) return "v1";
        if (execData.activeVersion) return execData.activeVersion;
        if (execData.cases && !execData.versions) return "v1";
        const keys = Object.keys(execData.versions || {});
        return keys.length > 0 ? keys[keys.length - 1] : "v1";
      }

      function getVersionCases(execData, versionId) {
        if (!execData) return null;
        if (execData.versions?.[versionId]?.cases)
          return execData.versions[versionId].cases;
        if (!execData.versions && execData.cases && versionId === "v1")
          return execData.cases;
        return null;
      }

      // ─── MERGE ───────────────────────────────────────────────────────────────────
      function mergeExecIntoCases(cases, execData, versionId) {
        const hasJsonFile = execData !== null;
        const versionCases = getVersionCases(execData, versionId);

        return cases.map((tc) => {
          const execCase = versionCases?.[tc.id];

          if (execCase?.current) {
            const cur = execCase.current;
            const execResults = tc.expectedResults.map((er) => {
              const found = (cur.results || []).find(
                (r) => r.rowKey === er.key,
              );
              return found
                ? {
                    rowKey: er.key,
                    actual: found.actual || "",
                    status: { DEV: "", Staging: "", Prod: "", ...found.status },
                  }
                : EMPTY_EXEC_ROW(er.key);
            });
            return {
              ...tc,
              exec: {
                notes: cur.notes || "",
                overallStatus: {
                  DEV: "",
                  Staging: "",
                  Prod: "",
                  ...cur.overallStatus,
                },
                results: execResults,
                updatedAt: cur.updatedAt || null,
              },
              history: execCase.history || [],
            };
          }

          if (!hasJsonFile) {
            const leg = tc._legacyExec;
            const execResults = tc.expectedResults.map((er, i) => {
              const found = leg?.results?.[i];
              return found
                ? {
                    rowKey: er.key,
                    actual: found.actual || "",
                    status: { DEV: "", Staging: "", Prod: "", ...found.status },
                  }
                : EMPTY_EXEC_ROW(er.key);
            });
            return {
              ...tc,
              exec: {
                notes: leg?.notes || "",
                overallStatus: {
                  DEV: "",
                  Staging: "",
                  Prod: "",
                  ...(leg?.overallStatus || {}),
                },
                results: execResults,
                updatedAt: null,
              },
              history: [],
            };
          }

          return {
            ...tc,
            exec: EMPTY_EXEC(tc.expectedResults.length),
            history: [],
          };
        });
      }

      // ─── EXEC JSON BUILDER ───────────────────────────────────────────────────────
      function tcToSnapshot(tc) {
        return {
          testType: tc.testType || "",
          tester: tc.tester || "",
          createDate: tc.createDate || "",
          scenario: tc.scenario || "",
          precondition: tc.precondition || "",
          description: tc.description || "",
          url: tc.url || "",
          steps: [...(tc.steps || [])],
          expectedResults: (tc.expectedResults || []).map((er) => ({ ...er })),
          notes: tc.exec?.notes || "",
          overallStatus: {
            DEV: "",
            Staging: "",
            Prod: "",
            ...(tc.exec?.overallStatus || {}),
          },
          results: (tc.exec?.results || []).map((r) => ({
            rowKey: r.rowKey,
            actual: r.actual || "",
            status: {
              DEV: r.status?.DEV || "",
              Staging: r.status?.Staging || "",
              Prod: r.status?.Prod || "",
            },
          })),
          updatedAt: tc.exec?.updatedAt || null,
        };
      }

      function hasAnyChange(oldSnap, newSnap) {
        if (!oldSnap) return true;
        const defFields = [
          "testType",
          "tester",
          "createDate",
          "scenario",
          "precondition",
          "description",
          "url",
        ];
        for (const f of defFields) {
          if ((oldSnap[f] || "") !== (newSnap[f] || "")) return true;
        }
        const os = oldSnap.steps || [],
          ns = newSnap.steps || [];
        if (os.length !== ns.length || os.some((s, i) => s !== ns[i]))
          return true;
        const oe = oldSnap.expectedResults || [],
          ne = newSnap.expectedResults || [];
        if (
          oe.length !== ne.length ||
          oe.some((e, i) => (e.expected || "") !== (ne[i]?.expected || ""))
        )
          return true;
        if ((oldSnap.notes || "") !== (newSnap.notes || "")) return true;
        for (const e of ENV) {
          if (
            (oldSnap.overallStatus?.[e] || "") !==
            (newSnap.overallStatus?.[e] || "")
          )
            return true;
        }
        const or = oldSnap.results || [],
          nr = newSnap.results || [];
        if (or.length !== nr.length) return true;
        for (let i = 0; i < or.length; i++) {
          if ((or[i].actual || "") !== (nr[i].actual || "")) return true;
          for (const e of ENV) {
            if ((or[i].status?.[e] || "") !== (nr[i].status?.[e] || ""))
              return true;
          }
        }
        return false;
      }

      function buildExecJSON(
        cases,
        prevExecData,
        sourceFile,
        sourceFileName,
        versionId,
      ) {
        const now = nowISO();
        const prevVersionCases = getVersionCases(prevExecData, versionId) || {};
        const newCasesMap = {};

        for (const tc of cases) {
          if (!tc.id) continue;
          const prevCase = prevVersionCases[tc.id];
          const oldFull = prevCase?.current || null;
          const newFull = tcToSnapshot(tc);
          const prevHistory = prevCase?.history || [];
          let newHistory = [...prevHistory];

          if (hasAnyChange(oldFull, newFull)) {
            if (oldFull) {
              newHistory.push({
                eventId: uid(),
                action: tc._isReset ? "reset" : "update",
                at: now,
                ...(tc._resetReason ? { reason: tc._resetReason } : {}),
                snapshot: oldFull,
              });
            }
            newFull.updatedAt = now;
          }

          newCasesMap[tc.id] = {
            testcaseId: tc.id,
            current: newFull,
            history: newHistory,
          };
        }

        let existingVersions = { ...(prevExecData?.versions || {}) };
        if (!prevExecData?.versions && prevExecData?.cases) {
          existingVersions = {
            v1: {
              createdAt: prevExecData.createdAt || now,
              cases: prevExecData.cases,
            },
          };
        }

        existingVersions[versionId] = {
          createdAt: existingVersions[versionId]?.createdAt || now,
          updatedAt: now,
          cases: newCasesMap,
        };

        return {
          schemaVersion: SCHEMA_VERSION,
          sourceFile: sourceFile || "",
          sourceFileName: sourceFileName || "",
          createdAt: prevExecData?.createdAt || now,
          updatedAt: now,
          activeVersion: versionId,
          versions: existingVersions,
        };
      }

      function applyExecDataToCases(cases, execData, versionId) {
        const versionCases = getVersionCases(execData, versionId) || {};
        return cases.map((tc) => {
          const { _isReset, _resetReason, _legacyExec, ...rest } = tc;
          const ec = versionCases[tc.id];
          if (!ec?.current) return { ...rest };
          const cur = ec.current;
          const execResults = rest.expectedResults.map((er) => {
            const found = (cur.results || []).find((r) => r.rowKey === er.key);
            return found
              ? {
                  rowKey: er.key,
                  actual: found.actual || "",
                  status: { DEV: "", Staging: "", Prod: "", ...found.status },
                }
              : EMPTY_EXEC_ROW(er.key);
          });
          return {
            ...rest,
            exec: {
              notes: cur.notes || "",
              overallStatus: {
                DEV: "",
                Staging: "",
                Prod: "",
                ...cur.overallStatus,
              },
              results: execResults,
              updatedAt: cur.updatedAt || null,
            },
            history: ec.history || [],
          };
        });
      }

      // ─── SERIALIZER ───────────────────────────────────────────────────────────────
      function q(v) {
        const s = (v || "").replace(/"/g, '""');
        return s.includes("\t") || s.includes("\n") || s.includes('"')
          ? `"${s}"`
          : s;
      }
      function row(...cols) {
        return cols.map(q).join("\t");
      }

      function serializeCardToTSV(cases) {
        const lines = [];
        const total = cases.length;
        const devCnt = (s) =>
          cases.filter(
            (c) =>
              (c.exec?.overallStatus?.DEV || "").toLowerCase() ===
              s.toLowerCase(),
          ).length;
        lines.push(
          row(
            "total cases =",
            "",
            "",
            String(total),
            "",
            "",
            "",
            "",
            "",
            "",
            "",
          ),
        );
        lines.push(
          row("DEV", "", "", "", "STAGGING", "", "", "PROD", "", "", ""),
        );
        lines.push(
          row(
            "Passed",
            "",
            "",
            String(devCnt("Passed")),
            "Passed",
            "",
            "0",
            "Passed",
            "0",
            "",
            "",
          ),
        );
        lines.push(
          row(
            "Failed",
            "",
            "",
            String(devCnt("Failed")),
            "Failed",
            "",
            "0",
            "Failed",
            "0",
            "",
            "",
          ),
        );
        lines.push(
          row(
            "Need to test",
            "",
            "",
            String(devCnt("Need to Test")),
            "Need to test",
            "",
            "0",
            "Need to test",
            "0",
            "",
            "",
          ),
        );
        lines.push(
          row(
            "On test",
            "",
            "",
            String(devCnt("On Test")),
            "On test",
            "",
            "0",
            "On test",
            "0",
            "",
            "",
          ),
        );
        lines.push(
          row(
            "No Status",
            "",
            "",
            "0",
            "No Status",
            "",
            "0",
            "No Status",
            "0",
            "",
            "",
          ),
        );

        for (const tc of cases) {
          lines.push("");
          const steps = tc.steps.filter((s) => s.trim());
          const oSt = tc.exec?.overallStatus || {
            DEV: "",
            Staging: "",
            Prod: "",
          };
          const note = tc.exec?.notes || "";
          lines.push(
            row(
              "Test ID",
              tc.id,
              "",
              "",
              "",
              note ? "Note:" : "",
              note,
              "",
              oSt.DEV,
              oSt.Staging,
              oSt.Prod,
            ),
          );
          lines.push(
            row(
              "Create at",
              "",
              "",
              tc.createDate || "",
              "",
              "created by",
              tc.createdBy || "",
              "Tester",
              tc.tester || "",
              "",
              "",
            ),
          );
          lines.push(
            row(
              "Scenario",
              "",
              "",
              tc.scenario || "",
              "",
              "Pre-Condition",
              tc.precondition || "",
              "DATE",
              tc.createDate || "",
              "",
              "",
            ),
          );
          lines.push(
            row(
              "Url",
              "",
              "",
              tc.url || "",
              "",
              "Description",
              tc.description || "",
              "ENV",
              "DEV",
              "Staging",
              "Prod",
            ),
          );

          if (steps.length > 0) {
            lines.push(
              row(
                "Steps",
                "",
                "1",
                steps[0],
                "",
                "test type",
                tc.testType || "",
                "",
                "",
                "",
                "",
              ),
            );
            for (let i = 1; i < steps.length; i++)
              lines.push(
                row(
                  "",
                  "",
                  String(i + 1),
                  steps[i],
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                  "",
                ),
              );
          }

          const baseN = steps.length + 1;
          lines.push(
            row(
              "",
              "",
              String(baseN),
              "",
              "",
              "Status Response",
              "Expected Result",
              "Actual Result",
              "Status",
              "",
              "Status",
            ),
          );
          tc.expectedResults.forEach((er, i) => {
            const execR = tc.exec?.results?.[i];
            lines.push(
              row(
                "",
                "",
                String(baseN + 1 + i),
                "",
                "",
                "",
                er.expected,
                execR?.actual || "",
                execR?.status?.DEV || "",
                execR?.status?.Staging || "",
                execR?.status?.Prod || "",
              ),
            );
          });
          lines.push("");
          lines.push("");
          lines.push("");
        }
        return lines.join("\n");
      }

      // ─── EXEC FILE I/O ────────────────────────────────────────────────────────────
      function resolveExecPathParts(tsvRelPath) {
        const parts = tsvRelPath.split("/");
        const filename = parts[parts.length - 1].replace(
          /\.tsv$/i,
          ".execution.json",
        );
        const dirParts =
          parts[0] === "versions"
            ? [".tcdata", ...parts.slice(1, -1)]
            : [".tcdata", ...parts.slice(0, -1).filter(Boolean)];
        return [...dirParts, filename];
      }

      async function getNestedHandle(rootHandle, pathParts, create = false) {
        let cur = rootHandle;
        for (const part of pathParts.slice(0, -1)) {
          cur = await cur.getDirectoryHandle(part, { create });
        }
        return { dirHandle: cur, fileName: pathParts[pathParts.length - 1] };
      }

      async function loadExecFile(rootHandle, tsvRelPath) {
        try {
          const pp = resolveExecPathParts(tsvRelPath);
          const { dirHandle, fileName } = await getNestedHandle(
            rootHandle,
            pp,
            false,
          );
          const fh = await dirHandle.getFileHandle(fileName);
          return JSON.parse(await (await fh.getFile()).text());
        } catch {
          return null;
        }
      }

      async function saveExecFile(rootHandle, tsvRelPath, execData) {
        const pp = resolveExecPathParts(tsvRelPath);
        const { dirHandle, fileName } = await getNestedHandle(
          rootHandle,
          pp,
          true,
        );
        const fh = await dirHandle.getFileHandle(fileName, { create: true });
        await writeFile(fh, JSON.stringify(execData, null, 2));
      }

      // ─── FILE SYSTEM + IDB ───────────────────────────────────────────────────────
      const SUPPORTED_EXT = /\.(tsv|csv|md|txt)$/i;

      async function scanDir(handle, base = "") {
        const entries = [];
        for await (const [name, entry] of handle.entries()) {
          if (name.startsWith(".")) continue;
          const path = base ? `${base}/${name}` : name;
          if (entry.kind === "directory") {
            entries.push({
              kind: "dir",
              name,
              path,
              handle: entry,
              children: await scanDir(entry, path),
            });
          } else if (SUPPORTED_EXT.test(name)) {
            entries.push({
              kind: "file",
              name,
              path,
              handle: entry,
              ext: name.split(".").pop().toLowerCase(),
            });
          }
        }
        return entries.sort((a, b) => {
          if (a.kind !== b.kind) return a.kind === "dir" ? -1 : 1;
          return a.name.localeCompare(b.name);
        });
      }

      function openIDB() {
        return new Promise((res, rej) => {
          const r = indexedDB.open("tcbrowser", 2);
          r.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains("handles"))
              db.createObjectStore("handles");
          };
          r.onsuccess = (e) => res(e.target.result);
          r.onerror = (e) => rej(e.target.error);
        });
      }
      async function saveHandleIDB(h) {
        try {
          const db = await openIDB();
          db.transaction("handles", "readwrite")
            .objectStore("handles")
            .put(h, "root");
        } catch (e) {}
      }
      async function loadHandleIDB() {
        try {
          const db = await openIDB();
          return new Promise((res) => {
            const r = db
              .transaction("handles", "readonly")
              .objectStore("handles")
              .get("root");

      // ─── HISTORY PANEL ────────────────────────────────────────────────────────────
      function diffAll(before, after) {
        const changes = [];
        if (!before || !after) return changes;
        const defMap = [
          ["Test Type", "testType"],
          ["Tester", "tester"],
          ["Date", "createDate"],
          ["Scenario", "scenario"],
          ["Pre-Condition", "precondition"],
          ["Description", "description"],
          ["URL", "url"],
        ];
        for (const [label, key] of defMap) {
          const bv = before[key] || "",
            av = after[key] || "";
          if (bv !== av)
            changes.push({ field: label, from: bv, to: av, type: "text" });
        }
        const bs = before.steps || [],
          as_s = after.steps || [];
        const maxS = Math.max(bs.length, as_s.length);
        for (let i = 0; i < maxS; i++) {
          const bv = bs[i] || "",
            av = as_s[i] || "";
          if (bv !== av)
            changes.push({
              field: `Step ${i + 1}`,
              from: bv,
              to: av,
              type: "text",
            });
        }
        const be = before.expectedResults || [],
          ae = after.expectedResults || [];
        const maxE = Math.max(be.length, ae.length);
        for (let i = 0; i < maxE; i++) {
          const bv = be[i]?.expected || "",
            av = ae[i]?.expected || "";
          const rk = be[i]?.key || ae[i]?.key || String(i + 1);
          if (bv !== av)
            changes.push({
              field: `Expected ${rk}`,
              from: bv,
              to: av,
              type: "text",
            });
        }
        for (const e of ENV) {
          const bv = before.overallStatus?.[e] || "",
            av = after.overallStatus?.[e] || "";
          if (bv !== av)
            changes.push({
              field: `Overall ${e}`,
              from: bv,
              to: av,
              type: "status",
            });
        }
        const bn = before.notes || "",
          an = after.notes || "";
        if (bn !== an)
          changes.push({ field: "Notes", from: bn, to: an, type: "text" });
        const br = before.results || [],
          ar = after.results || [];
        const maxR = Math.max(br.length, ar.length);
        for (let i = 0; i < maxR; i++) {
          const bRow = br[i] || {},
            aRow = ar[i] || {};
          const rk = bRow.rowKey || aRow.rowKey || String(i + 1);
          if ((bRow.actual || "") !== (aRow.actual || ""))
            changes.push({
              field: `Row ${rk} Actual`,
              from: bRow.actual || "",
              to: aRow.actual || "",
              type: "text",
            });
          for (const e of ENV) {
            const bst = bRow.status?.[e] || "",
              ast = aRow.status?.[e] || "";
            if (bst !== ast)
              changes.push({
                field: `Row ${rk} ${e}`,
                from: bst,
                to: ast,
                type: "status",
              });
          }
        }
        return changes;
      }

            node.kind === "dir" &&
            activePath &&
            activePath.startsWith(node.path + "\\")
          ) {
            setOpen(true);
          }
        }, [activePath]);

        // Scroll folder header into view when opened (skip mount)
        const _mounted = useRef(false);
        useEffect(() => {
          if (open && headerRef.current && _mounted.current) {
            headerRef.current.scrollIntoView({
              behavior: "smooth",
              block: "nearest",
            });

        );

      // ─── CARD EDITOR ─────────────────────────────────────────────────────────────

      function CardEditor({
        cases: initCases,
        execData: initExecData,
        initialVersion,
        fileHandle,
        rootHandle,
        filePath,
        autoMap = {},
        onSaveMap,
        onRunCase,
        onReloadMap,
      }) {
        const _initVer =
          initialVersion || getActiveVersion(initExecData) || "v1";
        // Merge exec data into cases up front so every tc.exec is non-null (fixes
        // "Cannot read properties of null (reading 'overallStatus')" on status change,
        // and ensures saved statuses show immediately on open).
        const [cases, setCases] = useState(() =>
          mergeExecIntoCases(initCases, initExecData, _initVer),
        );
        const [execData, setExecData] = useState(initExecData);
        const [activeVersion, setActiveVersion] = useState(_initVer);
        const [addingVer, setAddingVer] = useState(false);
        const [newVerName, setNewVerName] = useState("");
        const [expanded, setExpanded] = useState(null);
        const [search, setSearch] = useState("");
        const [fStatus, setFStatus] = useState("All");
        const [env, setEnv] = useState("DEV");
        const [dirty, setDirty] = useState(false);
        const [saving, setSaving] = useState(false);
        const [saveMsg, setSaveMsg] = useState("");
        const [resetIdx, setResetIdx] = useState(null);
        const [page, setPage] = useState(1);

        const stashRef = useRef({});
        const loadMoreRef = useRef(null);
        const mountedRef = useRef(false); // guard: prevent on-mount useEffect re-renders

        // NOTE: useEffect([initCases]) reset removed — CardEditor is keyed by filePath,
        // so it always mounts fresh. Resetting state on mount via useEffect is redundant
        // and causes an extra render cascade (confirmed in perf trace).

        function allVersionNames() {
          const saved = execData?.versions
            ? Object.keys(execData.versions)
            : execData?.cases
              ? ["v1"]
              : [];
          const unsaved = [...Object.keys(stashRef.current), activeVersion];
          const result = [...saved];
          for (const v of unsaved) {
            if (!result.includes(v)) result.push(v);
          }
          return result;
        }
        function suggestNextVer() {
          const vers = allVersionNames();
          const last = vers[vers.length - 1] || "v1";
          const m = last.match(/^(.*?)(\d+)$/);
          return m ? m[1] + (parseInt(m[2]) + 1) : last + "-2";
        }
        function switchVersion(ver) {
          if (ver === activeVersion) return;
          stashRef.current[activeVersion] = cases;
          const stashed = stashRef.current[ver];
          if (stashed) {
            setCases(stashed);
          } else {
            setCases(mergeExecIntoCases(cases, execData, ver));
          }
          setActiveVersion(ver);
        }
        function openAddVer() {
          setNewVerName(suggestNextVer());
          setAddingVer(true);
        }
        function confirmAddVer() {
          const name = newVerName.trim();
          if (!name) return;
          if (allVersionNames().includes(name)) {
            alert("Version sudah ada.");
            return;
          }
          stashRef.current[activeVersion] = cases;
          const resetCases = cases.map((tc) => ({
            ...tc,
            exec: EMPTY_EXEC(tc.expectedResults.length),
            history: [],
          }));
          setCases(resetCases);
          setActiveVersion(name);
          setAddingVer(false);
          setNewVerName("");
          setDirty(true);
        }

        function upd(i, fn) {
          setCases((p) => {
            const n = [...p];
            n[i] = fn({ ...n[i] });
            return n;
          });
          setDirty(true);
        }
        function updDef(i, f, v) {
          upd(i, (tc) => ({ ...tc, [f]: v }));
        }
        function updStep(i, si, v) {
          upd(i, (tc) => {
            const s = [...tc.steps];
            s[si] = v;
            return { ...tc, steps: s };
          });
        }
        function addStep(i) {
          upd(i, (tc) => ({ ...tc, steps: [...tc.steps, ""] }));
        }
        function delStep(i, si) {
          upd(i, (tc) => ({
            ...tc,
            steps: tc.steps.filter((_, j) => j !== si),
          }));
        }
        function updExpected(i, ri, v) {
          upd(i, (tc) => ({
            ...tc,
            expectedResults: tc.expectedResults.map((e, j) =>
              j !== ri ? e : { ...e, expected: v },
            ),
          }));
        }
        function addExpected(i) {
          upd(i, (tc) => {
            const rk = String(tc.expectedResults.length + 1);
            return {
              ...tc,
              expectedResults: [
                ...tc.expectedResults,
                { key: rk, expected: "" },
              ],
              exec: {
                ...tc.exec,
                results: [...tc.exec.results, EMPTY_EXEC_ROW(rk)],
              },
            };
          });
        }
        function delExpected(i, ri) {
          upd(i, (tc) => ({
            ...tc,
            expectedResults: tc.expectedResults.filter((_, j) => j !== ri),
            exec: {
              ...tc.exec,
              results: tc.exec.results.filter((_, j) => j !== ri),
            },
          }));
        }
        function updNotes(i, v) {
          upd(i, (tc) => ({ ...tc, exec: { ...tc.exec, notes: v } }));
        }
        function updOverall(i, e, v) {
          upd(i, (tc) => ({
            ...tc,
            exec: {
              ...tc.exec,
              overallStatus: { ...tc.exec.overallStatus, [e]: v },
            },
          }));
        }
        function updActual(i, ri, v) {
          upd(i, (tc) => ({
            ...tc,
            exec: {
              ...tc.exec,
              results: tc.exec.results.map((r, j) =>
                j !== ri ? r : { ...r, actual: v },
              ),
            },
          }));
        }
        function updResultStatus(i, ri, e, v) {
          upd(i, (tc) => ({
            ...tc,
            exec: {
              ...tc.exec,
              results: tc.exec.results.map((r, j) =>
                j !== ri ? r : { ...r, status: { ...r.status, [e]: v } },
              ),
            },
          }));
        }

        function addCase() {
          const maxNum = cases.reduce((m, c) => {
            const x = c.id.match(/(\d+)$/);
            return x ? Math.max(m, parseInt(x[1])) : m;
          }, 0);
          const prefix = cases[0]?.id.replace(/-\d+$/, "") || "TC";
          const nc = {
            ...EMPTY_TC(),
            id: `${prefix}-${String(maxNum + 1).padStart(3, "0")}`,
          };
          setCases((p) => [...p, nc]);
          setDirty(true);
          setExpanded(cases.length);
        }
        function delCase(i) {
          if (!confirm("Hapus test case ini?")) return;
          setCases((p) => p.filter((_, j) => j !== i));
          setDirty(true);
          setExpanded(null);
        }

        function doReset(i, reason) {
          setResetIdx(null);
          upd(i, (tc) => ({
            ...tc,
            exec: {
              notes: "",
              overallStatus: { DEV: "", Staging: "", Prod: "" },
              results: tc.expectedResults.map((er) => EMPTY_EXEC_ROW(er.key)),
              updatedAt: nowISO(),
            },
            _isReset: true,
            _resetReason: reason || "",
          }));
        }

        async function save() {
          setSaving(true);
          try {
            // Save TSV via API (filePath) or legacy fileHandle
            const tsvContent = serializeCardToTSV(cases);
            if (filePath) {
              const r = await fetch(
                "/api/files/content?path=" + encodeURIComponent(filePath),
                {
                  method: "PUT",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ content: tsvContent }),
                },
              );
              if (!r.ok) throw new Error(await r.text());
            } else if (fileHandle) {
              await writeFile(fileHandle, tsvContent);
            }
            // Save exec JSON
            if (filePath) {
              const srcName = filePath.split("/").pop();
              const newExec = buildExecJSON(
                cases,
                execData,
                filePath,
                srcName,
                activeVersion,
              );
              // Also persist any in-memory (stashed) versions — e.g. v1 after you switched to a
              // new v2 — so they aren't dropped on save and stay in the version list after refresh.
              for (const ver of Object.keys(stashRef.current)) {
                if (ver === activeVersion || newExec.versions[ver]) continue;
                const vcases = stashRef.current[ver] || [];
                const cmap = {};
                for (const tc of vcases) {
                  if (tc.id)
                    cmap[tc.id] = {
                      testcaseId: tc.id,
                      current: tcToSnapshot(tc),
                      history: tc.history || [],
                    };
                }
                newExec.versions[ver] = {
                  createdAt: nowISO(),
                  updatedAt: nowISO(),
                  cases: cmap,
                };
              }
              const execPath = filePath
                .replace(/\.tsv$/i, ".exec.json")
                .replace(/\.csv$/i, ".exec.json");
              const r2 = await fetch(
                "/api/files/content?path=" + encodeURIComponent(execPath),
                {
                  method: "PUT",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    content: JSON.stringify(newExec, null, 2),
                  }),
                },
              );
              if (!r2.ok) throw new Error(await r2.text());
              setCases(applyExecDataToCases(cases, newExec, activeVersion));
              setExecData(newExec);
            } else {
              setCases((p) =>
                p.map((tc) => {
                  const { _isReset, _resetReason, _legacyExec, ...r } = tc;
                  return r;
                }),
              );
            }
            setDirty(false);
            setSaveMsg("Saved ✓");
            setTimeout(() => setSaveMsg(""), 2500);
          } catch (e) {
            setSaveMsg("Error: " + e.message);
          }
          setSaving(false);
        }

        function copyTSV() {
          navigator.clipboard.writeText(serializeCardToTSV(cases));
          setSaveMsg("Copied!");
          setTimeout(() => setSaveMsg(""), 2000);
        }

        // Auto-map every case in this file from the generated manifest in AUTOMATION_ROOT
        async function autoMapFile() {
          setSaveMsg("Auto-mapping…");
          try {
            const ids = cases.map((c) => c.id).filter(Boolean);
            const r = await fetch("/api/automation/automap", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ case_ids: ids }),
            }).then((r) => r.json());
            if (!r.ok) throw new Error(r.error || "automap failed");
            setSaveMsg(
              `✓ Auto-mapped ${r.mapped}/${r.total}` +
                (r.unmapped && r.unmapped.length
                  ? ` (${r.unmapped.length} tak ada di manifest)`
                  : ""),
            );
            onReloadMap && onReloadMap();
            setTimeout(() => setSaveMsg(""), 4000);
          } catch (e) {
            setSaveMsg("Error: " + e.message);
          }
        }

        // Common directory of mapped spec files (so "Run all" runs the whole domain/spec)
        function commonSpecDir(paths) {
          if (paths.length === 1) return paths[0];
          const split = paths.map((p) => p.split("/"));
          const min = Math.min(...split.map((s) => s.length));
          const common = [];
          for (let i = 0; i < min; i++) {
            const seg = split[0][i];
            if (split.every((s) => s[i] === seg)) common.push(seg);
            else break;
          }
          return common.join("/") || paths[0];
        }

        // Run the whole file (all mapped specs, no grep)
        function runAll() {
          const specs = [
            ...new Set(
              cases
                .map((c) => autoMap[c.id] && autoMap[c.id].spec_file)
                .filter(Boolean),
            ),
          ];
          if (!specs.length) {
            setSaveMsg("Belum ada mapping — klik 🤖 Auto-map dulu");
            setTimeout(() => setSaveMsg(""), 3500);
            return;
          }
          const dir = commonSpecDir(specs);
          const firstId = (
            cases.find((c) => autoMap[c.id] && autoMap[c.id].spec_file) ||
            cases[0] ||
            {}
          ).id;
          onRunCase && onRunCase(firstId, dir, ""); // no grep → run entire spec/dir
        }

        const counts = STATUS_OPTIONS.filter(Boolean).reduce(
          (acc, s) => ({
            ...acc,
            [s]: cases.filter((c) => (c.exec?.overallStatus?.[env] || "") === s)
              .length,
          }),
          {},
        );

        const filtered = cases.filter((c) => {
          if (search) {
            const q = search.toLowerCase();
            if (
              !c.id.toLowerCase().includes(q) &&
              !c.scenario.toLowerCase().includes(q)
            )
              return false;
          }
          if (
            fStatus !== "All" &&
            (c.exec?.overallStatus?.[env] || "") !== fStatus
          )
            return false;
          return true;
        });

        // Reset page on filter/search/env change — skip on mount (page starts at 1 already)
        useEffect(() => {
          if (!mountedRef.current) {
            mountedRef.current = true;
            return;
          }
          setPage(1);
        }, [search, fStatus, env]);

        // Infinite scroll via IntersectionObserver
        // Guard: skip the very first observation to prevent immediate fire on mount
        const obsReadyRef = useRef(false);
        useEffect(() => {
          const el = loadMoreRef.current;
          if (!el) return;
          obsReadyRef.current = false; // reset on each dep change
          const obs = new IntersectionObserver(
            (entries) => {
              if (!obsReadyRef.current) {
                obsReadyRef.current = true;
                return;
              } // skip first callback
              if (entries[0].isIntersecting && page * 30 < filtered.length) {
                setPage((p) => p + 1);
              }
            },
            { threshold: 0.1 },
          );
          obs.observe(el);
          return () => obs.disconnect();
        }, [page, filtered.length]);

        const PAGE_SIZE = 30;
        const visible = filtered.slice(0, page * PAGE_SIZE);
        const hasMore = visible.length < filtered.length;

        return (
          <div
            style={{ display: "flex", flexDirection: "column", height: "100%" }}
          >
            {resetIdx !== null && (
              <ResetModal
                onConfirm={(reason) => doReset(resetIdx, reason)}
                onCancel={() => setResetIdx(null)}
              />
            )}

            {/* Toolbar */}
            <div
              style={{
                padding: "8px 14px",
                borderBottom: "1px solid var(--border-1)",
                background: "var(--sidebar-bg)",
                display: "flex",
                gap: 8,
                alignItems: "center",
                flexWrap: "wrap",
                flexShrink: 0,
              }}
            >
              <input
                value={search}
                onChange={(e) => setSearch(e.target.value)}
                placeholder="Search ID / scenario..."
                style={{
                  fontSize: 11,
                  padding: "4px 10px",
                  borderRadius: 6,
                  border: "1px solid var(--border-1)",
                  background: "var(--elevated-bg)",
                  color: "var(--text-1)",
                  outline: "none",
                  width: 200,
                }}
              />
              <div style={{ display: "flex", gap: 3 }}>
                {["All", "Passed", "Failed", "Need to Test", "On Test"].map(
                  (s) => (
                    <button
                      key={s}
                      onClick={() => setFStatus(s === fStatus ? "All" : s)}
                      style={{
                        fontSize: 10,
                        padding: "3px 9px",
                        borderRadius: 12,
                        border: "1px solid",
                        cursor: "pointer",
                        background: fStatus === s ? "#3b82f6" : "transparent",
                        borderColor:
                          fStatus === s ? "#3b82f6" : "var(--border-1)",
                        color: fStatus === s ? "#fff" : "var(--text-3)",

                      border: "1px solid var(--border-1)",
                      borderRadius: 6,
                      padding: "5px 16px",
                      cursor: "pointer",
                    }}
                  >
                    Load more ({visible.length} / {filtered.length})
                  </button>
                </div>
              )}
              {!hasMore && filtered.length > PAGE_SIZE && (
                <div
                  style={{
                    padding: "10px 14px",
                    textAlign: "center",
                    fontSize: 10,
                    color: "var(--text-5)",
                  }}
                >
                  All {filtered.length} test cases loaded
                </div>
              )}
            </div>
          </div>
        );
      }

      // ─── FLAT TABLE VIEWER ────────────────────────────────────────────────────────
      function FlatViewer({ headers, rows }) {
        const [search, setSearch] = useState("");
        const filtered = rows.filter(
          (r) =>
            !search ||
            r.some((c) => c.toLowerCase().includes(search.toLowerCase())),

                value={search}

                style={{

                  borderRadius: 6,
                  border: "1px solid var(--border-1)",
                  background: "var(--elevated-bg)",

                style={{ fontSize: 10, color: "var(--text-4)", marginLeft: 12 }}

                          padding: "6px 12px",
                          textAlign: "left",
                          fontSize: 10,
                          color: "var(--text-4)",
                          fontWeight: 600,
                          textTransform: "uppercase",
                          letterSpacing: 1,

                      key={ri}

                          /^(passed|failed|on test|need to test)$/i.test(
