      function MarkdownViewer({
        content,
        fileHandle,
        filePath,
        gdocsEnabled,
        readOnly,
        docTitle,
      }) {
        const [editMode, setEditMode] = useState(false);
        const [draft, setDraft] = useState(content);
        const [saving, setSaving] = useState(false);
        const [saveErr, setSaveErr] = useState(null);
        const [copied, setCopied] = useState(false);
        const [exporting, setExporting] = useState(false);
        const [exported, setExported] = useState(null); // webViewLink
        const mdRef = useRef(null);

        // Detect prototype/design links in content
        const prototypeLinkMatch = draft.match(
          /(?:https?:\/\/[^\s\)\]\>]+(?:figma\.com|framer\.app|prototype|design|mockup)[^\s\)\]\>]*|\/tmp\/[^\s\)\]\>]+\.html)/i,
        );
        const prototypeLink = prototypeLinkMatch ? prototypeLinkMatch[0] : null;

        // Export current content as a NEW Google Doc (non-destructive write path)
        async function handleExportGDoc() {
          setExporting(true);
          setSaveErr(null);
          setExported(null);
          try {
            const base =
              docTitle ||
              (filePath ? filePath.split(/[\\/]/).pop() : "") ||
              "QA Browser Export";
            const title = base.replace(/\.(md|txt)$/i, "");
            const r = await fetch("/api/gdocs", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ title, content: draft }),
            });
            const data = await r.json();
            if (!r.ok) throw new Error(data.error || "Export failed");
            setExported(data.webViewLink);
            window.open(data.webViewLink, "_blank");
            setTimeout(() => setExported(null), 6000);
          } catch (e) {
            setSaveErr(e.message || "Export failed");
          }
          setExporting(false);
        }

        function handleCopy() {
          if (!mdRef.current) return;
          const html = mdRef.current.innerHTML;
          try {
            const item = new ClipboardItem({
              "text/html": new Blob([html], { type: "text/html" }),
              "text/plain": new Blob([draft], { type: "text/plain" }),
            });
            navigator.clipboard
              .write([item])
              .then(() => {
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
              })
              .catch(() => {
                // fallback: plain text
                navigator.clipboard.writeText(draft).then(() => {
                  setCopied(true);
                  setTimeout(() => setCopied(false), 2000);
                });
              });
          } catch {
            navigator.clipboard.writeText(draft).then(() => {
              setCopied(true);
              setTimeout(() => setCopied(false), 2000);
            });
          }
        }

        function resolveWorkspaceMarkdownPath(ref, currentPath) {
          if (!ref) return null;
          const raw = String(ref).trim();
          if (
            !raw ||
            /^([a-z]+:)?\/\//i.test(raw) ||
            raw.startsWith("mailto:") ||
            raw.startsWith("tel:") ||
            raw.startsWith("#")
          )
            return null;
          if (raw.startsWith("media:") || raw.startsWith("MEDIA:")) return null;

          // Strip common trailing punctuation from plain text/code mentions.
          const clean = raw.replace(/[\])}.!,;:]+$/g, "").replace(/\\/g, "/");
          const rel = clean.replace(/^\.\//, "").replace(/^\//, "");
          const last = rel.split("/").filter(Boolean).pop() || "";
          if (!/\.(md|markdown|txt)$/i.test(last) || rel.includes(".."))
            return null;

          const workspaceRoots = [
            "Assessments",
            "BRD",
            "Feature List",
            "PRD",
            "Release notes",
            "Test",
            "UAT",
            "incident report",
            "presentation",
            "summary",
          ];
          if (
            workspaceRoots.some(
              (root) => rel === root || rel.startsWith(root + "/"),
            )
          )
            return rel;

          const currentDir = currentPath?.includes("/")
            ? currentPath.split("/").slice(0, -1).join("/")
            : "";
          return currentDir ? `${currentDir}/${rel}` : rel;
        }

        function workspaceMarkdownOpenUrl(path) {
          const url = new URL(window.location.href);
          url.searchParams.set("open", path);
          url.hash = "";
          return url.toString();
        }

        function markWorkspaceMarkdownAnchor(a, path) {
          a.href = workspaceMarkdownOpenUrl(path);
          a.target = "_blank";
          a.rel = "noopener";
          a.dataset.workspacePath = path;
        }

        function linkWorkspaceMarkdownCodeMentions(container, currentPath) {
          container.querySelectorAll("code").forEach((code) => {
            if (code.closest("a") || code.closest("pre")) return;
            const path = resolveWorkspaceMarkdownPath(
              code.textContent,
              currentPath,
            );
            if (!path) return;

            const a = document.createElement("a");
            markWorkspaceMarkdownAnchor(a, path);
            code.replaceWith(a);
            a.appendChild(code);
          });
        }

        function makeWorkspaceMarkdownLinkHandler(currentPath) {
          return function onClick(e) {
            const a =
              e.target && e.target.closest ? e.target.closest("a") : null;
            if (!a) return;

            const path =
              a.dataset.workspacePath ||
              resolveWorkspaceMarkdownPath(
                a.getAttribute("href") || a.href || "",
                currentPath,
              );
            if (!path) return;

            e.preventDefault();
            window.open(workspaceMarkdownOpenUrl(path), "_blank", "noopener");
          };
        }

        async function renderMarkdown(container, markdown, currentPath) {
          if (!container) return;
          container.innerHTML = marked.parse(markdown);
          container.querySelectorAll("a[href]").forEach((a) => {
            const path = resolveWorkspaceMarkdownPath(
              a.getAttribute("href") || "",
              currentPath,
            );
            if (path) markWorkspaceMarkdownAnchor(a, path);
          });
          linkWorkspaceMarkdownCodeMentions(container, currentPath);
          container.removeEventListener(
            "click",
            container.__qaMarkdownLinkHandler,
          );
          container.__qaMarkdownLinkHandler =
            makeWorkspaceMarkdownLinkHandler(currentPath);
          container.addEventListener(
            "click",
            container.__qaMarkdownLinkHandler,
          );
          const mermaidBlocks = Array.from(
            container.querySelectorAll(
              "pre code.language-mermaid, pre code.lang-mermaid",
            ),
          );
          if (!mermaidBlocks.length || !window.mermaid) return;
          window.mermaid.initialize({
            startOnLoad: false,
            theme: "dark",
            securityLevel: "loose",
          });
          for (const code of mermaidBlocks) {
            const pre = code.closest("pre");
            if (!pre) continue;
            const graph = document.createElement("div");
            graph.className = "mermaid";
            graph.textContent = code.textContent || "";
            pre.replaceWith(graph);
          }
          try {
            await window.mermaid.run({
              nodes: container.querySelectorAll(".mermaid"),
            });
          } catch {}
          // click-to-zoom mermaid charts with zoom + pan
          container.querySelectorAll(".mermaid").forEach((el) => {
            if (el.__zoomBound) return;
            el.__zoomBound = true;
            el.addEventListener("click", () => {
              const overlay = document.createElement("div");
              overlay.className = "mermaid-overlay";
              const inner = document.createElement("div");
              inner.className = "mermaid-content";
              const svgWrap = document.createElement("div");
              svgWrap.innerHTML = el.innerHTML;
              const svg = svgWrap.querySelector("svg");
              if (svg) {
                svg.removeAttribute("width");
                svg.removeAttribute("height");
                svg.style.transform = "scale(1)";
              }
              svgWrap.style.width = "100%";
              svgWrap.style.height = "100%";
              svgWrap.style.display = "flex";
              svgWrap.style.alignItems = "center";
              svgWrap.style.justifyContent = "center";
              inner.appendChild(svgWrap);

              // close button
              const btn = document.createElement("button");
              btn.className = "mermaid-close";
              btn.textContent = "✕";
              const close = () => overlay.remove();
              btn.addEventListener("click", close);
              overlay.addEventListener("click", (e) => {
                if (e.target === overlay) close();
              });
              document.addEventListener("keydown", function onEsc(e) {
                if (e.key === "Escape") { close(); document.removeEventListener("keydown", onEsc); }
              });

              // zoom state
              let scale = 1;
              let tx = 0, ty = 0;
              const apply = () => {
                if (svg) svg.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
                if (label) label.textContent = Math.round(scale * 100) + "%";
              };

              // zoom bar
              const bar = document.createElement("div");
              bar.className = "mermaid-zoom-bar";
              const mkBtn = (txt, fn) => {
                const b = document.createElement("button");
                b.textContent = txt;
                b.addEventListener("click", fn);
                return b;
              };
              const label = document.createElement("span");
              label.className = "zoom-label";
              bar.appendChild(mkBtn("−", () => { scale = Math.max(0.1, scale * 0.75); apply(); }));
              bar.appendChild(label);
              bar.appendChild(mkBtn("+", () => { scale = Math.min(8, scale * 1.35); apply(); }));
              bar.appendChild(mkBtn("↺", () => { scale = 1; tx = 0; ty = 0; apply(); }));

              // wheel: scroll=panY, ctrl=zoom, shift=panX
              inner.addEventListener("wheel", (e) => {
                e.preventDefault();
                if (e.ctrlKey || e.metaKey) {
                  const d = e.deltaY > 0 ? 0.85 : 1.18;
                  scale = Math.min(8, Math.max(0.1, scale * d));
                } else if (e.shiftKey) {
                  tx -= e.deltaY;
                } else {
                  ty -= e.deltaY;
                }
                apply();
              }, { passive: false });

              // drag pan
              let dragging = false, startX, startY, startTx, startTy;
              inner.addEventListener("mousedown", (e) => {
                if (e.target.closest("button")) return;
                dragging = true;
                inner.classList.add("dragging");
                startX = e.clientX; startY = e.clientY;
                startTx = tx; startTy = ty;
              });
              window.addEventListener("mousemove", (e) => {
                if (!dragging) return;
                tx = startTx + (e.clientX - startX);
                ty = startTy + (e.clientY - startY);
                apply();
              });
              window.addEventListener("mouseup", () => {
                dragging = false;
                inner.classList.remove("dragging");
              });

              overlay.appendChild(inner);
              overlay.appendChild(btn);
              overlay.appendChild(bar);
              document.body.appendChild(overlay);
              apply();
            });
          });
        }

        // Set innerHTML from draft — on mount and after save.
        // We never touch innerHTML while the user is editing (editMode=true),
        // so React never clobbers in-progress edits.
        useLayoutEffect(() => {
          renderMarkdown(mdRef.current, draft, filePath);
        }, [draft]);

        async function handleSave() {
          if (!mdRef.current) return;
          setSaving(true);
          setSaveErr(null);
          try {
            const td = new TurndownService({
              headingStyle: "atx",
              hr: "---",
              codeBlockStyle: "fenced",
            });
            td.use(turndownPluginGfm.gfm);
            const markdown = td.turndown(mdRef.current.innerHTML);
            if (filePath) {
              // API-based save (server mode)
              const r = await fetch(
                "/api/files/content?path=" + encodeURIComponent(filePath),
                {
                  method: "PUT",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ content: markdown }),
                },
              );
              if (!r.ok) throw new Error(await r.text());
            } else if (fileHandle) {
              // Legacy File System Access API fallback
              const w = await fileHandle.createWritable();
              await w.write(markdown);
              await w.close();
            } else {
              throw new Error(
                "No save target — filePath or fileHandle required",
              );
            }
            setDraft(markdown);
            setEditMode(false);
          } catch (e) {
            setSaveErr(e.message || "Save failed");
          }
          setSaving(false);
        }

        function handleCancel() {
          renderMarkdown(mdRef.current, draft); // discard edits
          setEditMode(false);
          setSaveErr(null);
        }

        return (
          <div
            style={{
              display: "flex",
              flexDirection: "column",
              height: "100%",
              overflow: "hidden",
            }}
          >
            {/* Toolbar */}
            <div
              style={{
                padding: "5px 14px",
                borderBottom: "1px solid var(--elevated-bg)",
                background: "var(--sidebar-bg)",
                display: "flex",
                alignItems: "center",
                justifyContent: "flex-end",
                gap: 6,
                flexShrink: 0,
              }}
            >
              {saveErr && (
                <span style={{ fontSize: 10, color: "#f87171", flex: 1 }}>
                  ⚠ {saveErr}
                </span>
              )}
              {exported && (
                <span style={{ fontSize: 10, color: "#4ade80", flex: 1 }}>
                  ✓ Exported — opened in new tab
                </span>
              )}
              {readOnly && !saveErr && !exported && (
                <span style={{ fontSize: 10, color: "var(--text-5)", flex: 1 }}>
                  ☁ Google Doc · read-only
                </span>
              )}
              <button
                onClick={handleCopy}
                style={{
                  fontSize: 10,
                  color: copied ? "#22c55e" : "var(--text-3)",
                  background: "transparent",
                  border: "1px solid var(--border-1)",
                  borderRadius: 4,
                  padding: "3px 10px",
                  cursor: "pointer",
                  transition: "color 0.2s",
                }}
              >
                {copied ? "✓ Copied!" : "⎘ Copy"}
              </button>
              {gdocsEnabled && !editMode && (
                <button
                  onClick={handleExportGDoc}
                  disabled={exporting}
                  title="Create a new Google Doc from this content"
                  style={{
                    fontSize: 10,
                    color: exporting ? "var(--text-5)" : "#4ade80",
                    background: "transparent",
                    border: "1px solid var(--border-1)",
                    borderRadius: 4,
                    padding: "3px 10px",
                    cursor: exporting ? "default" : "pointer",
                  }}
                >
                  {exporting ? "Exporting…" : "⇪ Export to GDocs"}
                </button>
              )}
              {prototypeLink && !editMode && (
                <button
                  onClick={() => window.open(prototypeLink, "_blank")}
                  title="Open prototype/design link"
                  style={{
                    fontSize: 10,
                    color: "#a78bfa",
                    background: "transparent",
                    border: "1px solid var(--border-1)",
                    borderRadius: 4,
                    padding: "3px 10px",
                    cursor: "pointer",
                  }}
                >
                  ▶ Open Prototype
                </button>
              )}
              {editMode ? (
                <>
                  <span
                    style={{ fontSize: 10, color: "var(--text-4)", flex: 1 }}
                  >
                    ✎ editing
                  </span>
                  <button
                    onClick={handleCancel}
                    style={{
                      fontSize: 10,
                      color: "var(--text-3)",
                      background: "transparent",
                      border: "1px solid var(--border-1)",
                      borderRadius: 4,
                      padding: "3px 10px",
                      cursor: "pointer",
                    }}
                  >
                    Cancel
                  </button>
                  <button
                    onClick={handleSave}
                    disabled={saving}
                    style={{
                      fontSize: 10,
                      color: "#fff",
                      background: saving ? "var(--text-5)" : "#3b82f6",
                      border: "none",
                      borderRadius: 4,
                      padding: "3px 10px",
                      cursor: saving ? "default" : "pointer",
                    }}
                  >
                    {saving ? "Saving…" : "✓ Save"}
                  </button>
                </>
              ) : (
                !readOnly && (
                  <button
                    onClick={() => setEditMode(true)}
                    style={{
                      fontSize: 10,
                      color: "var(--text-3)",
                      background: "transparent",
                      border: "1px solid var(--border-1)",
                      borderRadius: 4,
                      padding: "3px 10px",
                      cursor: "pointer",
                    }}
                  >
                    ✎ Edit
                  </button>
                )
              )}
            </div>

            {/* Body — single persistent div, never unmounted → scroll position never resets */}
            <div
              style={{
                overflowY: "auto",
                flex: 1,
                display: "flex",
                justifyContent: "center",
              }}
            >
              <div
                ref={mdRef}
                className="md"
                contentEditable={editMode}
                suppressContentEditableWarning={true}
                spellCheck={false}
                style={{
                  padding: "32px 40px 5vh",
                  width: "100%",
                  maxWidth: 860,
                  outline: "none",
                  cursor: editMode ? "text" : "default",
                  borderLeft: editMode
                    ? "2px solid var(--sec-prd)"
                    : "2px solid transparent",
                }}
              />
            </div>
          </div>
        );
      }

      // ─── THEME SWITCHER (isolated component — only this re-renders on theme change)
      const ThemeSwitcher = React.forwardRef(function ThemeSwitcher(
        { onSwitch },
        ref,
      ) {
        const [activeTheme, setActiveTheme] = useState("navy");
        React.useImperativeHandle(
          ref,
          () => ({ setTheme: setActiveTheme }),
          [],
        );
        return (
          <div
            style={{
              display: "flex",
              gap: 3,
              alignItems: "center",
              paddingRight: 8,
              borderRight: "1px solid var(--border-2)",
              flexShrink: 0,
            }}
          >
            {THEMES.map((t) => {
              const isActive = activeTheme === t.id;
              return (
                <button
                  key={t.id}
                  onClick={() => onSwitch(t.id)}
                  title={t.name}
                  style={{
                    width: 22,
                    height: 14,
                    borderRadius: 7,
                    padding: 0,
                    cursor: "pointer",
                    background: t.swatch[0],
                    border: isActive
                      ? `2px solid ${t.swatch[1]}`
                      : "1px solid rgba(255,255,255,0.1)",
                    display: "flex",
                    gap: 2,
                    alignItems: "center",
                    justifyContent: "center",
                    outline: "none",
                    flexShrink: 0,
                  }}
                >
                  {t.swatch.slice(1).map((c, i) => (
                    <div
                      key={i}
                      style={{
                        width: 3,
                        height: 3,
                        borderRadius: "50%",
                        background: c,
                        flexShrink: 0,
                      }}
                    />
                  ))}
                </button>
              );
            })}
          </div>
        );
      });

      // ─── RUN PANEL ────────────────────────────────────────────────────────────────
      // Execution target: 'host' (central /api/run) or 'local' (per-device runner agent).
      // Stored per-device in localStorage so each PC can choose independently.
      function getExecCfg() {
        try {
          return {
            mode: localStorage.getItem("qa_exec_mode") || "host",
            runnerUrl: (
              localStorage.getItem("qa_runner_url") || "http://localhost:9876"
            ).replace(/\/+$/, ""),
          };
        } catch {
          return { mode: "host", runnerUrl: "http://localhost:9876" };
        }
      }

      // Launch `playwright test --ui` on the runner (local) or host. GUI opens on THAT machine.
      async function openPlaywrightUI(specFile, grepPattern) {
        const cfg = getExecCfg();
        const url = cfg.mode === "local" ? cfg.runnerUrl + "/ui" : "/api/ui";
        try {
          const r = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              spec_file: specFile || "",
              grep_pattern: grepPattern || "",
            }),
          });
          const d = await r.json();
          if (!r.ok || d.error) throw new Error(d.error || "failed");
          alert(
            "Playwright UI diluncurkan di " +
              (cfg.mode === "local" ? "perangkat ini" : "host") +
              ".\nWindow-nya muncul di layar mesin itu (bukan di tab ini).\n\n" +
              (d.cmd || ""),
          );
        } catch (e) {
          alert("Gagal membuka Playwright UI: " + e.message);
        }
      }

      function RunPanel({ caseId, specFile, grepPattern, onClose }) {
        const [lines, setLines] = useState([]);
        const [status, setStatus] = useState("running"); // running | pass | fail | error
        const [elapsed, setElapsed] = useState(0);
        const abortRef = useRef(null);
        const bodyRef = useRef(null);
        const timerRef = useRef(null);

        useEffect(() => {
          const cfg = getExecCfg();
          const t0 = Date.now();
          timerRef.current = setInterval(
            () => setElapsed(Math.floor((Date.now() - t0) / 1000)),
            500,
          );
          const pushOut = (text) => {
            setLines((prev) => [...prev, ...text.split("\n").filter(Boolean)]);
            setTimeout(
              () => bodyRef.current?.scrollTo(0, bodyRef.current.scrollHeight),
              30,
            );
          };

          // ── LOCAL runner: start in background, then POLL (robust vs dropped cross-origin streams) ──
          if (cfg.mode === "local") {
            let stopped = false,
              pollId = null,
              since = 0;
            (async () => {
              try {
                const start = await fetch(cfg.runnerUrl + "/run", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({
                    spec_file: specFile,
                    grep_pattern: grepPattern,
                    env: "dev",
                  }),
                }).then((r) => r.json());
                if (start.error) throw new Error(start.error);
                const runId = start.runId;
                pollId = setInterval(async () => {
                  if (stopped) return;
                  try {
                    const s = await fetch(
                      `${cfg.runnerUrl}/run/${runId}?since=${since}`,
                    ).then((r) => r.json());
                    if (s.total != null) since = s.total;
                    if (s.output) pushOut(s.output);
                    if (s.status && s.status !== "running") {
                      stopped = true;
                      clearInterval(pollId);
                      clearInterval(timerRef.current);
                      setStatus(s.status);
                      if (s.durationMs != null)
                        setElapsed(Math.round(s.durationMs / 1000));
                      if (s.message)
                        setLines((prev) => [...prev, "⚠ " + s.message]);
                    }
                  } catch {}
                }, 800);
              } catch (e) {
                setStatus("error");
                clearInterval(timerRef.current);
                setLines((prev) => [...prev, "⚠ " + e.message]);
              }
            })();
            return () => {
              stopped = true;
              if (pollId) clearInterval(pollId);
              clearInterval(timerRef.current);
            };
          }

          // ── HOST (central server): same-origin SSE stream ──
          const ctrl = new AbortController();
          abortRef.current = ctrl;
          fetch("/api/run", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              case_id: caseId,
              spec_file: specFile,
              grep_pattern: grepPattern,
            }),
            signal: ctrl.signal,
          })
            .then(async (res) => {
              const reader = res.body.getReader();
              const dec = new TextDecoder();
              let buf = "";
              while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buf += dec.decode(value, { stream: true });
                const parts = buf.split("\n\n");
                buf = parts.pop();
                for (const part of parts) {
                  const dataLine = part
                    .split("\n")
                    .find((l) => l.startsWith("data:"));
                  if (!dataLine) continue;
                  try {
                    const evt = JSON.parse(dataLine.slice(5));
                    if (evt.type === "output") {
                      pushOut(evt.text);
                    } else if (evt.type === "run_end") {
                      setStatus(evt.status);
                      clearInterval(timerRef.current);
                      if (evt.duration_ms != null)
                        setElapsed(Math.round(evt.duration_ms / 1000));
                      if (evt.message)
                        setLines((prev) => [...prev, "⚠ " + evt.message]);
                    }
                  } catch {}
                }
              }
            })
            .catch((e) => {
              if (e.name !== "AbortError") {
                setStatus("error");
                clearInterval(timerRef.current);
              }
            });

          return () => {
            ctrl.abort();
            clearInterval(timerRef.current);
          };
        }, []);

        const statusColor =
          {
            running: "#60a5fa",
            pass: "#4ade80",
            fail: "#f87171",
            error: "#fbbf24",
          }[status] || "#888";

        return (
          <div
            style={{

              {status === "running" && (

            {/* Output */}
            <div

            >
              {lines.map((l, i) => {
                const col = /\bPASS\b|✓|passed/i.test(l)

      /* ── BigPictureView: native render from prototype HTML ────────────── */
      function BigPictureView({ page, themeId }) {
        const [html, setHtml] = React.useState("");
        const [css, setCss] = React.useState("");
        const [err, setErr] = React.useState("");
        const styleId = React.useRef("_bp_css_injected");
        const protoPath = "Assessments/audit/00-Timeline/satuinbox-big-picture.html";

        React.useEffect(() => {
          let alive = true;
          fetch(`/api/files/content?path=${encodeURIComponent(protoPath)}`)
            .then((r) => { if (!r.ok) throw new Error(r.statusText); return r.text(); })
            .then((src) => {
              if (!alive) return;
              const parser = new DOMParser();
              const doc = parser.parseFromString(src, "text/html");
              /* extract <style> content once */
              if (!document.getElementById(styleId.current)) {
                const styleEl = doc.querySelector("style");
                if (styleEl) {
                  const s = document.createElement("style");
                  s.id = styleId.current;
                  s.textContent = styleEl.textContent;
                  document.head.appendChild(s);
                  if (alive) setCss("ok");
                }
              }
              /* extract page div */
              const pages = doc.querySelectorAll(".page");
              const target = pages[page] || pages[0];
              if (target) {
                if (alive) setHtml(target.innerHTML);
              } else {
                if (alive) setErr("Page not found in prototype");
              }
              /* area-chip: prototype's inline script doesn't run when injected via
                 dangerouslySetInnerHTML — rebuild chips React-side (theme-driven, dot hue only) */
              if (page === 1) {
                requestAnimationFrame(() => {
                  const dot = {
                    "Growth & Internal Ops":"#94a3b8","Platform Stability":"#38bdf8","Analytics":"#3b82f6",
                    "Notification":"#f87171","Monetization Guard":"#eab308","Sales Expansion":"#22c55e",
                    "UX Simplification":"#f59e0b","Ticket":"#fb923c","Unified Contact":"#ef4444",
                    "Tools / Add-ons":"#f59e0b","AI & Automation":"#4ade80","Channel & Ecosystem":"#ec4899",
                  };
                  document.querySelectorAll(".bp-root td.area").forEach((td) => {
                    if (td.querySelector(".area-chip")) return;
                    const name = td.textContent.trim();
                    const c = dot[name] || "#94a3b8";
                    td.innerHTML =
                      '<span class="area-chip"><span class="area-dot" style="background:' + c + ';"></span>' + name + "</span>";
                  });
                });
              }
            })
            .catch((e) => { if (alive) setErr(e.message); });
          return () => { alive = false; };
        }, [page]);

        if (err)
          return (
            <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", color:"var(--text-5)", fontSize:12 }}>
              Error loading prototype: {err}
            </div>
          );
        if (!html)
          return (
            <div style={{ flex:1, display:"flex", alignItems:"center", justifyContent:"center", color:"var(--text-5)", fontSize:12 }}>
              Loading…
            </div>
          );

        return (
          <div style={{ flex:1, overflow:"auto", background:"var(--app-bg)" }}>
            <div className="bp-root" data-theme={themeId || "navy"}>
              <div className="page active" dangerouslySetInnerHTML={{ __html: html }} />
            </div>
          </div>
        );
      }

.rm-exp-field select,.rm-exp-field input{background:var(--elevated-2);color:var(--text-2);border:1px solid var(--border-2);border-radius:4px;padding:3px 5px;font-size:11px;outline:none}
.rm-exp-op-actions{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.rm-exp-op-actions button{background:var(--accent);color:var(--on-accent,#fff);border:none;border-radius:4px;padding:3px 9px;font-size:11px;cursor:pointer}

.rm-exp-op-status{font-size:11px;color:var(--text-3)}

/* OP search: dropdown below the input */
.op-search-wrap{position:relative}
.op-search-input{width:100%;box-sizing:border-box;background:var(--elevated-2);color:var(--text-2);border:1px solid var(--border-2);border-radius:4px;padding:3px 5px;font-size:11px;outline:none}
.op-search-input:focus{border-color:var(--accent-primary)}
.op-search-dd{position:absolute;top:calc(100% + 2px);left:0;right:0;z-index:60;max-height:220px;overflow:auto;background:var(--elevated-bg);border:1px solid var(--border-1);border-radius:8px;box-shadow:0 10px 26px rgba(0,0,0,.5);padding:4px}
.op-search-item{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:5px;font-size:11px;color:var(--text-2);cursor:pointer;white-space:nowrap}
.op-search-item:hover,.op-search-item.hl{background:var(--hover-bg)}
.op-search-id{font-weight:700;color:var(--accent-secondary);flex-shrink:0}
.op-search-subj{overflow:hidden;text-overflow:ellipsis}
.op-search-hint{padding:4px 7px;font-size:10px;color:var(--text-4)}
.rm-cell:hover .bar{outline:1px dashed var(--border-2);outline-offset:1px;min-height:8px}
.task-table th.wk{width:17px;min-width:17px;text-align:center;padding:5px 1px;font-size:11px;font-weight:500;color:var(--text-5);border-left:1px solid var(--border-3)}
.task-table td.wk{width:17px;min-width:17px;padding:7px 1px;text-align:center;border-left:1px solid var(--border-3)}
.task-table th.mo{text-align:center;padding:7px 3px;border-left:1px solid var(--border-1)}
.task-table td.mo-start,.task-table th.wk.mo-start{border-left:1px solid var(--border-1)}
/* frozen identity/metadata columns: horizontal scroll only moves the timeline.
   left set per-cell in JS from offsetLeft; z-index keeps them above week cells. */
.task-table .sl{position:sticky;z-index:15;background:var(--app-bg)}
.task-table tbody tr:nth-child(even) .sl{background:var(--elevated-2)}
/* row hover must reach frozen cells too, overriding zebra (both parities) */
.task-table tbody tr:hover .sl{background:var(--hover-bg)}
/* an open combo's cell must rise above sibling sticky cells so its dropdown
   isn't painted over by later rows' .sl (each sticky cell is its own context) */
.task-table .sl:has(.rm-combo.open){z-index:50}
.task-table thead .sl{z-index:35}
.task-table tbody tr.grp td{background:var(--elevated-2)}
.grp-label{position:sticky;left:0;display:inline-block}
/* right edge of the frozen block */
.task-table .sl-edge{box-shadow:2px 0 0 var(--border-1)}
/* fixed column widths (no table-layout:fixed; inner widths make these resolve) */
.task-table .w80{width:75px;max-width:75px;min-width:75px}
.task-table .w70{width:68px;max-width:68px;min-width:68px}
.task-table .w-area{width:80px;max-width:80px;min-width:80px}
.task-table .w250{width:250px;max-width:250px;min-width:250px}
.status-pill{display:inline-block;border-radius:5px;padding:2px 8px;font-size:10px;font-weight:700;white-space:nowrap}
.st-hold{background:var(--elevated-2);color:var(--text-4);border:1px solid var(--border-2)}
.st-blocked{background:var(--priority-p1-bg);color:var(--accent-danger);border:1px solid var(--accent-danger)}
.rule-cfg .cfg-row{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.rule-cfg label{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:11px;color:var(--text-4)}
.rule-cfg input{width:72px;background:var(--elevated-2);color:var(--text-2);border:1px solid var(--border-2);border-radius:4px;padding:2px 3px;font-size:11px;text-align:center;outline:none}
.rule-cfg input:focus{border-color:var(--accent-primary)}
.rule-cfg .rm-compute{width:100%;margin-top:2px}
.rm-compute{background:var(--accent-primary);color:var(--accent-fg,inherit)}
.rm-apply{background:var(--accent-secondary);color:var(--accent-fg,inherit)}
.rm-discard{background:transparent;border:1px solid var(--border-2);color:var(--text-3)}
.bar-ghost{position:absolute;inset:2px 0;border:1.5px dashed var(--accent-secondary);border-radius:3px;background:color-mix(in srgb,var(--accent-secondary) 18%,transparent);pointer-events:none}
.rm-deferred{font-size:11px;color:var(--accent-danger);padding:3px 6px;margin-bottom:4px}
.task-table th.wk.wk-over{background:var(--priority-p1-bg);color:var(--accent-danger);font-weight:700}
.st-now{background:var(--priority-p1-bg);color:var(--priority-p1-fg);border:1px solid var(--priority-p1-fg)}
.st-next{background:transparent;color:var(--accent-secondary);border:1.5px solid var(--accent-secondary)}
.st-backlog{background:transparent;color:var(--text-4);border:1px solid var(--border-3)}
/* row opacity: Current > Next > Backlog */
.task-table tbody tr[data-group="next"]{opacity:.82}
.task-table tbody tr[data-group="backlog"]{opacity:.65}
/* group header: Current bright accent, Next muted accent, Backlog neutral */
.task-table tbody tr.grp[data-section="current"] td{background:var(--priority-p1-bg);border-left:3px solid var(--priority-p1-fg)}
.task-table tbody tr.grp[data-section="current"] .grp-label{color:var(--priority-p1-fg);font-weight:700}
.task-table tbody tr.grp[data-section="next"] td{background:var(--elevated-bg);border-left:3px solid var(--accent-secondary);font-weight:600}
.task-table tbody tr.grp[data-section="next"] .grp-label{color:var(--accent-secondary);font-weight:700}
.task-table tbody tr.grp[data-section="backlog"] td{background:var(--deep-bg);border-left:3px solid var(--text-4)}
.task-table tbody tr.grp[data-section="backlog"] .grp-label{color:var(--text-4)}
.task-table tbody tr.grp[data-section="closed"] td{background:var(--deep-bg);border-left:3px solid var(--text-5);opacity:.55}
.task-table tbody tr.grp[data-section="closed"] .grp-label{color:var(--text-5)}
/* month-view tabs */
.rm-month-tabs{display:flex;gap:4px;padding:0 0 6px;align-items:center}
.rm-month-tab{display:flex;align-items:center;gap:6px;padding:5px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--text-4);background:transparent;border:none;transition:all .15s}
.rm-month-tab:hover{background:var(--elevated-bg);color:var(--text-2)}
.rm-month-tab.active{background:var(--elevated-1);color:var(--text-1);font-weight:700}
.rm-month-tab .tab-count{font-family:var(--font-mono,monospace);font-size:10px;font-weight:700;padding:1px 5px;border-radius:8px;background:var(--elevated-2);color:var(--text-3)}
.rm-month-tab.active .tab-count{background:rgba(99,102,241,.15);color:var(--accent-secondary)}
.rm-month-tab .tab-dot{width:6px;height:6px;border-radius:50%;background:var(--accent-warning,#F59E0B)}
.rm-month-tab.active .tab-dot{background:var(--accent-secondary)}
/* version assignment bar */
.rm-ver-bar{display:flex;align-items:center;gap:10px;padding:6px 0;margin-bottom:4px}
.rm-ver-label{font-size:12px;font-weight:700;color:var(--text-1)}
.rm-ver-arrow{color:var(--text-4);font-size:11px}

.rm-ver-field:hover{border-color:var(--accent-primary)}
.rm-ver-field .ver-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.rm-ver-field .ver-clear{margin-left:auto;font-size:10px;color:var(--text-4);cursor:pointer}
.rm-ver-field .ver-clear:hover{color:var(--accent-danger)}
.rm-ver-dd{position:absolute;top:calc(100% + 4px);left:0;z-index:200;min-width:100%;max-height:240px;overflow:auto;background:var(--elevated-bg);border:1px solid var(--border-1);border-radius:8px;box-shadow:0 10px 26px rgba(0,0,0,.5);padding:4px}
.rm-ver-search{width:100%;box-sizing:border-box;background:var(--elevated-2);color:var(--text-2);border:1px solid var(--border-2);border-radius:5px;padding:4px 6px;font-size:11px;margin-bottom:4px;outline:none}
.rm-ver-search:focus{border-color:var(--accent-primary)}
.rm-ver-opt{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:5px;font-size:11px;color:var(--text-2);cursor:pointer;white-space:nowrap}
.rm-ver-opt:hover,.rm-ver-opt.hl{background:var(--hover-bg)}
.rm-ver-opt.sel{background:rgba(99,102,241,.14);color:var(--text-1)}
.rm-ver-opt.sel::before{content:"✓";font-size:10px;color:var(--accent-secondary);font-weight:700}
.rm-ver-opt:not(.sel)::before{content:"";width:8px}
.rm-ver-opt .ver-name{font-family:var(--font-mono,monospace);font-weight:600}
.rm-ver-opt .ver-wps{margin-left:auto;font-size:9px;padding:1px 5px;border-radius:8px;background:rgba(99,102,241,.12);color:var(--accent-secondary)}
.rm-ver-opt .ver-id{font-size:9px;color:var(--text-5)}
/* source dot on task row */
.rm-src-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle;flex-shrink:0}
.rm-src-dot.src-rm{background:var(--accent-secondary)}
.rm-src-dot.src-op{background:var(--accent-success,#10B981)}
.rm-src-dot.src-linked{background:var(--accent-warning,#F59E0B)}
.task-table .tname{display:flex;align-items:center;gap:4px}
.task-table .tname .rm-editable{flex:1;min-width:0}
/* OP status pills */
.opst-new{background:var(--elevated-2);color:var(--text-3);border:1px solid var(--border-2)}
.opst-progress{background:rgba(99,102,241,.15);color:var(--accent-secondary);border:1px solid var(--accent-secondary)}
.opst-closed{background:rgba(16,185,129,.12);color:#10B981;border:1px solid #10B981}
.opst-hold{background:rgba(245,158,11,.12);color:var(--accent-warning,#F59E0B);border:1px solid var(--accent-warning,#F59E0B)}
.opst-rejected{background:rgba(239,68,68,.12);color:var(--accent-danger,#EF4444);border:1px solid var(--accent-danger,#EF4444)}
.opst-unknown{background:var(--elevated-2);color:var(--text-4);border:1px solid var(--border-3)}

/* month info badge */
.rm-month-info{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--accent-warning,#F59E0B);padding:2px 0;margin-left:auto}

/* floating review button */
.rm-review-fab{position:fixed;bottom:20px;right:20px;z-index:300;background:var(--accent-secondary);color:#fff;border:none;border-radius:50%;width:48px;height:48px;font-size:20px;cursor:grab;box-shadow:0 4px 16px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;transition:transform .15s;touch-action:none;user-select:none}

/* review modal */
.rm-modal-overlay{position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.rm-modal{background:var(--elevated-bg);border:1px solid var(--border-1);border-radius:12px;width:min(640px,90vw);max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.5)}

/* footer toggle */
.rm-footer-toggle{display:flex;align-items:center;gap:6px;padding:4px 10px;margin:4px 0;cursor:pointer;font-size:11px;color:var(--text-4);background:transparent;border:1px solid var(--border-2);border-radius:5px;transition:all .15s}
.rm-footer-toggle:hover{color:var(--text-2);border-color:var(--text-4)}
.rm-footer-toggle .toggle-arrow{transition:transform .15s;display:inline-block}
.rm-footer-toggle .toggle-arrow.open{transform:rotate(90deg)}
.rm-hide-btn{margin:8px 0 0 8px;padding:3px 7px;line-height:1;font-size:11px;border-radius:4px;align-self:flex-start}
.rm-collapsed-row{display:flex;gap:6px;margin:6px 0 0 8px}
/* section divider: explicit gap + visible separator between sections */
.task-table tbody tr.grp[data-section="next"] td,
.task-table tbody tr.grp[data-section="backlog"] td{
  border-top:2px solid var(--border-1);
  /* ponytail: padding-top adds visual gap; sticky header covers it as you scroll,
     but the border + bg color change is enough to signal the break */
  padding-top:8px
}
/* spacer row: one empty row between sections for a visible breathing gap */
.task-table tbody tr.sec-gap td{height:10px;border:none;background:var(--app-bg)}
/* timeline bar: Next thinner, Backlog dashed (only timeline cells, not the Backlog column) */
.bar.on-next{height:5px;border-radius:2px;background:var(--accent-secondary)}
/* ponytail: specificity bump only on .wk cells — Backlog column (.mo) keeps injected amber fill */
.task-table tbody tr[data-group="backlog"] td.wk .bar.on-backlog{height:4px;border-radius:2px;border:1px dashed var(--text-4);background:transparent!important}
.dep-cell{display:flex;flex-wrap:wrap;gap:3px;align-items:center;max-width:100%}
/* dep picker menu wide enough to read task names (trigger is tiny) */
.task-table td.dep .rm-menu{min-width:180px}
.dep-chip{display:inline-flex;align-items:center;gap:1px;font-size:10px;color:var(--accent-secondary);background:var(--elevated-2);border:1px solid var(--border-2);border-radius:5px;padding:0 2px;max-width:100%;min-width:0}
.dep-x{background:none;border:none;color:var(--text-4);cursor:pointer;font-size:12px;line-height:1;padding:0 1px}
.dep-x:hover{color:var(--priority-p1-fg)}

.dep-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

.src-cur{color:var(--priority-p1-fg)}
.src-feat{color:var(--accent-secondary)}
.src-ui{color:var(--priority-p2-fg)}

.rm-sticky{z-index:40;background:var(--app-bg);padding-bottom:2px}
.rm-addbtn{margin-left:8px;background:var(--accent-primary);color:#fff;border:none;border-radius:6px;padding:4px 12px;font-size:11px;font-weight:700;cursor:pointer}

.rm-search:focus{outline:none;border-color:var(--accent-primary)}
.rm-addbtn:hover{filter:brightness(1.1)}

.rm-head .rm-saved{margin-left:8px}
.rm-editable{display:block;min-width:40px;min-height:16px;cursor:text;border-radius:4px;padding:1px 3px;white-space:pre-wrap;word-break:break-word}
.rm-editable:hover{background:var(--elevated-bg);outline:1px dashed var(--border-2)}
.rm-ph{color:var(--text-4);font-style:italic}
.rm-input{width:100%;box-sizing:border-box;background:var(--elevated-2);color:var(--text-1);border:1px solid var(--accent-primary);border-radius:5px;padding:3px 6px;font-size:11px;font-family:inherit;outline:none;resize:vertical}
.task-table td.num{white-space:nowrap}

/* flex column: KPI fixed at top, table-panel scrolls, footer fixed at bottom */
.rm-flexroot{display:flex;flex-direction:column;min-height:0;flex:1}
.rm-flexcol{display:flex;flex-direction:column;min-height:0;flex:1}

.rm-flexcol .rm-footer{flex:none}

.task-table thead tr:nth-child(2) th{top:28px;z-index:29}
.task-table tbody tr.grp td{position:sticky;top:50px;z-index:20}
/* section-specific sticky backgrounds: override the generic .grp sticky bg */
.task-table tbody tr.grp[data-section="current"] td{background:var(--priority-p1-bg)}
.task-table tbody tr.grp[data-section="next"] td{background:var(--elevated-bg)}

.wl-review-err{color:var(--priority-p1-fg);border-color:var(--priority-p1-fg)}
/* ── Responsive: qHD/HD ──────────────────────────────────────────────── */
@media(max-width:1280px){
  .rm-head{flex-wrap:wrap;gap:8px 10px}
  .rm-search{width:140px}
  .rm-wrap .rules-area{margin-left:0;width:100%;margin-top:8px}
  .rule-box{min-width:140px;flex:1}

}

.rm-bulk-count{font-size:12px;font-weight:700;color:var(--accent-primary)}
.rm-bulk-sel{background:var(--elevated-bg);border:1px solid var(--border-1);border-radius:5px;padding:3px 8px;font-size:11px;color:var(--text-2);cursor:pointer}

      /* inline text editor: click to edit, commit on blur/Enter, cancel on Esc.
         multiline=true → textarea for description. ponytail: uncontrolled defaultValue
         + commit-on-blur, no per-keystroke state; add controlled value if live
         validation is ever needed. */
      function RmEdit({ value, onCommit, placeholder }) {
        const [editing, setEditing] = React.useState(false);
        const ref = React.useRef(null);
        React.useEffect(() => {
          if (editing && ref.current) {
            ref.current.focus();
            ref.current.select && ref.current.select();
            // auto-grow textarea to fit content
            const resize = () => {
              if (!ref.current) return;
              ref.current.style.height = "auto";
              ref.current.style.height = ref.current.scrollHeight + "px";
            };
            resize();
            ref.current.addEventListener("input", resize);
            return () => ref.current?.removeEventListener("input", resize);
          }
        }, [editing]);
        const commit = () => {
          const v = ref.current ? ref.current.value.trim() : value;
          setEditing(false);
          if (v !== (value || "")) onCommit(v);
        };
        if (!editing)
          return (
            <span
              className="rm-editable"
              tabIndex={0}
              title="Double-click to edit"
              onDoubleClick={() => setEditing(true)}
              onKeyDown={(e) => {
                if (e.key === "Enter" || e.key === "F2") setEditing(true);
              }}
            >
              {value || <span className="rm-ph">{placeholder || "—"}</span>}
            </span>
          );
        return (
          <textarea
            ref={ref}
            className="rm-input"
            defaultValue={value || ""}
            onBlur={commit}
            onKeyDown={(e) => {
              if (e.key === "Escape") {
                e.stopPropagation();
                setEditing(false);
              } else if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
                e.preventDefault();
                commit();
              }
            }}
            style={{ overflow: "hidden", minHeight: "28px" }}
          />
        );
      }

      /* §78/§79/§133 combobox: badge at rest, menu on interaction, no layout shift */
      function RmCombo({
        value,
        options,
        onChange,
        width,
        searchable,
        renderValue,
        label,
      }) {
        const [open, setOpen] = React.useState(false);
        const [q, setQ] = React.useState("");
        const [hl, setHl] = React.useState(0);
        const [menuPos, setMenuPos] = React.useState(null); // {left,top,width} fixed coords when open (portal escapes scroll clip)
        const rootRef = React.useRef(null);
        const inputRef = React.useRef(null);
        const menuRef = React.useRef(null);

        const all = React.useMemo(
          () =>
            options.map((o) => (typeof o === "string" ? { v: o, label: o } : o)),
          [options]
        );
        const opts = React.useMemo(() => {
          if (!searchable || !q.trim()) return all;
          const needle = q.trim().toLowerCase();
          return all.filter((o) => o.label.toLowerCase().includes(needle));
        }, [all, q, searchable]);

        React.useEffect(() => {
          if (!open) return;
          const onDown = (e) => {
            if (
              rootRef.current && !rootRef.current.contains(e.target) &&
              (!menuRef.current || !menuRef.current.contains(e.target))
            )
              setOpen(false);
          };
          document.addEventListener("mousedown", onDown);
          return () => document.removeEventListener("mousedown", onDown);
        }, [open]);

        React.useEffect(() => {
          if (open && searchable && inputRef.current) inputRef.current.focus();
        }, [open, searchable]);

        const placeMenu = React.useCallback(() => {
          const el = rootRef.current;
          if (!el) return;
          const r = el.getBoundingClientRect();
          const menuW = Math.max(r.width, 160);
          const maxH = 240; // matches .rm-menu max-height
          const spaceBelow = window.innerHeight - r.bottom;
          const below = spaceBelow >= maxH || spaceBelow >= r.top;
          // ponytail: always use top, clamp to viewport so menu never goes off-screen
          const top = below
            ? Math.min(r.bottom + 2, window.innerHeight - maxH - 4)
            : Math.max(4, r.top - maxH - 2);
          setMenuPos({
            left: Math.max(4, Math.min(r.left, window.innerWidth - menuW - 8)),
            top,
            width: menuW,
          });
        }, []);

        React.useEffect(() => {
          if (!open) return;
          placeMenu();
          const onScroll = () => placeMenu();
          window.addEventListener("scroll", onScroll, true); // capture: any ancestor scroll
          window.addEventListener("resize", onScroll);
          return () => {
            window.removeEventListener("scroll", onScroll, true);
            window.removeEventListener("resize", onScroll);
          };
        }, [open, placeMenu]);

        function openMenu() {
          const i = all.findIndex((o) => o.v === value);
          setQ("");
          setHl(i < 0 ? 0 : i);
          setOpen(true);
        }
        function pick(o) {
          if (o && o.v !== value) onChange(o.v);
          setOpen(false);
        }
        function onKeyDown(e) {
          if (e.key === "Escape") {
            if (!open) return;
            e.stopPropagation();
            e.preventDefault();
            setOpen(false);
            return;
          }
          if (!open) {
            if (e.key === "Enter" || e.key === " " || e.key === "ArrowDown") {
              e.preventDefault();
              openMenu();
            }
            return;
          }
          if (e.key === "ArrowDown") {
            e.preventDefault();
            setHl((h) => (opts.length ? (h + 1) % opts.length : 0));
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            setHl((h) => (opts.length ? (h - 1 + opts.length) % opts.length : 0));
          } else if (e.key === "Enter") {
            e.preventDefault();
            pick(opts[hl]);
          } else if (e.key === "Tab") {
            setOpen(false);
          }
        }

        return (
          <div
            className={"rm-combo" + (open ? " open" : "")}
            style={{ width }}
            ref={rootRef}
            onKeyDown={onKeyDown}
          >
            <div
              className="rm-trigger"
              role="combobox"
              tabIndex={0}
              aria-expanded={open}
              aria-haspopup="listbox"
              aria-label={label}
              onClick={() => (open ? setOpen(false) : openMenu())}
            >
              {renderValue ? (
                renderValue(value)
              ) : (
                <span className="rm-txt" title={value || undefined}>{value || "—"}</span>
              )}
              <span className="rm-caret">▾</span>
            </div>
            {open && menuPos && ReactDOM.createPortal(
              <div
                ref={menuRef}
                className="rm-menu rm-menu-fixed"
                role="listbox"
                aria-label={label}
                style={{
                  position: "fixed",
                  left: menuPos.left,
                  top: menuPos.top,
                  minWidth: menuPos.width,
                }}
              >
                {searchable && (
                  <input
                    ref={inputRef}
                    className="rm-search"
                    placeholder="Search…"
                    value={q}
                    onChange={(e) => {
                      setQ(e.target.value);
                      setHl(0);
                    }}
                  />
                )}
                {opts.length === 0 && <div className="rm-empty">No match</div>}
                {opts.map((o, i) => (
                  <div
                    key={o.v}
                    role="option"
                    aria-selected={o.v === value}
                    className={
                      "rm-opt" +
                      (i === hl ? " hl" : "") +
                      (o.v === value ? " sel" : "")
                    }
                    onMouseEnter={() => setHl(i)}
                    onClick={() => pick(o)}
                  >
                    {o.label}
                  </div>
                ))}
              </div>,
              document.body
            )}
          </div>
        );
      }

                    onMouseDown={(e) => { e.preventDefault(); pick(r); }}

      /* ── Workload compute (local, deterministic) ─────────────────────────────
         effort/testing L|M|H → person-weeks. dev-load from `effort`, qa-load from
         `testing`. Each task's load is spread evenly across the weeks in its
         schedule range, then summed per (month,week). No LLM — pure arithmetic. */
      const WL_PW = { L: 1, M: 2, H: 3 }; // person-weeks per level — the knob
      const WL_CAP = { dev: 3, qa: 2 };   // capacity per week — the knob
      function monthWeekKeys(months) {
        // ordered list of "Mon w#" cells across the visible months, 4 weeks each
        const keys = [];
        months.forEach((m) => [1, 2, 3, 4].forEach((w) => keys.push(m + " w" + w)));
        return keys;
      }
      function taskWeekSpan(t, orderKeys) {
        const s = t.schedule?.start, e = t.schedule?.end;
        if (!s?.month || !e?.month) return [];
        const si = orderKeys.indexOf(s.month + " w" + (s.week || 1));
        const ei = orderKeys.indexOf(e.month + " w" + (e.week || 4));
        if (si < 0 || ei < 0 || ei < si) return [];
        return orderKeys.slice(si, ei + 1);
      }
      function computeWorkload(tasks, months) {
        const order = monthWeekKeys(months);
        const perWeek = Object.fromEntries(order.map((k) => [k, { dev: 0, qa: 0 }]));
        (tasks || []).forEach((t) => {
          if (t.status === "backlog" || t.priority === "Backlog") return;
          const span = taskWeekSpan(t, order);
          if (!span.length) return;
          const dev = (WL_PW[t.effort] || 0) / span.length;
          const qa = (WL_PW[t.testing] || 0) / span.length;
          span.forEach((k) => { perWeek[k].dev += dev; perWeek[k].qa += qa; });
        });
        const total = Object.values(perWeek).reduce(
          (a, w) => ({ dev: a.dev + w.dev, qa: a.qa + w.qa }), { dev: 0, qa: 0 });
        return { order, perWeek, total };
      }

      function WorkloadPanel({ tasks, months, monthView, wlOpen, setWlOpen }) {
        const wl = React.useMemo(() => computeWorkload(tasks, months), [tasks, months]);
        const [review, setReview] = React.useState(null); // {loading, text, err}
        const [fabPos, setFabPos] = React.useState(null); // {x,y} px, null = default corner
        const fabDrag = React.useRef(null);
        const fabDragged = React.useRef(false);
        const runReview = async () => {
          setReview({ loading: true });
          // same view-aware filter as KPI/groups
          const all = (tasks || []).filter((t) => t.status !== "backlog" && t.priority !== "Backlog");
          let visible = monthView ? all : all.filter(t => !t._source);
          if (monthView) {
            const mi = months.indexOf(monthView);
            if (mi >= 0) visible = visible.filter(t => {
              if (!t.schedule) return false;
              const smi = months.indexOf(t.schedule.start.month);
              const emi = months.indexOf(t.schedule.end.month);
              return smi <= mi && mi <= emi;
            });
          }
          const lines = visible
            .map((t) => `- ${t.id} "${t.task}" [${t.priority}] area=${t.strategicArea || "-"} effort=${t.effort} testing=${t.testing} ` +
              `sched=${t.schedule?.start?.month}w${t.schedule?.start?.week}→${t.schedule?.end?.month}w${t.schedule?.end?.week}` +
              (Array.isArray(t.dependency) && t.dependency.length ? ` deps=${t.dependency.join(",")}` : "") +
              (t.opId ? ` WP#${t.opId}` : "") +
              (t.desc ? `\n    desc: ${t.desc}` : ""));
          const load = wl.order
            .filter((k) => wl.perWeek[k].dev || wl.perWeek[k].qa)
            .map((k) => `${k}: dev ${wl.perWeek[k].dev.toFixed(1)}/${WL_CAP.dev} qa ${wl.perWeek[k].qa.toFixed(1)}/${WL_CAP.qa}`);
          const prompt =
            "Review SatuInbox roadmap timeline. Capacity per week: dev " + WL_CAP.dev +
            " person-weeks, qa " + WL_CAP.qa + ".\n\nWeekly load (already computed):\n" +
            load.join("\n") + "\n\nTasks:\n" + lines.join("\n") +
            "\n\nBeri analisa singkat: (1) minggu overload dev/qa, (2) konflik dependency/urutan (deps yang sudah ditandai), " +
            "(3) DEPENDENCY TERSEMBUNYI — dari desc & area, tebak pasangan task yang kemungkinan saling bergantung tapi belum ditandai deps, sebut id-nya + alasan singkat, (4) QA bottleneck, (5) saran geser jadwal. Bahasa Indonesia, ringkas, poin-poin.";
          try {
            const r = await fetch("/api/hermes", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ prompt }),
            });
            const j = await r.json();
            if (!r.ok || j.error) setReview({ err: j.error || ("HTTP " + r.status) });
            else setReview({ text: j.output || j.stderr || "(kosong)" });
          } catch (e) {
            setReview({ err: e.message });
          }
        };
        return (
          <>
          <div className="wl-panel" style={wlOpen ? undefined : {display:"none"}}>
            <div className="wl-head">
              <button type="button" className="rm-footer-toggle rm-hide-btn" style={{margin:"0 8px 0 0"}} onClick={() => setWlOpen(false)} title="Hide workload panel" aria-label="Hide workload panel">▾</button>
              <span className="wl-title">Workload dev &amp; QA</span>
              <span className="wl-sub">
                total dev {wl.total.dev.toFixed(1)} pw · qa {wl.total.qa.toFixed(1)} pw
                &nbsp;·&nbsp; L=1 M=2 H=3 · cap dev {WL_CAP.dev}/qa {WL_CAP.qa} per minggu
              </span>
            </div>
            <div className="wl-bars">
              {wl.order.map((k) => {
                const w = wl.perWeek[k];
                if (!w.dev && !w.qa) return null;
                const dOver = w.dev > WL_CAP.dev, qOver = w.qa > WL_CAP.qa;
                return (
                  <div key={k} className="wl-week">
                    <span className="wl-wk">{k}</span>
                    <span className={"wl-cell" + (dOver ? " wl-over" : "")}>dev {w.dev.toFixed(1)}</span>
                    <span className={"wl-cell" + (qOver ? " wl-over" : "")}>qa {w.qa.toFixed(1)}</span>
                  </div>
                );
              })}
            </div>
          </div>
            {/* floating review FAB (draggable) */}
            <button type="button" className={"rm-review-fab" + (review?.loading ? " loading" : "")}
              style={fabPos ? { left: fabPos.x, top: fabPos.y, right: "auto", bottom: "auto" } : undefined}
              onPointerDown={(e) => {
                const r = e.currentTarget.getBoundingClientRect();
                fabDrag.current = { dx: e.clientX - r.left, dy: e.clientY - r.top, moved: false };
                const move = (ev) => {
                  const d = fabDrag.current; if (!d) return;
                  d.moved = true;
                  fabDragged.current = true;
                  setFabPos({ x: ev.clientX - d.dx, y: ev.clientY - d.dy });
                };
                const up = () => {
                  fabDrag.current = null;
                  window.removeEventListener("pointermove", move);
                  window.removeEventListener("pointerup", up);
                };
                window.addEventListener("pointermove", move);
                window.addEventListener("pointerup", up);
              }}
              onClick={(e) => {
                // skip if this click ended a drag
                if (fabDragged.current) { fabDragged.current = false; return; }
                if (!review?.loading) runReview();
              }}
              title="Review timeline (Hermes) — tahan & geser untuk memindahkan"
              disabled={review?.loading}>
              {review?.loading ? "⏳" : "📊"}
            </button>
            {/* review modal */}
            {review && !review.loading && (
              <div className="rm-modal-overlay" onClick={() => setReview(null)}>
                <div className="rm-modal" onClick={e => e.stopPropagation()}>
                  <div className="rm-modal-head">
                    <h3>{review.err ? "⚠ Review Error" : "📊 Timeline Review"}</h3>
                    <button className="rm-modal-close" onClick={() => setReview(null)}>✕</button>
                  </div>
                  <div className={"rm-modal-body" + (review.err ? " err" : "")}>
                    {review.err ? "⚠ " + review.err : review.text}
                  </div>
                </div>
              </div>
            )}
          </>
        );
      }

      function RoadmapView({ themeId }) {

        const [wpCache, setWpCache] = React.useState({}); // {opId: {loading|error|data}}

        const RM_DEFAULT_CFG = { dev: 2, qa: 1, cap: 0.8 };
        const [cfg, setCfg] = React.useState(RM_DEFAULT_CFG);
        const [deferred, setDeferred] = React.useState([]); // ids blocked-downstream, unscheduled
        const [preview, setPreview] = React.useState(null); // {id:{lo,hi}} scheduler result, not committed until Apply

        React.useEffect(() => {

              if (alive && storedVerMap && typeof storedVerMap === "object")

              const stored = await loadRoadmapIDB();
              if (!alive) return;
              // always fetch seed — used as source for new scheduler fields (status/dependency/risk)
              let seed = null;

              if (!alive) return;
              // normalize: fill scheduler fields. seed value by id → else default.
              // manual-added rows (not in seed) keep their own or get active/[]/1.
              const seedById = Object.fromEntries((seed || []).map((s) => [s.id, s]));
              const normalize = (t) => {

                  ...t,
                  status: t.status || (s && s.status) || "active",

        const updateTask = React.useCallback((id, patch) => {

        const toggleAll = () => setSelIds(prev => {

        });
        const statusPatch = (v) => v === "NOW" ? { current: true, status: "active" }

        const bulkApply = (prio, stat) => {

        const pushToOp = (task, fields) => {

        // roadmap priority → OP priority id (case-insensitive name match)
        const opPriorityId = (rmPrio) => {

          const hit = (opMeta.priorities || []).find(
            (p) => String(p.name || "").toLowerCase() === want,

          if (!hit) console.warn("[RM] no OP priority matching", rmPrio, want);

        };

        const [focusId, setFocusId] = React.useState(null);
        const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
        const addMonth = React.useCallback(() => {
          setMonths((prev) => {
            const last = prev[prev.length - 1];
            const li = MONTH_NAMES.indexOf(last);

          });
        }, []);
        const addTask = React.useCallback((cur, noSchedule) => {
          const id = "t" + Date.now().toString(36);
          setTasks((prev) => {
            const list = prev || [];
            const maxRank = list.reduce((m, t) => Math.max(m, t.rank || 0), 0);
            const next = [
              ...list,
              {
                id,
                rank: maxRank + 1,
                task: "New task",
                strategicArea: "",
                sourceColumn: "FEATURE",
                desc: "",
                effort: "",
                impact: "",
                testing: "",
                priority: "P3",
                current: !!cur,
                // ponytail: Next gets a 1-week schedule starting this month; Backlog gets none
                schedule: cur || noSchedule ? null : { start: { month: months[0], week: 1 }, end: { month: months[0], week: 2 } },
              },
            ];

          });
          setQ("");

        }, []);
        const removeTask = React.useCallback((id) => {
          setTasks((prev) => {
