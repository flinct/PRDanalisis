      }

      function App() {
        const APP_NAV_STATE_KEY = "qa_browser_nav_state_v1";
        // ── Hash routing ─────────────────────────────────────────────────────
        const SECTION_ID_TO_WORKSPACE_NAV = {
          brd: "brd",
          assessments: "assessment",
          prd: "prd",
          test: "testcase",
          feature: "feature-list",
          "incident-report": "incident-report",
          summary: "summary",
          "release-notes": "release-notes",
          uat: "uat",
          presentation: "presentation",
          gdocs: "google-docs",
        };
        const WORKSPACE_NAV_TO_SECTION_ID = Object.fromEntries(
          Object.entries(SECTION_ID_TO_WORKSPACE_NAV).map(([k, v]) => [v, k]),
        );
        function parseHash() {
          const raw = window.location.hash.replace(/^#\/?/, "");
          if (!raw) return {};
          const parts = raw.split("/");
          const page = parts[0];
          if (page === "workspace") {
            return {
              mainNav: "workspace",
              workspaceNav: parts[1] || null,
              filePath: parts.slice(2).join("/") || null,
            };
          }
          return { mainNav: page };
        }
        function navToHash(mn, wn, sel) {
          if (mn === "workspace") {
            let h = "#/workspace";
            if (wn) {
              h += "/" + wn;
              if (sel?.path) {
                // strip section folder prefix (first segment)
                const rel = sel.path.replace(/^[^/]+\//, "");
                if (rel !== sel.path) h += "/" + rel;
              }
            }
            return h;
          }
          return "#/" + mn;
        }
        function readAppNavState() {
          try {
            return (
              JSON.parse(localStorage.getItem(APP_NAV_STATE_KEY) || "{}") || {}
            );
          } catch {
            return {};
          }
        }
        function normalizeMainNav(value) {
          return [
            "dashboard-v2",
            "bigpic",
            "workspace",
            "tracker",
            "monitoring",
            "new-request",
            "memory",
            "settings",
          ].includes(value)
            ? value
            : "dashboard-v2"; // ponytail: Dashboard v1 removed — v2 is the default landing
        }
        function normalizeWorkspaceNav(value, mainNavValue) {
          if (mainNavValue === "dashboard")
            return [
              "dashboard-openproject",
              "dashboard-testcase-stats",
            ].includes(value)
              ? value
              : "dashboard-openproject";
          if (mainNavValue === "workspace")
            return [
              "brd",
              "assessment",
              "prd",
              "testcase",
              "feature-list",
              "incident-report",
              "summary",
              "release-notes",
              "uat",
              "presentation",
              "google-docs",
            ].includes(value)
              ? value
              : null;
          return null;
        }
        function normalizeSelected(value) {
          if (!value || typeof value !== "object") return null;
          if (!value.path || !value.sectionId || !value.name) return null;
          return {
            path: value.path,
            sectionId: value.sectionId,
            name: value.name,
            ext: value.ext || "",
            gdocId: value.gdocId || "",
          };
        }
        const urlOpenPath = new URLSearchParams(window.location.search).get(
          "open",
        );
        const hashState = parseHash();
        const hashFilePathRef = useRef(hashState.filePath || null);
        const hashWorkspaceNavRef = useRef(hashState.workspaceNav || null);
        const savedNavState = readAppNavState();
        const initialMainNav = urlOpenPath
          ? "workspace"
          : hashState.mainNav
            ? normalizeMainNav(hashState.mainNav)
            : normalizeMainNav(savedNavState.mainNav);
        const initialWorkspaceNav = urlOpenPath
          ? null
          : hashState.mainNav
            ? normalizeWorkspaceNav(hashState.workspaceNav, initialMainNav)
            : normalizeWorkspaceNav(savedNavState.workspaceNav, initialMainNav);
        const [sections, setSections] = useState([]);
        const [selected, setSelected] = useState(() =>
          urlOpenPath || hashFilePathRef.current ? null : normalizeSelected(savedNavState.selected),
        ); // { path, sectionId, name, ext }
        const [fileData, setFileData] = useState(null);
        const [loading, setLoading] = useState(false);
        const [error, setError] = useState(null);
        const [sideSearch, setSideSearch] = useState("");
        const [sidebarWidth, setSidebarWidth] = useState(256);

        const [autoMap, setAutoMap] = useState({});
        const [runCase, setRunCase] = useState(null); // { caseId, specFile, grepPattern }
        const [importing, setImporting] = useState(false);
        const [importMsg, setImportMsg] = useState("");
        const [gdocs, setGdocs] = useState([]); // node-shaped tree from /api/gdocs
        const [gdocsStatus, setGdocsStatus] = useState(null); // { oauthConfigured, connected, email, folderName }
        const [tcStats, setTcStats] = useState(null);
        const [view, setView] = useState("files");
        // ── Corin-style navigation ─────────────────────────────────────────
        const [mainNav, rawSetMainNav] = useState(initialMainNav); // 'dashboard' | 'workspace' | 'memory' | 'settings'
        const [workspaceNav, setWorkspaceNav] = useState(initialWorkspaceNav); // dashboard child or workspace child
        const [themeId, setThemeId] = useState("navy");
        const [activeSection, setActiveSection] = useState(
          () => normalizeSelected(savedNavState.selected)?.sectionId || null,
        );
        // Tracker sidenav state — lifted so left sidebar can drive tab + sheet
        const [trackerTab, setTrackerTab] = useState("statistics"); // 'statistics' | 'input'
        const [trackerSheet, setTrackerSheet] = useState("all");
        const [trackerSheetTabs, setTrackerSheetTabs] = useState([]);
        // Dashboard v2 tier-2 sub-nav + embedded-tracker state. ponytail: resets to overview on mount.
        const [dashV2Sub, setDashV2Sub] = useState("overview"); // 'overview'|'roadmap'|'tracker'|'cost'
        const [dashTrackerTab, setDashTrackerTab] = useState("statistics");
        const [dashTrackerSheet, setDashTrackerSheet] = useState("all");

        function confirmTrackerLeave() {
          if (!window.__qaTrackerDirty) return true;
          return window.confirm("Tracker belum di-save. Tinggalkan halaman?");
        }
        function setMainNav(next) {
          if (!confirmTrackerLeave()) return;
          rawSetMainNav(next);
        }

        const [creating, setCreating] = useState(null); // { path, sectionId }
        const [creatingBusy, setCreatingBusy] = useState(false);

        const [user, setUser] = useState(() => {
          try {
            return JSON.parse(localStorage.getItem("qa_user") || "null");
          } catch {
            return null;
          }
        });
        const [loginErr, setLoginErr] = useState("");

        const DEFAULT_REQUEST_BLOCKS = [
          {
            id: "req-1",
            type: "paragraph",
            props: {},
            content: [
              {
                type: "text",
                text: "Klik text ini untuk edit request baru.",
                styles: {},
              },
            ],
            children: [
              {
                id: "req-2",
                type: "checkListItem",
                props: { checked: false },
                content: [{ type: "text", text: "Checklist item", styles: {} }],
                children: [],
              },
            ],
          },
        ];
        const [requestBlocks, setRequestBlocks] = useState(
          DEFAULT_REQUEST_BLOCKS,
        );
        const [requestSyncMeta, setRequestSyncMeta] = useState({
          loading: true,
          saving: false,
          error: "",
          updatedAt: null,
          updatedBy: null,
        });
        const requestEditorRef = useRef(null);
        const [blockNoteState, setBlockNoteState] = useState({
          loading: false,
          ready: false,
          error: "",
          rev: 0,
        });
        const canAdminEdit = user?.role === "admin";
        const themeRef = useRef(null);

        useEffect(() => {
          try {
            localStorage.setItem(
              APP_NAV_STATE_KEY,
              JSON.stringify({
                mainNav,
                workspaceNav,
                selected,
              }),
            );
          } catch {}
        }, [mainNav, workspaceNav, selected]);

        // ── Hash sync: state → URL ──────────────────────────────────────────
        useEffect(() => {
          const h = navToHash(mainNav, workspaceNav, selected);
          if (window.location.hash !== h) {
            history.replaceState(null, "", h);
          }
        }, [mainNav, workspaceNav, selected?.path]);

        // ── Hash sync: URL → state (back/forward) ──────────────────────────
        useEffect(() => {
          function onHash() {
            const h = parseHash();
            if (!h.mainNav) return;
            const nm = normalizeMainNav(h.mainNav);
            setMainNav(nm);
            if (nm === "workspace") {
              setWorkspaceNav(normalizeWorkspaceNav(h.workspaceNav, nm));
            }
          }
          window.addEventListener("hashchange", onHash);
          return () => window.removeEventListener("hashchange", onHash);
        }, []);

        const isDraggingRef = useRef(false);
        const dragStartXRef = useRef(0);
        const dragStartWRef = useRef(0);

        // ── Sidebar resize ──────────────────────────────────────────────────────────

        function onResizeStart(e) {
          isDraggingRef.current = true;
          dragStartXRef.current = e.clientX;
          dragStartWRef.current = sidebarWidth;
          document.body.style.cursor = "col-resize";
          document.body.style.userSelect = "none";
          const onMove = (ev) => {
            if (!isDraggingRef.current) return;
            const next = Math.min(
              480,
              Math.max(
                160,
                dragStartWRef.current + ev.clientX - dragStartXRef.current,
              ),
            );
            setSidebarWidth(next);
          };
          const onUp = () => {
            isDraggingRef.current = false;
            document.body.style.cursor = "";
            document.body.style.userSelect = "";
            window.removeEventListener("mousemove", onMove);
            window.removeEventListener("mouseup", onUp);
          };
          window.addEventListener("mousemove", onMove);
          window.addEventListener("mouseup", onUp);
        }

        // ── Theme ───────────────────────────────────────────────────────────────────
        function switchTheme(id) {
          const t = THEMES.find((x) => x.id === id);
          if (!t) return;
          applyThemeVars(t);
          saveThemeIDB(id);
          setThemeId(id);
          requestAnimationFrame(() =>
            requestAnimationFrame(() => themeRef.current?.setTheme(id)),
          );
        }

        // ── Load file tree from API ──────────────────────────────────────────────────
        async function loadTree() {
          try {
            const res = await fetch("/api/files");
            const data = await res.json();
            setSections(data);
            // expand first section that has content
            const first = data.find((s) => s.tree?.length > 0);
            if (first && !activeSection) setActiveSection(first.id);
          } catch (e) {
            setError("Cannot reach server: " + e.message);
          }
        }

        // ── Quiet tree refresh (sidebar only — never touches selection/open file) ─────
        async function refreshTree() {
          try {
            const data = await fetch("/api/files").then((r) => r.json());
            if (Array.isArray(data)) setSections(data);
          } catch {}
        }

        // ── Create a folder or new TSV from the sidebar ───────────────────────────────
        async function createItem(name, type) {
          if (!creating || !name) return;
          setCreatingBusy(true);
          try {
            if (type === "folder") {
              const r = await fetch("/api/files/mkdir", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ path: `${creating.path}/${name}` }),
              });
              if (!r.ok) throw new Error(await r.text());
            } else {
              const fp = `${creating.path}/${name.replace(/\.tsv$/i, "")}.tsv`;
              const tpl = serializeCardToTSV([{ ...EMPTY_TC(), id: "TC-001" }]);
              const r = await fetch(
                "/api/files/content?path=" + encodeURIComponent(fp),
                {
                  method: "PUT",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ content: tpl }),
                },
              );
              if (!r.ok) throw new Error(await r.text());
            }
            await refreshTree();
            setActiveSection(creating.sectionId);
            setCreating(null);
          } catch (e) {
            alert("Create failed: " + e.message);
          }
          setCreatingBusy(false);
        }

        // ── Load Google Docs (OAuth, via server.js) ──────────────────────────────────
        async function loadGDocs() {
          try {
            const st = await fetch("/api/gdocs/status").then((r) => r.json());
            setGdocsStatus(st);
            if (!st.connected || st.needsReconnect) {
              setGdocs([]);
              return;
            }
            const r = await fetch("/api/gdocs");
            const list = await r.json().catch(() => []);
            if (!r.ok)
              throw new Error(list.error || "Failed to load Google Docs");
            setGdocs(Array.isArray(list) ? list : []);
          } catch (e) {
            setGdocsStatus((prev) => ({
              ...(prev || {}),
              oauthConfigured: prev ? prev.oauthConfigured : false,
              connected: false,
              error: "Cannot reach server: " + e.message,
            }));
            setGdocs([]);
          }
        }

        async function loadTestcaseStats() {
          try {
            const data = await fetch("/api/testcases/stats").then((r) =>
              r.json(),
            );
            setTcStats(data);
          } catch {
            setTcStats(null);
          }
        }

        useEffect(() => {
          loadTestcaseStats();
        }, []);

        // ── Load automation map for a file's test cases ──────────────────────────────
        async function loadAutoMap(cases) {
          if (!cases?.length) return;
          const ids = cases.map((c) => c.id).filter(Boolean);
          if (!ids.length) return;
          try {
            const rows = await fetch(
              "/api/testcases?" + new URLSearchParams({ limit: 500 }),
            ).then((r) => r.json());
            const map = {};
            for (const row of rows) {
              if (row.tc_type || row.spec_file) {
                map[row.id] = {
                  tc_type: row.tc_type || "manual",
                  spec_file: row.spec_file || "",
                  grep_pattern: row.grep_pattern || "",
                };
              }
            }
            setAutoMap(map);
          } catch {}
        }

        // ── Open a file ─────────────────────────────────────────────────────────────
        async function openFile(node, sectionId, options = {}) {
          if (node.kind !== "file") return;
          setView("files");
          setSelected({
            path: node.path,
            sectionId,
            name: node.name,
            ext: node.ext,
            gdocId: node.gdocId,
          });
          if (!options.keepNav) {
            setMainNav("workspace");
            setWorkspaceNav(SECTION_ID_TO_WORKSPACE_NAV[sectionId] || null);
          }
          setActiveSection(sectionId);
          setLoading(true);
          setFileData(null);

          try {
            // Google Doc → fetch via /api/gdocs, render as read-only markdown
            if (node.ext === "gdoc") {
              const r = await fetch(
                "/api/gdocs/" + encodeURIComponent(node.gdocId),
              );
              if (!r.ok)
                throw new Error(
                  (await r.json().catch(() => ({}))).error ||
                    "Failed to read Google Doc",
                );
              const d = await r.json();
              setFileData({
                type: "md",
                content: d.markdown,
                path: node.path,
                gdocId: node.gdocId,
                title: d.title,
              });
              setLoading(false);
              return;
            }
            if (node.ext === "pptx") {
              setFileData({
                type: "binary",
                path: node.path,
                ext: node.ext,
                openUrl:
                  "/api/files/open?path=" + encodeURIComponent(node.path),
              });
              setLoading(false);
              return;
            }
            const text = await fetch(
              "/api/files/content?path=" + encodeURIComponent(node.path),
            ).then((r) => r.text());
            if (node.ext === "md") {
              setFileData({ type: "md", content: text, path: node.path });
            } else {
              // parseFile splits each line into columns first, then checks card format
              const parsed = parseFile(text, node.ext || "tsv");
              if (parsed.type === "card") {
                const cases = parsed.cases;
                // try to get exec data from companion JSON
                const execPath = node.path
                  .replace(/\.tsv$/i, ".exec.json")
                  .replace(/\.csv$/i, ".exec.json");
                let execData = null;
                try {
                  const ejson = await fetch(
                    "/api/files/content?path=" + encodeURIComponent(execPath),
                  ).then((r) => (r.ok ? r.json() : null));
                  execData = ejson;
                } catch {}
                setFileData({ type: "card", cases, execData, path: node.path });
                await loadAutoMap(cases);
              } else {
                setFileData({ type: "text", content: text, path: node.path });
              }
            }
          } catch (e) {
            setError(e.message);
          }
          setLoading(false);
        }

        // ── Save exec JSON via API ───────────────────────────────────────────────────
        async function saveExecViaAPI(tsvPath, execData) {
          const execPath = tsvPath
            .replace(/\.tsv$/i, ".exec.json")
            .replace(/\.csv$/i, ".exec.json");
          await fetch(
            "/api/files/content?path=" + encodeURIComponent(execPath),
            {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                content: JSON.stringify(execData, null, 2),
              }),
            },
          );
        }

        // ── Save automation mapping ──────────────────────────────────────────────────
        async function handleSaveMap(caseId, mapData) {
          try {
            await fetch(`/api/testcases/${caseId}/map`, {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(mapData),
            });
            setAutoMap((prev) => ({
              ...prev,
              [caseId]: {
                tc_type: mapData.tc_type || "manual",
                spec_file: mapData.spec_file || "",
                grep_pattern: mapData.grep_pattern || "",
              },
            }));
          } catch (e) {
            alert("Save mapping failed: " + e.message);
          }
        }

        // ── Import TSV/MD files into DB ──────────────────────────────────────────────
        async function handleImport() {
          setImporting(true);
          setImportMsg("");
          try {
            const r = await fetch("/api/import", { method: "POST" }).then((r) =>
              r.json(),
            );
            setImportMsg(
              `✓ Imported ${r.test_cases} test cases, ${r.prd_files} PRD files`,
            );
            setTimeout(() => setImportMsg(""), 4000);
            // Reload automap if a card file is open
            if (fileData?.cases) loadAutoMap(fileData.cases);
          } catch (e) {
            setImportMsg("⚠ " + e.message);
          }
          setImporting(false);
        }

        // ── Restore theme on mount + load tree ───────────────────────────────────────
        useEffect(() => {
          (async () => {
            const tid = await loadThemeIDB();
            if (tid) {
              const t = THEMES.find((x) => x.id === tid);
              if (t) {
                applyThemeVars(t);
                setThemeId(tid);
                themeRef.current?.setTheme(tid);
              }
            }
          })();
          loadTree();
          loadGDocs();
          fetch("/api/new-request")
            .then((r) => r.json())
            .then((d) => {
              if (d?.ok && Array.isArray(d.blocks) && d.blocks.length) {
                setRequestBlocks(normalizeIncomingRequestBlocks(d.blocks));
                setRequestSyncMeta({
                  loading: false,
                  saving: false,
                  error: "",
                  updatedAt: d.updatedAt || null,
                  updatedBy: d.updatedBy || null,
                });
              } else {
                setRequestSyncMeta((prev) => ({
                  ...prev,
                  loading: false,
                  error: d?.error || "",
                }));
              }
            })
            .catch((e) =>
              setRequestSyncMeta((prev) => ({
                ...prev,
                loading: false,
                error: "Sync failed: " + e.message,
              })),
            );
        }, []);

        // Live sidebar updates: server pings on any file/folder change → quiet tree refresh
        useEffect(() => {
          let es;
          try {
            es = new EventSource("/api/files/events");
            es.onmessage = () => refreshTree();
          } catch {}
          return () => {
            try {
              es && es.close();
            } catch {}
          };
        }, []);

        // Sync activeSection when selected changes
        useEffect(() => {
          if (selected?.sectionId) setActiveSection(selected.sectionId);
        }, [selected?.sectionId]);

        // ── Render sidebar tree nodes ────────────────────────────────────────────────
        function TreeDir({
          node,
          sectionId,
          pad,
          forceOpen,
          activePath,
          creating,
          creatingBusy,
          setCreating,
          createItem,
          children,
        }) {
          const inPath = activePath && activePath.startsWith(node.path + "\\");
          // persisted open/collapse per folder path; default collapsed except root-level or saved-open
          const [open, setOpen] = useState(
            () => folderOpenState(node.path, depthDefaultOpen(pad)) || inPath,
          );
          // auto-expand when the selected file lands inside this folder
          useEffect(() => {
            if (inPath) setOpen(true);
          }, [inPath]);
          const toggle = () =>
            setOpen((o) => {
              const n = !o;
              setFolderOpenState(node.path, n);
              return n;
            });
          const isOpen = forceOpen || open;
          return (
            <div>
              <div
                title={node.name}
                style={{
                  padding: `4px 8px 4px ${pad}px`,
                  display: "flex",
                  alignItems: "center",
                  gap: 5,
                  cursor: "pointer",

                    fontSize: 10,

                <span style={{ fontSize: 12, color: "#fbbf24", flexShrink: 0 }}>

                    color: "#fbbf24",

              {isOpen && (
                // guideline for open folder — vertical rule at this folder's indent, children keep their own pad
                <div style={{ position: "relative" }}>
                  <div
                    style={{
                      position: "absolute",
                      left: `${pad + 5}px`,
                      top: 0,
                      bottom: 0,
                      width: 1.5,
                      background: "rgba(253,230,138,0.35)",
                    }}
                  />
                  {children}
                </div>
              )}
            </div>
          );
        }
        // ponytail: only root folders open by default; deeper collapsed, but user toggle persists
        function depthDefaultOpen(pad) {
          return pad <= 12;
        }
        // persisted per-folder open/collapse (localStorage). Returns saved value or fallback.
        function folderOpenState(pathKey, fallback) {
          try {
            const raw = localStorage.getItem("qab-folder-open");
            if (!raw) return fallback;
            const m = JSON.parse(raw);
            return pathKey in m ? m[pathKey] : fallback;
          } catch {
            return fallback;
          }
        }
        function setFolderOpenState(pathKey, isOpen) {
          try {
            const m = JSON.parse(
              localStorage.getItem("qab-folder-open") || "{}",

        function renderTree(nodes, sectionId, depth = 0) {

        useEffect(() => {

            .then(([, api]) => {
              if (!api?.mountBlockNote)
                throw new Error("BlockNote mount missing");
              setBlockNoteState({
                loading: false,
                ready: true,
                error: "",
                rev: Date.now(),
                api,
              });

            .catch((e) => {
              console.error("BlockNote load failed", e);
              setBlockNoteState({
                loading: false,
                ready: false,
                error: e?.message || "load failed",
                rev: Date.now(),
              });
            });
          return () => {
            alive = false;
          };
        }, [mainNav]);

        function isLegacyRequestBlock(block) {
          return (
            !!block &&
            typeof block === "object" &&
            ("text" in block ||
              "level" in block ||
              block.type === "text" ||
              block.type === "bullet" ||
              block.type === "numbered" ||
              block.type === "todo")
          );
        }

        function rich(text) {
          return text ? [{ type: "text", text: String(text), styles: {} }] : [];
        }

        function legacyTypeToBlockNoteType(block) {
          if (block.type === "todo") return "checkListItem";
          if (block.type === "bullet") return "bulletListItem";
          if (block.type === "numbered") return "numberedListItem";
          return "paragraph";
        }

        function normalizeBlockNoteBlocks(input) {
          if (!Array.isArray(input)) return DEFAULT_REQUEST_BLOCKS;
          return input.map((block, idx) => {
            const next = { ...block };
            if (!next.id)
              next.id = `req-bn-${idx}-${Math.random().toString(36).slice(2, 6)}`;
            if (!next.type) next.type = "paragraph";
            if (!next.props || typeof next.props !== "object") next.props = {};
            if (!Array.isArray(next.content))
              next.content = rich(next.text || "");
            next.content = next.content.map((part) => ({
              type: "text",
              text: String(part?.text || ""),
              styles: { ...(part?.styles || {}) },
            }));
            if (!Array.isArray(next.children)) next.children = [];
            next.children = normalizeBlockNoteBlocks(next.children);
            if (next.type === "checkListItem")
              next.props = {
                ...next.props,
                checked: !!(next.props?.checked || next.checked),
              };
            if (next.type === "heading")
              next.props = {
                ...next.props,
                level: Math.min(
                  3,
                  Math.max(1, Number(next.props?.level || 1) || 1),
                ),
              };
            return next;
          });
        }

        function legacyBlocksToBlockNote(blocks) {
          if (!Array.isArray(blocks) || !blocks.length)
            return DEFAULT_REQUEST_BLOCKS;
          const roots = [];
          const stack = [];
          blocks.forEach((block, idx) => {
            const level = Math.max(0, Number(block?.level || 0) || 0);
            const next = {
              id: block.id || `req-legacy-${idx}`,
              type: legacyTypeToBlockNoteType(block || {}),
              props: block?.type === "todo" ? { checked: !!block.checked } : {},
              content: rich(block?.text || ""),
              children: [],
            };
            while (stack.length > level) stack.pop();
            const parent = stack[stack.length - 1];
            if (parent) parent.children.push(next);
            else roots.push(next);
            stack[level] = next;
          });
          return roots.length ? roots : DEFAULT_REQUEST_BLOCKS;
        }

        function normalizeIncomingRequestBlocks(blocks) {
          if (!Array.isArray(blocks) || !blocks.length)
            return DEFAULT_REQUEST_BLOCKS;
          return blocks.some(isLegacyRequestBlock)
            ? legacyBlocksToBlockNote(blocks)
            : normalizeBlockNoteBlocks(blocks);
        }

        const fallbackText = useMemo(() => {
          const lines = [];
          const walk = (blocks, depth = 0) => {
            (blocks || []).forEach((block) => {
              const text = Array.isArray(block.content)
                ? block.content.map((part) => part?.text || "").join("")
                : "";
              const prefix =
                block.type === "checkListItem"
                  ? `- [${block.props?.checked ? "x" : " "}] `
                  : block.type === "bulletListItem"
                    ? "- "
                    : block.type === "numberedListItem"
                      ? "1. "
                      : block.type === "heading"
                        ? `${"#".repeat(Math.min(3, Math.max(1, Number(block.props?.level || 1))))} `
                        : block.type === "quote"
                          ? "> "
                          : block.type === "codeBlock"
                            ? "```\n"
                            : "";
              lines.push(`${"  ".repeat(depth)}${prefix}${text}`.trimEnd());
              if (block.type === "codeBlock") lines.push("```");
              if (block.children?.length) walk(block.children, depth + 1);
            });
          };
          walk(requestBlocks);
          return lines.join("\n");
        }, [requestBlocks]);

        function parseFallbackText(value) {
          const lines = String(value || "").split(String.fromCharCode(10));
          const out = [];

          lines.forEach((line, idx) => {
            const raw = String(line || "")
              .split(String.fromCharCode(13))
              .join("");
            const trimmed = raw.trim();
            if (!trimmed) return;

            const spaces = raw.match(/^\s*/)?.[0]?.length || 0;
            const depth = Math.max(0, Math.floor(spaces / 2));
            let type = "paragraph";
            let text = trimmed;
            let props = {};
            const heading = trimmed.match(/^(#{1,3})\s+(.*)$/);
            if (heading) {
              type = "heading";
              props.level = heading[1].length;
              text = heading[2];
            } else if (/^- \[( |x)\]\s+/.test(trimmed)) {
              type = "checkListItem";
              props.checked = trimmed[3] === "x";
              text = trimmed.replace(/^- \[(?: |x)\]\s+/, "");
            } else if (/^-\s+/.test(trimmed)) {
              type = "bulletListItem";
              text = trimmed.replace(/^-\s+/, "");
            } else if (/^\d+\.\s+/.test(trimmed)) {
              type = "numberedListItem";
              text = trimmed.replace(/^\d+\.\s+/, "");
            } else if (/^>\s+/.test(trimmed)) {
              type = "quote";
              text = trimmed.replace(/^>\s+/, "");
            }
            out.push({
              id: `req-fallback-${idx}`,
              depth,
              type,
              props,
              content: rich(text),
              children: [],
            });
          });
          const roots = [];
          const stack = [];
          out.forEach((block) => {
            while (stack.length > block.depth) stack.pop();
            const next = {
              id: block.id,
              type: block.type,
              props: block.props,
              content: block.content,
              children: [],
            };
            const parent = stack[stack.length - 1];
            if (parent) parent.children.push(next);
            else roots.push(next);
            stack[block.depth] = next;
          });
          return roots.length ? roots : DEFAULT_REQUEST_BLOCKS;
        }

        function onFallbackTextChange(value) {
          setRequestBlocks(parseFallbackText(value));
        }

        function onRequestDocChange(doc) {
          setRequestBlocks(Array.isArray(doc) ? doc : DEFAULT_REQUEST_BLOCKS);
        }

        function retryBlockNoteLoad() {
          setBlockNoteState((prev) => ({
            ...prev,
            ready: false,
            error: "",

          setTimeout(() => setMainNav("new-request"), 0);

        // ── Workspace rooms view ────────────────────────────────────────────
        function renderRoomsView() {

        function renderWorkspaceSubView() {
          return window.WorkspaceModule.renderWorkspaceSubView({

                                    {sec.tree?.length > 0 ? (
                                      <div style={{ paddingBottom: 4 }}>
                                        {renderTree(sec.tree, sec.id)}
                                      </div>
                                    ) : (
                                      <div
                                        style={{
                                          padding: "8px 14px",
                                          fontSize: 10,
                                          color: "var(--text-5)",
                                        }}
                                      >
                                        {sec.remote
                                          ? "Belum ada dokumen di folder mirror"
                                          : "No files"}
                                      </div>
                                    )}
                                  </React.Fragment>
                                );
                              };
                              const active = allSections.find(
                                (s) => s.id === activeSection,
                              );
                              if (!active) {
                                return (
                                  <div style={{ flex: 1, overflowY: "auto" }}>
                                    {allSections.map((sec) =>
                                      SectionHeader(sec, false),
                                    )}
                                  </div>
                                );
                              }
                              const others = allSections.filter(
                                (s) => s.id !== active.id,
                              );
                              return (
                                <React.Fragment>
                                  {SectionHeader(active, true)}
                                  <div style={{ flex: 1, overflowY: "auto" }}>
                                    {SectionBody(active)}
                                  </div>
                                  {others.length > 0 && (
                                    <div
                                      style={{
                                        flexShrink: 0,
                                        borderTop: "1px solid var(--border-1)",
                                      }}
                                    >
                                      {others.map((sec) =>
                                        SectionHeader(sec, false),
                                      )}
                                    </div>
                                  )}
                                </React.Fragment>
                              );
                            })()}
                        </div>
                      </div>

                      {/* Resize handle */}
                      <div
                        onMouseDown={onResizeStart}
                        style={{
                          width: 4,
                          cursor: "col-resize",
                          flexShrink: 0,
                          background: "transparent",
                          borderRight: "1px solid var(--border-1)",
                        }}
                        onMouseEnter={(e) =>
                          (e.target.style.background = "var(--border-1)")
                        }
                        onMouseLeave={(e) =>
                          (e.target.style.background = "transparent")
                        }
                      />

                      {/* Content area */}
                      <div
                        style={{
                          flex: 1,
                          display: "flex",
                          flexDirection: "column",
                          overflow: "hidden",
                          background: "var(--app-bg)",
                        }}
                      >
                        {selected && (
                          <div
                            style={{
                              padding: "5px 14px",
                              borderBottom: "1px solid var(--border-1)",
                              background: "var(--sidebar-bg)",
                              flexShrink: 0,
                              fontSize: 10,
                              color: "var(--text-4)",
                              display: "flex",
                              alignItems: "center",
                              gap: 6,
                            }}
                          >
                            <span style={{ color: "var(--text-5)" }}>
                              {selected.sectionId}
                            </span>
                            <span style={{ color: "var(--text-6)" }}>/</span>
                            <span style={{ color: "var(--text-3)" }}>
                              {selected.name}
                            </span>
                          </div>
                        )}
                        {renderContent()}
                      </div>
                    </div>
                  );
                };

                // ── Workspace: main content area (file viewer) ──────────────
                if (mainNav === "workspace") {
                  return (
                    <div
                      style={{
                        flex: 1,
                        display: "flex",
                        flexDirection: "column",
                        overflow: "hidden",
                        background: "var(--app-bg)",
                      }}
                    >
                      {selected && (
                        <div
                          style={{
                            padding: "4px 14px",
                            borderBottom: "1px solid var(--border-1)",
                            background: "var(--sidebar-bg)",
                            flexShrink: 0,
                            display: "flex",
                            alignItems: "center",
                            gap: 4,
                            fontFamily: "monospace",
                          }}
                        >
                          <span
                            style={{ fontSize: 10, color: "var(--text-5)" }}
                          >
                            PRDanalisis
                          </span>
                          <span style={{ fontSize: 8, color: "var(--text-6)" }}>
                            /
                          </span>
                          <span
                            style={{
                              fontSize: 10,
                              color: "#fbbf24",
                              fontWeight: 500,
                            }}
                          >
                            {selected.sectionId}
                          </span>
                          <span style={{ fontSize: 8, color: "var(--text-6)" }}>
                            /
                          </span>
                          <span
                            style={{
                              fontSize: 10,
                              color: "var(--text-2)",
                              fontWeight: 400,
                            }}
                          >
                            {selected.name}
                          </span>
                        </div>
                      )}
                      {renderContent()}
                    </div>
                  );
                }

                // ── Big Picture (native render from prototype) ─────────────
                if (mainNav === "bigpic") {
                  return <BigPictureView page={0} themeId={themeId} />;
                }
                // ── Roadmap (interactive, M1) ──────────────────────────────
                if (mainNav === "roadmap") {
                  return <RoadmapView themeId={themeId} />;
                }

                // ── Memory ─────────────────────────────────────────────────
                if (mainNav === "tracker")
                  return (
                    <div
                      style={{
                        flex: 1,
                        minHeight: 0,
                        overflow: "hidden",
                        background: "var(--app-bg)",
                      }}
                    >
                      <window.TrackerModule.TrackerView
                        user={user}
                        onDirtyChange={handleTrackerDirty}
                        tab={trackerTab}
                        onTabChange={setTrackerTab}
                        selectedSheet={trackerSheet}
                        onSelectedSheetChange={setTrackerSheet}
                        onSheetTabsChange={setTrackerSheetTabs}
                      />
                    </div>
                  );
                if (mainNav === "monitoring")
                  return (
                    <div
                      style={{
                        flex: 1,
                        minHeight: 0,
                        overflow: "auto",
                        background: "var(--app-bg)",
                      }}
                    >
                      <window.MonitoringModule.MonitoringView />
                    </div>
                  );
                if (mainNav === "new-request") return renderNewRequestView();
                if (mainNav === "memory") return renderMemoryView();

                // ── Settings ───────────────────────────────────────────────
                return (
                  <SettingsPage
                    status={gdocsStatus}
                    onRefreshStatus={loadGDocs}
                    onSwitchTheme={switchTheme}
                    currentTheme={themeId}
                    onImport={handleImport}
                    importing={importing}
                    importMsg={importMsg}
                    user={user}
                  />
                );
              })()}
            </div>
            </div>

            {/* Run Panel overlay (global) */}
            {runCase && (
              <RunPanel
                caseId={runCase.caseId}
                specFile={runCase.specFile}
                grepPattern={runCase.grepPattern}
                onClose={() => setRunCase(null)}
              />
            )}
          </div>
        );
      }

      // ─── BOOTSTRAP ────────────────────────────────────────────────────────────────
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
