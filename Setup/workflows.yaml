      - from: trigger_1
        to: orchestrator_1
      - from: orchestrator_1
        to: change_intake_1
      - from: change_intake_1
        to: quick_assessment_1
      - from: quick_assessment_1
        to: gate_b_1
      - from: coder_automation_1
        to: qa_post_1
