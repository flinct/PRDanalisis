    edges:
      - from: trigger_1
        to: orchestrator_1
      - from: orchestrator_1
        to: change_intake_1
      - from: change_intake_1
        to: prd_v0_1
      - from: prd_v0_1
        to: analyst_1
      - from: analyst_1
        to: gate_a_1
      - from: prd_writer_1
        to: qa_pre_1
      - from: qa_pre_1
        to: gate_b_1
      - from: coder_automation_1
        to: qa_post_1
      - from: qa_post_1
        to: gate_c_1
      - from: gate_a_1
        to: prd_writer_1
        label: APPROVE_WITH_NOTES
      - from: gate_a_1
        to: analyst_1
        label: REVISE_ASSESSMENT
        loop_back: true
      - from: gate_a_1
        to: change_intake_1
        label: REVISE_PRD_DRAFT
        loop_back: true
      - from: gate_b_1
        to: coder_automation_1
        label: APPROVED
      - from: gate_b_1
        to: coder_automation_1
        label: APPROVED_WITH_CAUTION
      - from: gate_b_1
        to: prd_writer_1
        label: REVISE_PRD
        loop_back: true
      - from: gate_c_1
        to: coder_automation_1
        label: REVISE_CODER
        loop_back: true
      - from: gate_c_1
        to: qa_post_1
        label: REVISE_QA
        loop_back: true
      - from: gate_c_1
        to: change_intake_1
        label: REOPEN_REQUIREMENT
        loop_back: true
    gates:
      gate_a:
        reviewer_role: reviewer
        input_roles:
          - analyst
        input_artifacts:
          - Change Intake Brief
          - Assessment Report
          - PRD v0
      gate_b:
        reviewer_role: reviewer
        input_roles:
          - prd_writer
          - qa_agent
        input_artifacts:
          - Change Intake Brief
          - PRD requirement-ready
          - Assessment Report
          - QA Pre-Implementation Review
          - coverage / testcase strategy
          - automation candidate mapping
      gate_c:
        reviewer_role: reviewer
        input_roles:
          - coder_automation
          - qa_agent
        input_artifacts:
          - implementation output
          - QA Post-Implementation Validation
    freeze:
      enabled: true
      starts_after: reviewer_gate_b
  fast_lane:
