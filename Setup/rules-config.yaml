version: 2
rule_profile: default
source_of_truth:
  agent_instruction: Rules/core/task-router.md
  workflow_rule: Rules/core/task-router.md
  structure_rule: Rules/profiles/satuinbox.yml
  qa_analysis_rule: Rules/core/analysis-and-risk.md
  test_case_rule: Rules/core/test-design.md
  automation_bridge_rule: Rules/integrations/satuinbox-playwright-bridge.md
  requirements_lifecycle_rule: Rules/core/change-management.md
artifacts:
  change_intake_brief:
    logical_name: Change Intake Brief
    persisted_filename_suffix: -change-intake-brief.md
    owner_default: analyst
    template: Assessments/templates/Setup/change-intake-brief-template.md
  analysis:
    logical_name: Assessment Report
    persisted_filename_suffix: -qa-assessment.md
    owner_default: analyst
    canonical_template: Assessments/templates/qa-assessment-report-template.md
    operational_template: Assessments/templates/Setup/assessment-report-template.md
  qa_pre:
    logical_name: QA Pre-Implementation Review
    template: Assessments/templates/Setup/qa-pre-implementation-review-template.md
  qa_post:
    logical_name: QA Post-Implementation Validation
    template: Assessments/templates/Setup/qa-post-implementation-validation-template.md
  reviewer:
    logical_name: Reviewer Decision
    template: Assessments/templates/Setup/reviewer-decision-template.md
  automation_mapping:
    logical_name: Automation Mapping
    template: Assessments/templates/Setup/automation-mapping-template.md
gates:
  gate_a:
    allowed_statuses:
      - APPROVE_WITH_NOTES
      - REVISE_ASSESSMENT
      - REVISE_PRD_DRAFT
      - HOLD
    reviews:
      - Change Intake Brief
      - Assessment Report
      - PRD v0
  gate_b:
    allowed_statuses:
      - APPROVED
      - APPROVED_WITH_CAUTION
      - REVISE_PRD
      - HOLD
    reviews:
      - Change Intake Brief
      - Assessment Report
      - PRD requirement-ready
      - QA Pre-Implementation Review
      - coverage / testcase strategy
      - automation candidate mapping
  gate_c:
    allowed_statuses:
      - FINAL_APPROVE
      - REVISE_CODER
      - REVISE_QA
      - REOPEN_REQUIREMENT
    reviews:
      - implementation output
      - QA Post-Implementation Validation
freeze_policy:
  enabled: true
  trigger_gate: gate_b
  action_on_post_freeze_requirement_change: reopen_requirement_lane
phase_zero:
  enabled: true
  rule: Rules/core/change-management.md
  trigger_conditions:
    - request adds, changes, removes, deprecates, or revives product behavior
    - request references undeveloped PRD or partial implementation
    - request may touch shared entity, lifecycle, RBAC, API contract
  required_artifact: Change Intake Brief
  routing_decisions:
    - ROUTE_NEW_PRD
    - ROUTE_PATCH_EXISTING_PRD
    - ROUTE_REWRITE_EXISTING_PRD
    - ROUTE_REVIVE_UNDEVELOPED_PRD
    - ROUTE_DEPRECATION_REMOVAL
    - SPLIT_REQUEST
    - HOLD_NEEDS_DISCOVERY
allowed_workflow_modes:
  - full_lane
  - fast_lane
readonly_canonical_policies:
  - assessment_report_owner_default
  - reviewer_gate_schema
  - requirement_package_freeze
  - qa_pre_post_split
  - phase_zero_change_intake
