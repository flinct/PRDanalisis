<!-- Statistic / Laporan Page -->
<style>
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.stat-big{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center}
.stat-big .val{font-size:32px;font-weight:700}.stat-big .lbl{font-size:12px;color:var(--muted);margin-top:4px}
.chart-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.chart-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.chart-box h4{font-size:14px;margin-bottom:12px}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:180px;padding-top:10px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
.bar{background:var(--accent);border-radius:4px 4px 0 0;min-width:28px;transition:.3s;width:100%}
.bar-label{font-size:10px;color:var(--muted)}
.bar-val{font-size:11px;font-weight:600}
.agent-table{width:100%;border-collapse:collapse;font-size:13px}
.agent-table th{text-align:left;padding:8px 10px;font-size:11px;color:var(--muted);border-bottom:2px solid var(--border);text-transform:uppercase}
.agent-table td{padding:8px 10px;border-bottom:1px solid var(--border)}
</style>

<div class="page-header"><h1>📊 Laporan</h1></div>
<div class="page-body">
  <div class="stats-grid">
    <div class="stat-big"><div class="val" id="st-total"></div><div class="lbl">Total Percakapan</div></div>
    <div class="stat-big"><div class="val" id="st-week"></div><div class="lbl">Minggu Ini</div></div>
    <div class="stat-big"><div class="val" id="st-avg"></div><div class="lbl">Rata-rata Respons</div></div>
    <div class="stat-big"><div class="val" id="st-rate"></div><div class="lbl">Resolution Rate</div></div>
  </div>
  <div class="chart-row">
    <div class="chart-box">
      <h4>Percakapan per Hari (7 hari terakhir)</h4>
      <div class="bar-chart" id="weeklyChart"></div>
    </div>
    <div class="chart-box">
      <h4>Channel Distribution</h4>
      <div class="bar-chart" id="channelChart"></div>
    </div>
  </div>
  <div class="chart-box" style="margin-bottom:16px">
    <h4>Performa Agen</h4>
    <table class="agent-table">
      <thead><tr><th>Agen</th><th>Handled</th><th>Avg Response</th><th>CSAT</th></tr></thead>
      <tbody id="agentPerf"></tbody>
    </table>
  </div>
</div>

<script>
const s=DB.statistics;
document.getElementById('st-total').textContent=s.conversations.total.toLocaleString('id-ID');
document.getElementById('st-week').textContent=s.conversations.thisWeek;
document.getElementById('st-avg').textContent=s.conversations.avgResponseTime;
document.getElementById('st-rate').textContent=s.conversations.resolutionRate;

// Weekly bar chart
const days=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];
const maxW=Math.max(...s.weekly);
document.getElementById('weeklyChart').innerHTML=s.weekly.map((v,i)=>`<div class="bar-col"><div class="bar-val">${v}</div><div class="bar" style="height:${(v/maxW)*150}px"></div><div class="bar-label">${days[i]}</div></div>`).join('');

// Channel chart
const ch=s.channels;
const maxC=Math.max(ch.whatsappApi,ch.whatsappWeb);
document.getElementById('channelChart').innerHTML=`
  <div class="bar-col"><div class="bar-val">${ch.whatsappApi}</div><div class="bar" style="height:${(ch.whatsappApi/maxC)*150}px;background:#25d366"></div><div class="bar-label">WA API</div></div>
  <div class="bar-col"><div class="bar-val">${ch.whatsappWeb}</div><div class="bar" style="height:${(ch.whatsappWeb/maxC)*150}px;background:#128c7e"></div><div class="bar-label">WA Web</div></div>`;

// Agent performance
document.getElementById('agentPerf').innerHTML=s.agents.map(a=>`<tr>
  <td><b>${a.name}</b></td><td>${a.handled}</td><td>${a.avgResponse}</td><td>⭐ ${a.csat}</td>
</tr>`).join('');
</script>
