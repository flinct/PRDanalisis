<!-- Ticketing Page — ticket list, filters, CRUD -->
<style>
.tkt-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tkt-toolbar input{flex:1;min-width:200px;padding:7px 12px;border:1px solid var(--border);border-radius:20px;font-size:13px;background:var(--card)}
.tkt-toolbar input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.tkt-priority-chip{padding:5px 12px;border-radius:16px;border:1px solid var(--border);font-size:12px;cursor:pointer;background:var(--card)}
.tkt-priority-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.data-table .tkt-row{cursor:pointer;transition:.1s}
.data-table .tkt-row:hover{background:rgba(79,70,229,.04)}
.data-table .tkt-row.expanded{background:rgba(79,70,229,.06)}
.tkt-detail td{padding:0 12px 12px;background:rgba(79,70,229,.03)}
.tkt-detail-inner{display:flex;gap:24px;padding:12px 0;font-size:13px}
.tkt-detail-inner .dk{font-size:11px;color:var(--muted);margin-bottom:2px}
.tkt-detail-inner .dv{font-weight:600}
.tkt-detail-actions{display:flex;gap:6px;margin-left:auto;align-items:flex-start}
.priority-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.priority-badge.high{background:#fef2f2;color:#dc2626}.priority-badge.medium{background:#fef3c7;color:#b45309}.priority-badge.low{background:#f0fdf4;color:#15803d}
.stat-row{display:flex;gap:12px;padding:0 24px 12px}
.tkt-count{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 18px;text-align:center;flex:1}
.tkt-count .val{font-size:22px;font-weight:700}.tkt-count .lbl{font-size:11px;color:var(--muted)}
</style>

<div class="page-header">
  <h1>🎫 Tiket</h1>
  <button class="btn primary" onclick="openCreateTkt()">+ Tiket Baru</button>
</div>

<div class="stat-row" id="tktStats"></div>

<div class="page-filters">
  <div id="statusChips">
    <span class="filter-chip active" onclick="setTktStatusFilter(this,'all')">Semua</span>
    <span class="filter-chip" onclick="setTktStatusFilter(this,'open')">🔵 Open</span>
    <span class="filter-chip" onclick="setTktStatusFilter(this,'pending')">🟡 Pending</span>
    <span class="filter-chip" onclick="setTktStatusFilter(this,'resolved')">🟢 Resolved</span>
    <span class="filter-chip" onclick="setTktStatusFilter(this,'closed')">⚪ Closed</span>
  </div>
  <select id="tktPriorityFilter" onchange="renderTktTable()" style="padding:5px 10px;border:1px solid var(--border);border-radius:16px;font-size:12px;background:var(--card);cursor:pointer">
    <option value="all">Semua Prioritas</option>
    <option value="high">🔴 Tinggi</option>
    <option value="medium">🟡 Sedang</option>
    <option value="low">🟢 Rendah</option>
  </select>
  <div class="tkt-toolbar" style="margin-left:auto;flex:1;max-width:320px">
    <input type="text" id="tktSearch" placeholder="Cari tiket…" oninput="renderTktTable()">
  </div>
</div>

<div class="page-body">
  <table class="data-table">
    <thead>
      <tr><th>ID</th><th>Subjek</th><th>Kontak</th><th>Status</th><th>Prioritas</th><th>Agen</th><th>Dibuat</th></tr>
    </thead>
    <tbody id="tktBody"></tbody>
  </table>
  <div id="tktEmpty" style="display:none;text-align:center;padding:40px;color:var(--muted)">
    <div style="font-size:36px;opacity:.4;margin-bottom:8px">🎫</div>
    Tidak ada tiket ditemukan
  </div>
</div>

<!-- Create/Edit Modal -->
<div class="modal-overlay" id="tktModal">
  <div class="modal">
    <h3 id="tktModalTitle">Buat Tiket Baru</h3>
    <label>Subjek<input type="text" id="tktSubject" placeholder="Ringkasan masalah"></label>
    <label>Kontak<select id="tktContact"><option value="">— Pilih Kontak —</option></select></label>
    <label>Prioritas<select id="tktPriority"><option value="medium">Sedang</option><option value="high">Tinggi</option><option value="low">Rendah</option></select></label>
    <label>Agen<select id="tktAssignee"><option value="">— Tidak Ditugaskan —</option></select></label>
    <div class="modal-actions">
      <button class="btn" onclick="closeTktModal()">Batal</button>
      <button class="btn primary" onclick="saveTkt()">Simpan</button>
    </div>
  </div>
</div>

<!-- Delete Confirm -->
<div class="modal-overlay" id="tktDelModal">
  <div class="modal">
    <h3>Hapus Tiket</h3>
    <p style="font-size:13px;color:var(--muted);margin-bottom:4px">Apakah Anda yakin ingin menghapus tiket ini? Tindakan ini tidak dapat dibatalkan.</p>
    <div class="modal-actions">
      <button class="btn" onclick="document.getElementById('tktDelModal').classList.remove('open')">Batal</button>
      <button class="btn danger" onclick="confirmDelTkt()">Hapus</button>
    </div>
  </div>
</div>

<script>
let tktStatusFilter='all', tktExpandedId=null, tktEditId=null, tktDelId=null;

function setTktStatusFilter(el,status){
  tktStatusFilter=status;
  document.querySelectorAll('#statusChips .filter-chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  renderTktTable();
}

function renderTktStats(){
  const tkts=DB.tickets||[];
  const open=tkts.filter(t=>t.status==='open').length;
  const pending=tkts.filter(t=>t.status==='pending').length;
  const resolved=tkts.filter(t=>t.status==='resolved').length;
  const closed=tkts.filter(t=>t.status==='closed').length;
  document.getElementById('tktStats').innerHTML=`
    <div class="tkt-count"><div class="val">${tkts.length}</div><div class="lbl">Total</div></div>
    <div class="tkt-count"><div class="val" style="color:#2563eb">${open}</div><div class="lbl">Open</div></div>
    <div class="tkt-count"><div class="val" style="color:#b45309">${pending}</div><div class="lbl">Pending</div></div>
    <div class="tkt-count"><div class="val" style="color:#15803d">${resolved}</div><div class="lbl">Resolved</div></div>
    <div class="tkt-count"><div class="val" style="color:#6b7280">${closed}</div><div class="lbl">Closed</div></div>`;
}

function renderTktTable(){
  const q=(document.getElementById('tktSearch')?.value||'').toLowerCase();
  const pf=document.getElementById('tktPriorityFilter').value;
  let tkts=(DB.tickets||[]).filter(t=>{
    if(tktStatusFilter!=='all'&&t.status!==tktStatusFilter)return false;
    if(pf!=='all'&&t.priority!==pf)return false;
    if(q){
      const ct=DB.contacts.find(c=>c.id===t.contactId);
      const haystack=(t.subject+' '+(ct?.name||'')+' '+t.id).toLowerCase();
      if(!haystack.includes(q))return false;
    }
    return true;
  });
  tkts.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const body=document.getElementById('tktBody');
  const empty=document.getElementById('tktEmpty');
  if(!tkts.length){body.innerHTML='';empty.style.display='';renderTktStats();return}
  empty.style.display='none';
  body.innerHTML=tkts.map(t=>{
    const ct=DB.contacts.find(c=>c.id===t.contactId);
    const ag=DB.agents.find(a=>a.id===t.assignee);
    const expanded=t.id===tktExpandedId;
    const statusCls=t.status;
    const priCls=t.priority;
    const priLabel={high:'Tinggi',medium:'Sedang',low:'Rendah'}[t.priority]||t.priority;
    const row=`<tr class="tkt-row${expanded?' expanded':''}" onclick="toggleTktDetail('${t.id}')">
      <td><code style="font-size:11px;color:var(--muted)">${t.id.slice(0,8)}</code></td>
      <td style="font-weight:600">${t.subject}</td>
      <td>${ct?ct.name:'-'}</td>
      <td><span class="status ${statusCls}">${t.status}</span></td>
      <td><span class="priority-badge ${priCls}">${priLabel}</span></td>
      <td>${ag?ag.name:'-'}</td>
      <td style="font-size:12px;color:var(--muted)">${fmtDate(t.createdAt)}</td>
    </tr>`;
    if(!expanded)return row;
    const detail=`<tr class="tkt-detail"><td colspan="7">
      <div class="tkt-detail-inner">
        <div><div class="dk">ID Tiket</div><div class="dv">${t.id}</div></div>
        <div><div class="dk">Kontak</div><div class="dv">${ct?ct.name:'-'} ${ct?'('+ct.phone+')':''}</div></div>
        <div><div class="dk">Agen</div><div class="dv">${ag?ag.name:'Belum ditugaskan'}</div></div>
        <div><div class="dk">Dibuat</div><div class="dv">${fmtDate(t.createdAt)} ${fmtTime(t.createdAt)}</div></div>
        <div class="tkt-detail-actions">
          <select class="btn" style="font-size:12px" onchange="changeTktStatus('${t.id}',this.value)" onclick="event.stopPropagation()">
            ${['open','pending','resolved','closed'].map(s=>`<option value="${s}"${t.status===s?' selected':''}>${s}</option>`).join('')}
          </select>
          <button class="btn" onclick="event.stopPropagation();openEditTkt('${t.id}')" style="font-size:12px">✏️ Edit</button>
          <button class="btn danger" onclick="event.stopPropagation();openDelTkt('${t.id}')" style="font-size:12px">🗑️ Hapus</button>
        </div>
      </div>
    </td></tr>`;
    return row+detail;
  }).join('');
  renderTktStats();
}

function toggleTktDetail(id){
  tktExpandedId=tktExpandedId===id?null:id;
  renderTktTable();
}

function changeTktStatus(id,status){
  dbUpdate('tickets',id,{status});
  showToast('Status tiket diperbarui');
  renderTktTable();
}

function populateModalDropdowns(){
  const ctSel=document.getElementById('tktContact');
  ctSel.innerHTML='<option value="">— Pilih Kontak —</option>'+(DB.contacts||[]).map(c=>`<option value="${c.id}">${c.name} (${c.phone})</option>`).join('');
  const agSel=document.getElementById('tktAssignee');
  agSel.innerHTML='<option value="">— Tidak Ditugaskan —</option>'+(DB.agents||[]).map(a=>`<option value="${a.id}">${a.name}</option>`).join('');
}

function openCreateTkt(){
  tktEditId=null;
  document.getElementById('tktModalTitle').textContent='Buat Tiket Baru';
  document.getElementById('tktSubject').value='';
  document.getElementById('tktPriority').value='medium';
  populateModalDropdowns();
  document.getElementById('tktContact').value='';
  document.getElementById('tktAssignee').value='';
  document.getElementById('tktModal').classList.add('open');
}

function openEditTkt(id){
  const t=dbFind('tickets',id);if(!t)return;
  tktEditId=id;
  document.getElementById('tktModalTitle').textContent='Edit Tiket';
  populateModalDropdowns();
  document.getElementById('tktSubject').value=t.subject;
  document.getElementById('tktContact').value=t.contactId||'';
  document.getElementById('tktPriority').value=t.priority;
  document.getElementById('tktAssignee').value=t.assignee||'';
  document.getElementById('tktModal').classList.add('open');
}

function closeTktModal(){
  document.getElementById('tktModal').classList.remove('open');
}

function saveTkt(){
  const subject=document.getElementById('tktSubject').value.trim();
  if(!subject){showToast('Subjek wajib diisi');return}
  const data={
    subject,
    contactId:document.getElementById('tktContact').value,
    priority:document.getElementById('tktPriority').value,
    assignee:document.getElementById('tktAssignee').value
  };
  if(tktEditId){
    dbUpdate('tickets',tktEditId,data);
    showToast('Tiket diperbarui');
  } else {
    dbAdd('tickets',{id:genId('tkt'),...data,status:'open',teamId:'',conversationId:'',createdAt:new Date().toISOString()});
    showToast('Tiket dibuat');
  }
  closeTktModal();
  renderTktTable();
}

function openDelTkt(id){tktDelId=id;document.getElementById('tktDelModal').classList.add('open')}
function confirmDelTkt(){
  if(tktDelId){dbRemove('tickets',tktDelId);showToast('Tiket dihapus');tktDelId=null}
  document.getElementById('tktDelModal').classList.remove('open');
  tktExpandedId=null;
  renderTktTable();
}

// Init
renderTktTable();
</script>
